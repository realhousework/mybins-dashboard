<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>myBins Roster Planner — REVIEW</title><style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#f4f6f4;color:#17201a;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 70px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid #2e8b57;padding-bottom:12px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.02em}.logo b{color:#2e8b57}
.asof{font-size:12.5px;background:#e7f4ec;color:#0f7a43;border:1px solid #cfe9d9;border-radius:999px;padding:4px 12px;font-weight:700}
.sub{color:#5b6b60;font-size:13px;margin:8px 0 2px}
.ctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin:16px 0 6px}
label.fl{font-size:11px;color:#5b6b60;text-transform:uppercase;font-weight:700;letter-spacing:.03em;display:block;margin-bottom:3px}
.fin{padding:9px 11px;border:1px solid #cfe0d6;border-radius:8px;font:inherit;font-size:14px;background:#fff}
.rotbadge{font-size:12px;font-weight:800;background:#eef3f0;color:#2e8b57;border:1px solid #cfe9d9;border-radius:999px;padding:6px 13px}
.dow{font-size:16px;font-weight:800}
.spacer{flex:1}
.btn{border:1px solid #2e8b57;background:#2e8b57;color:#fff;font:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:9px 15px;cursor:pointer}
.btn.ghost{background:#fff;color:#2e8b57}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.saved{font-size:12.5px;color:#1a7a43;font-weight:700;align-self:center}
.summary{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 2px;font-size:12.5px;color:#5b6b60}
.summary b{color:#17201a}
.rec{border-radius:10px;padding:10px 14px;font-size:13.5px;margin:8px 0;display:flex;gap:9px;align-items:flex-start}
.rec .ic{font-weight:800}
.rec.warn{background:#fff8ec;border:1px solid #f0e2c4;color:#7a5e12}
.rec.bad{background:#fde8e4;border:1px solid #f3c9bf;color:#8a2f1a}
.rec.info{background:#eaf1fb;border:1px solid #cfe0f3;color:#2a4a7a}
.rec.ok{background:#e7f4ec;border:1px solid #cfe9d9;color:#1a5a34}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:13px;margin-top:6px}
.card{background:#fff;border:1px solid #e3eae5;border-radius:12px;padding:13px 15px}
.card.flagged{border-color:#f0e2c4;box-shadow:0 0 0 2px #fbe9c6 inset}
.card.conflict{border-color:#f3c9bf;box-shadow:0 0 0 2px #fbd9cf inset}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.ava{width:30px;height:30px;border-radius:50%;background:#2e8b57;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.who{font-weight:800;font-size:15px;border:0;background:transparent;color:#17201a;cursor:pointer;flex:1;padding:3px 4px;border-radius:7px;appearance:none;-webkit-appearance:none}
.who:hover{background:#f1f5f2}
.vehsel{font-size:11px;font-weight:800;color:#2e8b57;background:#eef3f0;border:1px solid #cfe9d9;border-radius:999px;padding:4px 10px;cursor:pointer;appearance:none;-webkit-appearance:none}
.rx{border:0;background:transparent;color:#b4452b;cursor:pointer;font-size:13px;font-weight:700;padding:2px 5px;border-radius:6px}
.rx:hover{background:#fde8e4}
.runs{margin-top:4px}
.job{border-top:1px solid #eef2ef;padding:8px 0;display:flex;gap:9px;align-items:center}
.job:first-of-type{border-top:0}
.rt{font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;flex:none}
.rt-IN{background:#e3eefb;color:#2f5fb3}.rt-OUT{background:#e7f4ec;color:#1a7a43}.rt-CLEAN{background:#efe3fb;color:#6b2fb3}.rt-VEG{background:#eef7dd;color:#5a7a1a}
.rn{flex:1;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{font-size:11.5px;color:#8a988f;font-variant-numeric:tabular-nums;font-weight:700}
.rmv{border:1px solid #e3eae5;background:#fff;color:#5b6b60;border-radius:6px;font-size:13px;cursor:pointer;padding:1px 7px;line-height:1.4}
.rmv:hover{border-color:#2e8b57;color:#2e8b57}
.flagline{font-size:12px;color:#8a6d1a;background:#fff8ec;border:1px solid #f0e2c4;border-radius:8px;padding:6px 9px;margin-top:8px}
.cfline{font-size:12px;color:#8a2f1a;background:#fde8e4;border:1px solid #f3c9bf;border-radius:8px;padding:6px 9px;margin-top:8px}
.cfoot{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.cfoot .n{font-size:11.5px;color:#8a988f;margin-right:auto}
.addbar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.unassigned{background:#fff8ec;border:1px solid #f0e2c4;border-radius:12px;padding:13px 15px;margin-top:14px}
.unassigned h3{margin:0 0 4px;font-size:14px;color:#7a5e12}
.unassigned .job{border-top-color:#f0e2c4}
.menu{position:fixed;z-index:60;background:#fff;border:1px solid #e3eae5;border-radius:10px;padding:5px;box-shadow:0 12px 34px rgba(0,0,0,.14);min-width:180px;max-height:320px;overflow:auto}
.menu div{padding:8px 11px;border-radius:7px;cursor:pointer;font-size:13.5px}
.menu div:hover{background:#e7f4ec;color:#1a5a34}
.menu .hd{color:#8a988f;font-size:11px;cursor:default;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.menu .hd:hover{background:transparent;color:#8a988f}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17201a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
.toast.show{opacity:1}
.loading{color:#8a988f;padding:40px 0;text-align:center}
.share{border:1px solid #cfe9d9;background:#eef3f0;color:#2e8b57;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;padding:1px 7px;line-height:1.4}
.share:hover{background:#e0efe6}
.helpers{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px 26px}
.hchip{display:inline-flex;align-items:center;gap:5px;background:#eef3f0;border:1px solid #cfe9d9;border-radius:999px;padding:2px 4px 2px 9px;font-size:11.5px;color:#1a5a34;font-weight:700}
.hchip .hv{font-size:10px;font-weight:800;color:#2e8b57;background:#fff;border:1px solid #cfe9d9;border-radius:999px;padding:1px 5px;cursor:pointer;appearance:none;-webkit-appearance:none}
.hchip .hh{width:30px;border:1px solid #cfe9d9;border-radius:6px;font:inherit;font-size:11px;font-weight:700;text-align:center;padding:1px 2px;background:#fff;color:#1a5a34}
.hchip .hh::placeholder{color:#9bb3a6;font-weight:600}
.hchip .hlead{border:0;background:transparent;color:#5b6b60;cursor:pointer;font-size:11px;font-weight:700;padding:1px 3px;border-radius:5px}
.hchip .hlead:hover{background:#dbebe1;color:#1a5a34}
.hchip .hx{border:0;background:transparent;color:#b4452b;cursor:pointer;font-size:12px;font-weight:800;padding:0 3px;border-radius:5px}
.hchip .hx:hover{background:#fde8e4}
.hchip .tbc{color:#8a7a4a;font-weight:600;font-style:italic}
.assist{display:flex;gap:7px;align-items:center;border-top:1px dashed #d7e6dd;padding:7px 0 2px;margin-top:2px;font-size:12.5px;color:#1a6a3c}
.assist .ab{font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;background:#e7f4ec;color:#1a7a43;flex:none}
.assist .an{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.assist .ah{font-size:11px;color:#5b6b60;font-weight:700}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
  <header>
    <div class="logo">my<b>Bins</b> Roster Planner <span style="font-size:11px;font-weight:800;background:#fff3cd;color:#8a6d1a;border:1px solid #f0e2c4;border-radius:999px;padding:3px 9px;vertical-align:middle">REVIEW</span></div>
    <div class="asof" id="asof">loading…</div>
  </header>
  <div class="sub">Open a day — the roster Wes normally builds is already suggested from history. Adjust for anything unusual, then save.</div>

  <div class="ctl">
    <div><label class="fl">Date</label><input type="date" id="date" class="fin"></div>
    <div><span class="dow" id="dow"></span> <span class="rotbadge" id="rot"></span></div>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="reset">Reset to suggested</button>
    <button class="btn" id="save">Save plan</button>
    <span class="saved" id="saved"></span>
  </div>
  <div class="summary" id="summary"></div>
  <div id="mowing"></div>
  <div id="exc"></div>
  <div id="main"><div class="loading">Loading roster…</div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
var FEED=null, DATE=null, DOW=null, ROT=null, STATE=null, VERSION=0, SAVING=false, DIRTY=false, CONFLICT=null;
var DEMO=/[?&]demo\b/.test(location.search||'');
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function initials(n){return (n||'?').split(/\s+/).map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();}
function first(n){return (n||'').split(/\s+/)[0];}
function rotationOf(iso){ // Monday of anchor week = W1, fortnightly
  var anchor=FEED.rotationAnchorMon||'2026-11-09';
  var d=new Date(iso+'T12:00:00Z'); var dow=(d.getUTCDay()+6)%7; var mon=new Date(d); mon.setUTCDate(d.getUTCDate()-dow);
  var a=new Date(anchor+'T12:00:00Z'); var weeks=Math.round((mon-a)/(7*864e5));
  return (((weeks%2)+2)%2===0)?'W1':'W2';
}
function dowName(iso){return new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',timeZone:'UTC'});}
function mondayOf(iso){ var d=new Date(iso+'T12:00:00Z'); var dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow); return d.toISOString().slice(0,10); }
function shortDay(iso){ return new Date(iso+'T12:00:00Z').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}); }

/* ============ MOWING COMMITMENTS (read-only from Blake's myMowing handover) ============
   Wes sees, at the top of the day he is planning, exactly which staff and vehicles Blake has
   already committed to mowing that day — actual hours, full/part-day, and whether the plan is
   confirmed. Nothing here writes to myMowing. If Blake has not marked the week "Ready for Wes",
   or changed it afterwards, Wes is clearly warned NOT to assume people/trucks are free. */
var MOWING=null;              // last /api/mowing-handover response for the current week
var MOWING_WEEK=null;         // which Monday MOWING is for
function mowDemoSample(mon){
  function d(n){ var x=new Date(mon+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
  function emp(name,s,e,h,part,veh,tc){ return {name:name,start:s,end:e,hours:h,part:part,vehicle:veh,timingConfirmed:tc!==false}; }
  function veh(name,s,e,h,part,tc){ return {name:name,start:s,end:e,hours:h,part:part,timingConfirmed:tc!==false}; }
  var days={};
  days[d(0)]={employees:[emp('Blake','7:00am','3:30pm',8.5,false,'HOPPER'),emp('Ben','7:00am','11:00am',4,true,'HOPPER'),emp('Julen','7:00am','3:30pm',8.5,false,'MOE')],
              vehicles:[veh('HOPPER','7:00am','3:30pm',8.5,false),veh('MOE','7:00am','3:30pm',8.5,false)],unfilled:0,issues:[]};
  days[d(2)]={employees:[emp('Blake','7:00am','3:30pm',8.5,false,'HOPPER'),emp('Ryan','7:00am','3:30pm',8.5,false,'ALPHA')],
              vehicles:[veh('HOPPER','7:00am','3:30pm',8.5,false),veh('ALPHA','7:00am','3:30pm',8.5,false)],unfilled:1,issues:[]};
  return {ok:true,week:mon,found:true,ready:true,readyAt:new Date().toISOString(),days:days,staleDays:[d(2)]};
}
async function loadMowing(){
  var mon=mondayOf(DATE); MOWING_WEEK=mon;
  if(DEMO){ MOWING=mowDemoSample(mon); return; }
  try{
    var r=await fetch('/api/mowing-handover?week='+mon,{cache:'no-store'});
    MOWING=await r.json();
  }catch(e){ MOWING={ok:false,error:'unreachable'}; }
}
// People / vehicles Blake has committed to mowing on the day Wes is viewing.
function mowCommitForDate(){
  if(!MOWING||!MOWING.ok||!MOWING.found||!MOWING.days) return null;
  return MOWING.days[DATE]||null;
}
function mowAvail(x,isVeh){ // availability label for a committed person/vehicle
  if(x.timingConfirmed===false) return {cls:'warn',txt:'reserved — times unconfirmed'};
  if(x.part) return {cls:'warn',txt:'part-day — on mowing '+x.start+'–'+x.end+' (potentially available outside these hours'+(isVeh?', allow travel time':'')+')'};
  return {cls:'bad',txt:'unavailable (full day)'};
}
function renderMowing(){
  var box=$('#mowing'); if(!box) return;
  // Unavailable / not connected
  if(!MOWING||!MOWING.ok){
    var why=(MOWING&&MOWING.error==='mowing-not-bound')?'the mowing planner isn’t connected to this planner yet':'the mowing commitments couldn’t be loaded';
    box.innerHTML='<div class="rec info"><span class="ic">🚜</span><div><b>Mowing commitments unavailable</b> — '+why+'. Treat mowing staff and vehicles as <b>not confirmed</b> until this is connected.</div></div>';
    return;
  }
  // No handover for this week, or not marked Ready
  if(!MOWING.found||!MOWING.ready){
    box.innerHTML='<div class="rec bad"><span class="ic">⚠</span><div><b>Mowing not confirmed for this week.</b> Blake hasn’t marked the week of '+esc(shortDay(MOWING_WEEK))+' “Ready for Wes”. Don’t assume any staff or vehicles are free for bins — check with Blake before relying on them.</div></div>';
    return;
  }
  var ready='<span class="ic">🚜</span><div><b>Mowing commitments from Blake</b> · sent '+esc(shortDay((MOWING.readyAt||'').slice(0,10)||MOWING_WEEK));
  var stale=(MOWING.staleDays||[]).indexOf(DATE)>=0;
  var html='<div class="rec ok">'+ready+(stale?'':' · week of '+esc(shortDay(MOWING_WEEK)))+'</div></div>';
  if(stale){
    html+='<div class="rec bad"><span class="ic">⚠</span><div><b>Blake changed this day after sending it.</b> The commitments below are the last ones he confirmed and <b>need reviewing</b> — he may have added or moved staff since.</div></div>';
  }
  var c=mowCommitForDate();
  if(!c||((!c.employees||!c.employees.length)&&(!c.vehicles||!c.vehicles.length))){
    html+='<div class="card" style="margin:8px 0"><div style="font-weight:700;margin-bottom:2px">No mowing on '+esc(dowName(DATE))+'</div><div style="font-size:13px;color:#6b7a70">Blake has committed no staff or vehicles to mowing this day — all are free for bins.</div></div>';
    box.innerHTML=html; return;
  }
  // Staff
  var staffRows=(c.employees||[]).map(function(e){
    var a=mowAvail(e);
    return '<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px solid #f0f4f1">'+
      '<div><b>'+esc(e.name)+'</b> <span style="color:#6b7a70">'+esc(e.start)+'–'+esc(e.end)+' · '+esc(e.hours)+'h</span>'+(e.vehicle?' <span style="color:#8a98a0">· '+esc(e.vehicle)+'</span>':'')+'</div>'+
      '<span class="rec '+a.cls+'" style="margin:0;padding:1px 8px;font-size:12px">'+esc(a.txt)+'</span></div>';
  }).join('');
  // Vehicles
  var vehRows=(c.vehicles||[]).map(function(v){
    var a=mowAvail(v,true);
    return '<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px solid #f0f4f1">'+
      '<div><b>'+esc(v.name)+'</b> <span style="color:#6b7a70">'+(v.start?esc(v.start)+'–'+esc(v.end)+' · '+esc(v.hours)+'h':'in use')+'</span></div>'+
      '<span class="rec '+a.cls+'" style="margin:0;padding:1px 8px;font-size:12px">'+esc(a.txt)+'</span></div>';
  }).join('');
  html+='<div class="card" style="margin:8px 0">'+
    '<div style="font-weight:700;margin-bottom:4px">On mowing '+esc(dowName(DATE))+' — not available for bins</div>'+
    (staffRows?'<div style="font-size:12px;color:#8a98a0;margin-top:4px">STAFF</div>'+staffRows:'')+
    (vehRows?'<div style="font-size:12px;color:#8a98a0;margin-top:8px">VEHICLES</div>'+vehRows:'')+
    ((c.unfilled>0)?'<div class="rec warn" style="margin:8px 0 0"><span class="ic">!</span><div>Blake still needs <b>'+c.unfilled+'</b> more mowing staff this day — he may pull someone you were expecting for bins.</div></div>':'')+
    '</div>';
  box.innerHTML=html;
}
// Clashes between Wes's bins roster and Blake's mowing commitments for this day.
// Returns {cls,txt}: 'bad' = genuine full-day clash; 'warn' = POSSIBLE clash (part-day or unconfirmed
// timing) that is only real if the bins shift actually overlaps the mowing window.
function mowConflicts(){
  var c=mowCommitForDate(); if(!c) return [];
  var out=[];
  var byName={}; (c.employees||[]).forEach(function(e){ byName[first(e.name).toLowerCase()]=e; });
  var byVeh={}; (c.vehicles||[]).forEach(function(v){ byVeh[(v.name||'').toUpperCase()]=v; });
  var seenW={},seenV={};
  (STATE.shifts||[]).forEach(function(s){
    var k=first(s.who||'').toLowerCase(), nm=esc(first(s.who||''));
    if(k&&byName[k]&&!seenW[k]){ seenW[k]=1; var e=byName[k];
      if(e.timingConfirmed===false) out.push({cls:'warn',txt:nm+' is reserved for mowing (times unconfirmed) — confirm with Blake before putting them on bins.'});
      else if(e.part) out.push({cls:'warn',txt:nm+' is on mowing '+esc(e.start)+'–'+esc(e.end)+' and also on a bins shift here — only a real clash if the bins timing overlaps; otherwise they’re free either side.'});
      else out.push({cls:'bad',txt:nm+' is on mowing all day ('+esc(e.start)+'–'+esc(e.end)+') but you’ve put them on a bins shift — arrange cover or remove them.'});
    }
    var vk=(s.veh||'').toUpperCase();
    if(vk&&byVeh[vk]&&!seenV[vk]){ seenV[vk]=1; var v=byVeh[vk];
      if(v.timingConfirmed===false) out.push({cls:'warn',txt:esc(s.veh)+' is reserved for mowing (times unconfirmed) — confirm before assigning it to bins.'});
      else if(v.part) out.push({cls:'warn',txt:esc(s.veh)+' is on mowing '+esc(v.start)+'–'+esc(v.end)+' and also assigned to bins here — it could be free the other side of that window, but allow travel time.'});
      else out.push({cls:'bad',txt:esc(s.veh)+' is on mowing all day ('+esc(v.start)+'–'+esc(v.end)+') but you’ve assigned it to bins — it can’t be in two places.'});
    }
  });
  // Helpers on shared runs are also people/vehicles — check them against mowing too.
  var sm=(STATE.shared&&typeof STATE.shared==='object')?STATE.shared:{};
  Object.keys(sm).forEach(function(id){ (sm[id]||[]).forEach(function(h){
    var k=first(h.emp||'').toLowerCase(), nm=esc(first(h.emp||''));
    if(k&&byName[k]&&!seenW[k]){ seenW[k]=1; var e=byName[k];
      if(e.timingConfirmed===false) out.push({cls:'warn',txt:nm+' is reserved for mowing (times unconfirmed) but is helping on bins — confirm with Blake.'});
      else if(e.part) out.push({cls:'warn',txt:nm+' is on mowing '+esc(e.start)+'–'+esc(e.end)+' and also helping on bins — only a clash if the hours overlap.'});
      else out.push({cls:'bad',txt:nm+' is on mowing all day but is set as a bins helper — arrange cover or remove them.'});
    }
    var vk2=(h.veh||'').toUpperCase();
    if(vk2&&byVeh[vk2]&&!seenV[vk2]){ seenV[vk2]=1; var v2=byVeh[vk2];
      if(v2.timingConfirmed!==false && !v2.part) out.push({cls:'bad',txt:esc(h.veh)+' is on mowing all day but is set as a bins helper vehicle — it can’t be in two places.'});
    }
  }); });
  return out;
}

async function boot(){
  try{var r=await fetch('/binsplan-review.json',{cache:'no-store'}); FEED=await r.json();}
  catch(e){ $('#main').innerHTML='<div class="loading">Could not load the roster feed. Open through the planner login.</div>'; return; }
  $('#asof').textContent=FEED.generatedAt||'';
  var dp=$('#date');
  var dates=(FEED.weekDates||[]); DATE = (dates.indexOf(FEED.today)>=0)?FEED.today:(dates[0]||FEED.today);
  dp.value=DATE; dp.min=dates[0]||''; dp.max=dates[dates.length-1]||'';
  dp.onchange=function(){ DATE=dp.value; loadDay(); };
  $('#save').onclick=function(){ doSave(); };
  $('#reset').onclick=function(){ if(DIRTY && !confirm('Clear your changes and reset to the suggested roster?\n\nAnything you have moved or reassigned will be lost.')) return; STATE=suggested(); DIRTY=false; CONFLICT=null; render(); toast('Reset to the suggested roster'); };
  loadDay();
}

function tmplKey(){return DOW+'|'+ROT;}
function rotLabel(){return ROT==='W1'?'Week 1':'Week 2';}
function dueRuns(){ return (FEED.byDate&&FEED.byDate[DATE])||[]; }
function runById(id){ return dueRuns().find(function(r){return r.id===id;}); }
function nSamples(){ var t=FEED.template&&FEED.template[tmplKey()]; return t?(t.nSamples||0):0; }

function suggested(){
  var t=(FEED.template&&FEED.template[tmplKey()])||{shifts:[],helpers:[]};
  var due=dueRuns(); var used={};
  var shifts=t.shifts.map(function(s){
    var rs=[]; (s.runIds||[]).forEach(function(id){ var r=runById(id); if(r){ rs.push(id); used[id]=1; } });
    return {veh:s.veh,who:s.who,runs:rs};
  });
  // any due run not in a template shift -> unassigned
  var tray=due.filter(function(r){return !used[r.id];}).map(function(r){return r.id;});
  return {shifts:shifts, tray:tray, shared:{}};
}
/* ===== SHARED RUNS (lead + helpers) =====
   A run stays assigned to exactly ONE shift (its LEAD). Extra employees who help on the same
   run are stored as HELPERS in STATE.shared, keyed by runId, so the run is never duplicated and
   its bins are never counted more than once:
       STATE.shared = { "<runId>": [ { emp:"Ben", veh:"MOE", hours:3|null }, ... ] }
   hours=null means "helping, hours not yet known" (we never invent an allocation).            */
function sharedMap(){ if(!STATE.shared||typeof STATE.shared!=='object') STATE.shared={}; return STATE.shared; }
function helpersFor(id){ var m=sharedMap(); return (m[id]&&m[id].length)?m[id]:null; }
function leadShiftOf(id){ for(var i=0;i<STATE.shifts.length;i++){ if((STATE.shifts[i].runs||[]).indexOf(id)>=0) return i; } return -1; }
// People who already touch a run (lead + helpers) — so the "add helper" menu can exclude them.
function peopleOnRun(id){ var out={}; var li=leadShiftOf(id); if(li>=0&&STATE.shifts[li].who) out[STATE.shifts[li].who]=1; (helpersFor(id)||[]).forEach(function(h){ if(h.emp) out[h.emp]=1; }); return out; }
// Distinct employees per vehicle across leads AND helpers (for the 2-per-vehicle rule).
function vehCrews(){ var map={}; function add(v,e){ if(!v||!e) return; (map[v]=map[v]||{})[e]=1; }
  STATE.shifts.forEach(function(s){ if((s.runs||[]).length||s.who) add(s.veh,s.who); });
  var m=sharedMap(); Object.keys(m).forEach(function(id){ (m[id]||[]).forEach(function(h){ add(h.veh,h.emp); }); });
  return map; }
// HARD LIMIT: at most MAXPAX people may ride one vehicle. People can still SHARE a run — they just
// have to be on suitable vehicles. crewOnVeh lists who is on a vehicle (excluding one person, e.g.
// the one we're about to move); vehHasRoom says whether another distinct person can be added.
var MAXPAX=2;
function crewOnVeh(veh, exceptEmp){ if(!veh) return [];
  var set={};
  STATE.shifts.forEach(function(s){ if(s.veh===veh && s.who && s.who!==exceptEmp) set[s.who]=1; });
  var m=sharedMap(); Object.keys(m).forEach(function(id){ (m[id]||[]).forEach(function(h){ if(h.veh===veh && h.emp && h.emp!==exceptEmp) set[h.emp]=1; }); });
  return Object.keys(set); }
function vehHasRoom(veh, forEmp){ if(!veh) return true; return crewOnVeh(veh, forEmp).length < MAXPAX; }
// Per-employee workload tally. Each person's own (lead) runs count their bins ONCE; assistance hours
// are attributed to the assisting employee and summed once per run they help — never double-counted,
// and a shared run's bins are never multiplied across the crew.
function employeeWorkload(){ var out={};
  function row(e){ return out[e]=out[e]||{leadBins:0, leadRuns:0, assistHours:0, assistHoursKnown:true, assistRuns:0}; }
  STATE.shifts.forEach(function(s){ if(!s.who) return; var o=row(s.who); (s.runs||[]).forEach(function(id){ var r=runById(id); if(r){ o.leadBins+=(r.bins||0); o.leadRuns++; } }); });
  var m=sharedMap(); Object.keys(m).forEach(function(id){ (m[id]||[]).forEach(function(h){ if(!h.emp) return; var o=row(h.emp); o.assistRuns++;
    if(h.hours==null||h.hours==='') o.assistHoursKnown=false; else o.assistHours+=Number(h.hours)||0; }); });
  return out; }
// Drop helper records for runs that are no longer anywhere in the plan (e.g. removed from Zenkit).
function pruneShared(){ var m=sharedMap(); var live={}; STATE.shifts.forEach(function(s){(s.runs||[]).forEach(function(id){live[id]=1;});});
  Object.keys(m).forEach(function(id){ if(!live[id]){ delete m[id]; } else { m[id]=(m[id]||[]).filter(function(h){return h&&h.emp;}); if(!m[id].length) delete m[id]; } }); }
// Upgrade any legacy roster where the SAME run sat in two shifts (old "shared ×N") into the new
// lead+helper model: keep the first shift as lead, turn the rest into helpers. No run is lost.
function migrateShared(){ var m=sharedMap(); var seen={};
  STATE.shifts.forEach(function(s){ s.runs=(s.runs||[]).filter(function(id){
    if(!seen[id]){ seen[id]=s; return true; }
    var leadVeh=seen[id].veh||''; var list=m[id]=m[id]||[];
    if(s.who && !list.some(function(h){return h.emp===s.who;})) list.push({emp:s.who,veh:s.veh||leadVeh,hours:null});
    return false; // remove the duplicate run from this extra shift
  }); });
  pruneShared();
}
async function loadDay(){
  DOW=dowName(DATE); ROT=rotationOf(DATE);
  $('#dow').textContent=DOW; $('#rot').textContent=(ROT==='W1'?'Week 1':'Week 2')+' rotation';
  // try load saved plan for this exact date
  STATE=null; VERSION=0; var fromSaved=false;
  try{ var r=await fetch('/api/roster-review/'+DATE,{cache:'no-store'}); if(r.ok){ var j=await r.json(); if(j.roster){ STATE=j.roster; VERSION=j.version||0; fromSaved=true; } } }catch(e){}
  if(!STATE){ STATE=suggested(); }
  else { reconcile(); } // preserve Wes's allocations, surface new/removed Zenkit work
  STATE.shifts=STATE.shifts||[]; STATE.tray=STATE.tray||[]; STATE.shared=STATE.shared||{};
  migrateShared();   // upgrade any legacy double-assigned runs into lead+helper, prune orphans
  STATE._fromSaved=fromSaved;
  DIRTY=false; CONFLICT=null;
  await loadMowing();   // Blake's committed mowing staff/vehicles for this week (read-only)
  render();
}
// Reconcile a SAVED plan with the latest due runs: keep allocations, drop gone runs, send new work to Unassigned.
function reconcile(){
  STATE.shifts=STATE.shifts||[]; STATE.tray=STATE.tray||[];
  var due=dueRuns(); var dueIds={}; due.forEach(function(r){dueIds[r.id]=1;});
  var inPlan={}; STATE.shifts.forEach(function(s){(s.runs||[]).forEach(function(id){inPlan[id]=1;});}); STATE.tray.forEach(function(id){inPlan[id]=1;});
  var removed=0;
  STATE.shifts.forEach(function(s){ s.runs=(s.runs||[]).filter(function(id){ if(dueIds[id])return true; removed++; return false; }); });
  STATE.tray=STATE.tray.filter(function(id){ if(dueIds[id])return true; removed++; return false; });
  var added=[]; due.forEach(function(r){ if(!inPlan[r.id]){ STATE.tray.push(r.id); added.push(r.id); } });
  pruneShared(); // a run dropped from the plan must not leave orphan helper records
  STATE._added=added; STATE._removed=removed;
}

function exceptions(){
  // ONLY from real current workload. Genuinely-unusual cleans (once-off/catch-up) always flag;
  // routine recurring work (incl. a quarterly that's on its normal cycle) does NOT.
  var out=[]; var due=dueRuns();
  due.forEach(function(r){
    if(r.type!=='CLEAN'||!r.clean) return; var c=r.clean;
    var unusual=(c.onceoff||0)+(c.catchup||0); // genuinely non-recurring work
    // 1) once-off / catch-up above a meaningful size (not routine recurring quarterly work)
    if(unusual>=15){ out.push({runId:r.id,text:'Extra '+unusual+' once-off / catch-up cleaning bins this week — may need assistance.'}); return; }
    // 2) this run is materially heavier than its OWN normal for this weekday+rotation (needs a baseline)
    if(r.baseline!=null){ var extra=(r.bins||0)-r.baseline; if(extra>=40) out.push({runId:r.id,text:'Extra '+extra+' cleaning bins vs a normal '+rotLabel()+' '+DOW+' — may need assistance.'}); }
    // Note: a quarterly/half-yearly clean that's simply on its normal cycle is NOT flagged.
  });
  return out;
}
function pwToday(){ return (FEED.pw||[]).filter(function(p){return p.date===DATE;}); }

function render(){
  var due=dueRuns();
  var exc=exceptions(); var excByRun={}; exc.forEach(function(e){ (excByRun[e.runId]=excByRun[e.runId]||[]).push(e); });
  // conflicts: a run genuinely assigned to two lead shifts, a person on two lead shifts, or more
  // than TWO people sharing one vehicle (lead + helpers). Two in a vehicle is allowed.
  var runCount={}, whoCount={};
  STATE.shifts.forEach(function(s){ whoCount[s.who]=(whoCount[s.who]||0)+1; s.runs.forEach(function(id){runCount[id]=(runCount[id]||0)+1;}); });
  var crews=vehCrews(), vehOver={}; Object.keys(crews).forEach(function(v){ var n=Object.keys(crews[v]).length; if(n>2) vehOver[v]=n; });

  // top summary
  var assigned=0; STATE.shifts.forEach(function(s){assigned+=s.runs.length;});
  var nShared=Object.keys(sharedMap()).filter(function(id){return (sharedMap()[id]||[]).length;}).length;
  $('#summary').innerHTML='<span><b>'+STATE.shifts.length+'</b> shifts</span><span><b>'+due.length+'</b> runs due</span><span><b>'+STATE.tray.length+'</b> unassigned</span>'+(nShared?'<span><b>'+nShared+'</b> shared run'+(nShared>1?'s':'')+'</span>':'')+(VERSION?'<span>saved v'+VERSION+'</span>':'<span>not yet saved</span>');

  // exceptions banner (real data only)
  var pw=pwToday(); var eb='';
  var hadFlag=false;
  exc.forEach(function(e){ var r=runById(e.runId); hadFlag=true; eb+='<div class="rec warn"><span class="ic">⚠</span><div><b>'+esc(r?r.short||r.name:'')+'</b> — '+esc(e.text)+'</div></div>'; });
  if(pw.length){ eb+='<div class="rec info"><span class="ic">🧽</span><div><b>'+pw.length+' pressure-washing job'+(pw.length>1?'s':'')+'</b> booked this day — whoever is put on pressure washing is unavailable for bins. Allocate in the pressure-washing tab.</div></div>'; }
  if(!hadFlag){
    if(nSamples()>=2) eb+='<div class="rec ok"><span class="ic">✓</span><div>Nothing unusual — this looks like a normal '+rotLabel()+' '+DOW+'. The suggested roster below should be about right.</div></div>';
    else eb+='<div class="rec info"><span class="ic">ℹ</span><div>No big quarterly / once-off cleans detected this week. History for '+rotLabel()+' '+DOW+' is still limited, so double-check the cleaning runs before relying on the suggestion.</div></div>';
  }
  if(STATE._fromSaved && ((STATE._added&&STATE._added.length)||STATE._removed)){
    var parts=[];
    if(STATE._added&&STATE._added.length) parts.push('<b>'+STATE._added.length+'</b> new run'+(STATE._added.length>1?'s':'')+' added (now in Unassigned)');
    if(STATE._removed) parts.push('<b>'+STATE._removed+'</b> run'+(STATE._removed>1?'s':'')+' no longer due');
    eb='<div class="rec bad"><span class="ic">↻</span><div>Zenkit changed since this plan was saved: '+parts.join(' · ')+'. Your other allocations are kept.</div></div>'+eb;
  }
  if(CONFLICT!=null){
    eb='<div class="rec bad"><span class="ic">⚠</span><div><b>Someone else saved a newer version (v'+CONFLICT+') while you were editing.</b> Your changes are still here and have <b>not</b> been saved — nothing was discarded.'+
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn sm" id="cfMine">Keep my changes &amp; overwrite v'+CONFLICT+'</button>'+
      '<button class="btn ghost sm" id="cfTheirs">Discard mine &amp; load their version</button>'+
      '</div></div></div>'+eb;
  }
  // Mowing clashes: Wes has put a person/vehicle on bins that Blake already committed to mowing today.
  var mc=mowConflicts();
  if(mc.length){ var mch=mc.map(function(o){return '<div class="rec '+(o.cls||'bad')+'"><span class="ic">⚠</span><div>'+o.txt+'</div></div>';}).join(''); eb=mch+eb; }
  $('#exc').innerHTML=eb;
  renderMowing();
  var cfM=$('#cfMine'); if(cfM) cfM.onclick=function(){ doSave(CONFLICT); };
  var cfT=$('#cfTheirs'); if(cfT) cfT.onclick=function(){ if(confirm('Discard your changes and load the version someone else saved?')){ CONFLICT=null; loadDay(); } };

  if(!(FEED.template&&FEED.template[tmplKey()])){
    $('#main').innerHTML='<div class="rec info" style="margin-top:4px"><span class="ic">ℹ</span><div>No learned roster for '+DOW+' ('+(ROT==='W1'?'Week 1':'Week 2')+') yet — all '+due.length+' due runs are shown as unassigned below for you to allocate.</div></div><div id="cards"></div>'+trayHtml(due,runCount);
  } else {
    $('#main').innerHTML='<div class="cols" id="cards"></div>'+trayHtml(due,runCount);
  }
  var html=STATE.shifts.map(function(s,si){
    var flagged=false, conflicts=[];
    if(whoCount[s.who]>1) conflicts.push(first(s.who)+' is leading '+whoCount[s.who]+' separate shifts');
    if(s.veh&&vehOver[s.veh]) conflicts.push(vehOver[s.veh]+' people assigned to '+s.veh+' — max 2 per vehicle');
    var rows=s.runs.map(function(id){ var r=runById(id); if(!r) return '';
      if(excByRun[id])flagged=true;
      var dup=runCount[id]>1?' <span class="rt rt-CLEAN" style="background:#fde8e4;color:#b4452b">double-assigned ×'+runCount[id]+'</span>':'';
      var hs=helpersFor(id);
      var leadtag=hs?' <span class="rt rt-OUT" title="you are the lead on this shared run">LEAD</span>':'';
      var row='<div class="job"><span class="rt rt-'+r.type+'">'+r.type+'</span><span class="rn">'+esc(r.short||r.name)+leadtag+dup+'</span>'+(r.bins?'<span class="rb">'+r.bins+'</span>':'')+'<button class="share" data-share="'+si+'|'+id+'" title="Share this run / add a helper">+ share</button><button class="rmv" data-mv="'+si+'|'+id+'">move ▾</button></div>';
      if(hs){ var chips=hs.map(function(h,hi){
          var vehOpts='<option value="">veh?</option>'+(FEED.vehicles||[]).map(function(v){return '<option'+(v===h.veh?' selected':'')+'>'+esc(v)+'</option>';}).join('');
          var hasH=!(h.hours==null||h.hours==='');
          var hrsIn='<input class="hh" data-hh="'+id+'|'+hi+'" inputmode="decimal" '+(hasH?'value="'+esc(h.hours)+'"':'placeholder="h"')+'>';
          return '<span class="hchip" title="Helping '+esc(first(s.who))+' on this run">👥 '+esc(first(h.emp))+
            ' <select class="hv" data-hv="'+id+'|'+hi+'">'+vehOpts+'</select> '+hrsIn+
            (hasH?'<span style="font-size:10px;color:#5b6b60">h</span>':'<span class="tbc">TBC</span>')+
            ' <button class="hlead" data-hlead="'+id+'|'+hi+'" title="Make '+esc(first(h.emp))+' the lead">↑ lead</button>'+
            '<button class="hx" data-hx="'+id+'|'+hi+'" title="Remove helper">✕</button></span>';
        }).join('');
        row+='<div class="helpers">'+chips+'</div>';
      }
      return row;
    }).join('');
    // Runs this person is HELPING on (lead is someone else) — shown on their own card.
    var assistLines=''; var sm=sharedMap();
    Object.keys(sm).forEach(function(id){ (sm[id]||[]).forEach(function(h){ if(h.emp!==s.who) return; var r=runById(id); if(!r) return;
      var li=leadShiftOf(id); var leadWho=(li>=0&&STATE.shifts[li].who)?first(STATE.shifts[li].who):'—';
      var hasH=!(h.hours==null||h.hours==='');
      assistLines+='<div class="assist"><span class="ab">ASSIST</span><span class="an">'+esc(r.short||r.name)+' · lead '+esc(leadWho)+'</span><span class="ah">'+(hasH?esc(h.hours)+'h':'hours TBC')+(h.veh?' · '+esc(h.veh):'')+'</span></div>';
    }); });
    var flLines=(s.runs.filter(function(id){return excByRun[id];}).map(function(id){ var r=runById(id); return excByRun[id].map(function(e){return '<div class="flagline">⚠ <b>'+esc(r.short||r.name)+'</b>: '+esc(e.text)+'</div>';}).join(''); }).join(''));
    var cfLines=conflicts.map(function(c){return '<div class="cfline">⚠ Clash: '+esc(c)+'</div>';}).join('');
    var bins=s.runs.reduce(function(a,id){var r=runById(id);return a+(r?(r.bins||0):0);},0);
    return '<div class="card'+(flagged?' flagged':'')+(conflicts.length?' conflict':'')+'">'+
      '<div class="chead"><span class="ava">'+esc(initials(s.who))+'</span>'+
        '<select class="who" data-who="'+si+'">'+(FEED.staff||[]).map(function(n){return '<option'+(n===s.who?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>'+
        '<select class="vehsel" data-veh="'+si+'"><option value="">—</option>'+(FEED.vehicles||[]).map(function(v){return '<option'+(v===s.veh?' selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select>'+
        '<button class="rx" data-rm="'+si+'" title="remove shift">✕</button></div>'+
      '<div class="runs">'+(rows||'<div class="job" style="color:#8a988f;font-size:12.5px">No runs — add from unassigned, or remove this shift.</div>')+'</div>'+
      assistLines+flLines+cfLines+
      '<div class="cfoot"><span class="n">'+s.runs.length+' runs'+(bins?' · '+bins+' bins':'')+'</span><button class="btn ghost sm" data-add="'+si+'">+ run</button></div>'+
    '</div>';
  }).join('');
  $('#cards').innerHTML=html;
  // add-employee button at end of cards grid — ALWAYS available (even with no learned roster / zero shifts)
  $('#cards').insertAdjacentHTML('beforeend','<div class="card" style="display:flex;align-items:center;justify-content:center;border-style:dashed"><button class="btn ghost" id="addemp">+ add employee</button></div>');
  wire();
}
function trayHtml(due,runCount){
  if(!STATE.tray.length) return '<div class="unassigned"><h3>Unassigned runs</h3><div style="color:#8a7a4a;font-size:12.5px">Everything due today is assigned. Runs you remove from a shift appear here.</div></div>';
  var rows=STATE.tray.map(function(id){ var r=runById(id); if(!r) return '';
    return '<div class="job"><span class="rt rt-'+r.type+'">'+r.type+'</span><span class="rn">'+esc(r.short||r.name)+'</span>'+(r.bins?'<span class="rb">'+r.bins+'</span>':'')+'<button class="rmv" data-asg="'+id+'">assign ▸</button></div>';
  }).join('');
  return '<div class="unassigned"><h3>Unassigned runs <span style="font-weight:600;color:#8a7a4a;font-size:12px">· due in Zenkit but not in the usual roster</span></h3>'+rows+'</div>';
}

var MENU=null;
function closeMenu(){if(MENU){MENU.remove();MENU=null;}}
function openMenu(x,y,items){closeMenu();MENU=document.createElement('div');MENU.className='menu';
  MENU.innerHTML=items.map(function(it){return it.hd?'<div class="hd">'+esc(it.hd)+'</div>':'<div data-act="'+it.act+'">'+esc(it.label)+'</div>';}).join('');
  document.body.appendChild(MENU);var b=MENU.getBoundingClientRect();
  MENU.style.left=Math.min(x,innerWidth-b.width-8)+'px';MENU.style.top=Math.min(y,innerHeight-b.height-8)+'px';
  MENU.querySelectorAll('[data-act]').forEach(function(d){d.onclick=function(){var a=d.getAttribute('data-act');closeMenu();act(a);};});}
document.addEventListener('click',function(e){if(MENU&&!MENU.contains(e.target)&&!/rmv|data-mv|data-asg/.test(e.target.className+' '+(e.target.getAttribute&&(e.target.getAttribute('data-mv')||e.target.getAttribute('data-asg'))||'')))closeMenu();});

function act(a){var p=a.split(':');
  if(p[0]==='mvShift'){var si=+p[1],id=p[2],to=+p[3];var s=STATE.shifts[si];s.runs=s.runs.filter(function(x){return x!==id;});STATE.shifts[to].runs.push(id);}
  else if(p[0]==='mvTray'){var si2=+p[1],id2=p[2];STATE.shifts[si2].runs=STATE.shifts[si2].runs.filter(function(x){return x!==id2;});if(STATE.tray.indexOf(id2)<0)STATE.tray.push(id2);}
  else if(p[0]==='asg'){var id3=p[1],to3=+p[2];STATE.tray=STATE.tray.filter(function(x){return x!==id3;});STATE.shifts[to3].runs.push(id3);}
  else if(p[0]==='addrun'){var si3=+p[1],id4=p[2];STATE.tray=STATE.tray.filter(function(x){return x!==id4;});STATE.shifts[si3].runs.push(id4);}
  else if(p[0]==='asgNew'){var anid=p[1],awho=p.slice(2).join(':');STATE.tray=STATE.tray.filter(function(x){return x!==anid;});
    var ex=STATE.shifts.findIndex(function(s){return s.who===awho;}); if(ex>=0){STATE.shifts[ex].runs.push(anid);} else {STATE.shifts.push({veh:'',who:awho,runs:[anid]});}}
  else if(p[0]==='mvNew'){var mnsi=+p[1],mnid=p[2],mnwho=p.slice(3).join(':');STATE.shifts[mnsi].runs=STATE.shifts[mnsi].runs.filter(function(x){return x!==mnid;});
    var mex=STATE.shifts.findIndex(function(s){return s.who===mnwho;}); if(mex>=0){STATE.shifts[mex].runs.push(mnid);} else {STATE.shifts.push({veh:'',who:mnwho,runs:[mnid]});}}
  else if(p[0]==='addhelp'){var hsi=+p[1],hid=p[2],emp=p.slice(3).join(':');var lead=STATE.shifts[hsi];var m=sharedMap();var list=m[hid]=m[hid]||[];
    if(emp && emp!==(lead&&lead.who) && !list.some(function(h){return h.emp===emp;})){
      var lv=(lead&&lead.veh)||'';
      // Seat the helper on the lead's vehicle only if it still has room (max 2 per vehicle). If the
      // lead's truck is full, add them to the RUN with no vehicle yet and ask Wes to pick a suitable one.
      var seat=(lv && vehHasRoom(lv,emp))?lv:'';
      list.push({emp:emp,veh:seat,hours:null});
      if(!seat) toast(lv?(lv+' already has 2 people — '+first(emp)+' is helping on this run; pick a vehicle for them.'):('Pick a vehicle for '+first(emp)+'.'));
    }}
  DIRTY=true; render();
}
// Swap a helper to be the lead of the run, demoting the current lead to a helper. The run is never lost.
function makeLead(id,hi){ var m=sharedMap(); var list=m[id]||[]; var h=list[hi]; if(!h) return;
  var li=leadShiftOf(id); var oldLead=(li>=0)?STATE.shifts[li]:null;
  if(oldLead) oldLead.runs=oldLead.runs.filter(function(x){return x!==id;});
  var ni=-1; for(var i=0;i<STATE.shifts.length;i++){ if(STATE.shifts[i].who===h.emp){ ni=i; break; } }
  if(ni<0){ STATE.shifts.push({veh:h.veh||'',who:h.emp,runs:[]}); ni=STATE.shifts.length-1; }
  if(STATE.shifts[ni].runs.indexOf(id)<0) STATE.shifts[ni].runs.push(id);
  list.splice(hi,1);
  if(oldLead && oldLead.who && oldLead.who!==h.emp && !list.some(function(x){return x.emp===oldLead.who;})) list.push({emp:oldLead.who,veh:oldLead.veh||'',hours:null});
  if(!list.length) delete m[id]; else m[id]=list;
  DIRTY=true; render();
}
function removeHelper(id,hi){ var m=sharedMap(); var list=m[id]||[]; list.splice(hi,1); if(!list.length) delete m[id]; else m[id]=list; DIRTY=true; render(); }
function setHelperVeh(id,hi,v){ var m=sharedMap(); if(!(m[id]&&m[id][hi])) return; var h=m[id][hi];
  if(v && !vehHasRoom(v,h.emp)){ toast(v+' already has 2 people — max 2 per vehicle. Pick another vehicle for '+first(h.emp)+'.'); render(); return; }
  h.veh=v||''; DIRTY=true; render(); }
function setHelperHours(id,hi,val){ var m=sharedMap(); if(!(m[id]&&m[id][hi])) return; val=(val==null?'':String(val)).trim();
  var num=parseFloat(val); m[id][hi].hours=(val===''||isNaN(num)||num<=0)?null:num; DIRTY=true; render(); }
function wire(){
  document.querySelectorAll('.who').forEach(function(sel){sel.onchange=function(){STATE.shifts[+sel.dataset.who].who=sel.value;DIRTY=true;render();};});
  document.querySelectorAll('.vehsel').forEach(function(sel){sel.onchange=function(){var i=+sel.dataset.veh,v=sel.value,who=STATE.shifts[i].who;
    if(v && !vehHasRoom(v,who)){ toast(v+' already has 2 people — max 2 per vehicle. Pick another vehicle.'); render(); return; }
    STATE.shifts[i].veh=v;DIRTY=true;render();};});
  document.querySelectorAll('.rx').forEach(function(b){b.onclick=function(){var si=+b.dataset.rm;STATE.shifts[si].runs.forEach(function(id){if(STATE.tray.indexOf(id)<0)STATE.tray.push(id);});STATE.shifts.splice(si,1);DIRTY=true;render();};});
  document.querySelectorAll('[data-mv]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var pr=b.dataset.mv.split('|'),si=+pr[0],id=pr[1];
    var items=[{hd:'Move run to…'}];STATE.shifts.forEach(function(s,i){if(i!==si)items.push({act:'mvShift:'+si+':'+id+':'+i,label:first(s.who)+(s.veh?' ('+s.veh+')':'')});});items.push({act:'mvTray:'+si+':'+id,label:'↓ Unassigned'});
    var had={}; STATE.shifts.forEach(function(s){if(s.who)had[s.who]=1;}); var fresh=(FEED.staff||[]).filter(function(n){return !had[n];});
    if(fresh.length){ items.push({hd:'New card for…'}); fresh.forEach(function(n){items.push({act:'mvNew:'+si+':'+id+':'+n,label:'＋ '+n});}); }
    openMenu(e.clientX,e.clientY,items);};});
  document.querySelectorAll('[data-asg]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var id=b.dataset.asg;
    var items=[{hd:'Assign to…'}];STATE.shifts.forEach(function(s,i){items.push({act:'asg:'+id+':'+i,label:first(s.who)+(s.veh?' ('+s.veh+')':'')});});
    // Always let Wes assign straight to an employee even with no cards yet — picking one creates their card.
    var had={}; STATE.shifts.forEach(function(s){if(s.who)had[s.who]=1;}); var fresh=(FEED.staff||[]).filter(function(n){return !had[n];});
    if(fresh.length){ items.push({hd:STATE.shifts.length?'New card for…':'Assign to employee'}); fresh.forEach(function(n){items.push({act:'asgNew:'+id+':'+n,label:'＋ '+n});}); }
    openMenu(e.clientX,e.clientY,items);};});
  document.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var si=+b.dataset.add;
    if(!STATE.tray.length){openMenu(e.clientX,e.clientY,[{hd:'No unassigned runs'}]);return;}
    var items=[{hd:'Add run'}];STATE.tray.forEach(function(id){var r=runById(id);items.push({act:'addrun:'+si+':'+id,label:(r.short||r.name)});});openMenu(e.clientX,e.clientY,items);};});
  // Share a run: add another employee as a helper (excludes the lead and anyone already helping).
  document.querySelectorAll('[data-share]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var pr=b.dataset.share.split('|'),si=+pr[0],id=pr[1];
    var on=peopleOnRun(id); var avail=(FEED.staff||[]).filter(function(n){return !on[n];});
    if(!avail.length){openMenu(e.clientX,e.clientY,[{hd:'Everyone is already on this run'}]);return;}
    var items=[{hd:'Add helper on '+((runById(id)||{}).short||'this run')}];avail.forEach(function(n){items.push({act:'addhelp:'+si+':'+id+':'+n,label:n});});
    openMenu(e.clientX,e.clientY,items);};});
  document.querySelectorAll('[data-hlead]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var pr=b.dataset.hlead.split('|');makeLead(pr[0],+pr[1]);};});
  document.querySelectorAll('[data-hx]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var pr=b.dataset.hx.split('|');removeHelper(pr[0],+pr[1]);};});
  document.querySelectorAll('[data-hv]').forEach(function(sel){sel.onchange=function(){var pr=sel.dataset.hv.split('|');setHelperVeh(pr[0],+pr[1],sel.value);};});
  document.querySelectorAll('[data-hh]').forEach(function(inp){inp.onchange=function(){var pr=inp.dataset.hh.split('|');setHelperHours(pr[0],+pr[1],inp.value);};
    inp.onclick=function(e){e.stopPropagation();};inp.onkeydown=function(e){if(e.key==='Enter'){inp.blur();}};});
  var ae=$('#addemp');if(ae)ae.onclick=function(){STATE.shifts.push({veh:'',who:(FEED.staff||[''])[0],runs:[]});DIRTY=true;render();};
}

async function doSave(forceBase){
  if(SAVING)return;SAVING=true;$('#save').disabled=true;
  try{
    var base=(forceBase!=null)?forceBase:VERSION;
    var r=await fetch('/api/roster-review/'+DATE,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({roster:STATE,baseVersion:base})});
    var j=await r.json();
    if(j.ok){VERSION=j.version;DIRTY=false;CONFLICT=null;$('#saved').textContent='✓ Saved v'+VERSION;setTimeout(function(){$('#saved').textContent='';},2500);toast('Saved '+DATE);render();}
    else if(j.error==='conflict'){ CONFLICT=j.currentVersion; render(); toast('A newer version exists — your changes are kept; choose below.'); }
    else toast('Save failed: '+(j.error||'error'));
  }catch(e){toast('Save failed — check your connection');}
  SAVING=false;$('#save').disabled=false;
}
boot();
</script>
