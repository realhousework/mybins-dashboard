  <div class=card>
    <div class=ff><label>Customer address or suburb</label><input type=text id=fAddr placeholder="e.g. 24 Pittwater Road, Dee Why"></div>
    <div class=ff><label>Estimated job time (person-minutes on site)</label><input type=number id=fEst min=5 step=5 placeholder="e.g. 45"></div>

    <div class=ff><label>How often</label><div class=seg id=fFreq><button data-freq=0 class="on H">Once-off</button><button data-freq=7>Weekly</button><button data-freq=14>Fortnightly</button><button data-freq=28>4-weekly</button><button data-freq=30>Monthly</button></div></div>

<script>
/* ============================================================================
   myMowing Daily Planner — reuses the existing scheduling engine.
   Jobs are NEVER silently allocated: every job starts Unallocated and Blake
   assigns it (or taps a suggestion). Reads mowing.json + projection.json only;
   never writes to Zenkit/Deputy. Keeps the existing working planner untouched.
============================================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ini=n=>String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const r1=x=>Math.round(x*10)/10;
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtLong=d=>{const t=new Date(d+'T12:00:00');return DOW[t.getDay()]+' '+t.getDate()+' '+t.toLocaleDateString('en-AU',{month:'short'});};

let DATA=null, curDay=null, scenario=null;
let MOWING=null, PROJ=null, DEMO=false, LOADERR=false, LOADERR_MSG='';
let dayMeta={}, planVersion=0, planSavedSig=null, planManifest=null, hoursOpen={};
let VIEW='week', weekAnchor=null;
let PROPOSED={}, pendingAlloc=null, findInput={skill:'Basic',freq:0,days:[],time:'any'};

/* =================== PORTED ENGINE =================== */
const VEH=()=>(DATA.config&&DATA.config.vehicles)||['HOPPER','MOE'];
const MAXH=()=>(DATA.config&&DATA.config.maxHours)||10;
const BREAKM=()=>((DATA.config&&DATA.config.breakMins)||30);
const BREAK=()=>BREAKM()/60;
const SEATS=v=>{const s=DATA.config&&DATA.config.seats;return (s&&s[v])||(DATA.config&&DATA.config.maxCrew)||3;};
const parseHM=s=>{const m=/(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null;};
const CFGSTART=()=>parseHM((DATA.config&&DATA.config.startTime)||'07:00')||420;
function fmtClock(mins){let h=Math.floor(mins/60),m=Math.round(mins%60);if(m===60){h++;m=0;}const ap=(h%24)>=12?'pm':'am';let hh=(h%24)%12;if(hh===0)hh=12;return hh+':'+String(m).padStart(2,'0')+ap;}
function fmtDur(min){min=Math.round(min);if(min<60)return min+' min';const h=Math.floor(min/60),m=min%60;return h+'h'+(m?' '+m+'m':'');}
const REGIONS=['Manly Council','Warringah/Pittwater','North Shore'];

function jobsOn(d){return DATA.jobs.filter(j=>j.date===d);}
// `done` is only trustworthy on a job's OWN day or earlier — a future job cannot be complete.
// On a future date `done` is stale carry-over from the recurring card's previous occurrence,
// so it must NEVER hide the next occurrence. We never drop a job from a day's plan based on
// `done`; only reliable per-occurrence evidence (occCompleted / occCancelled, which the feed
// may add later) may hide a specific future occurrence. Completion is identified via isCompleted().
function activeJobs(d){return jobsOn(d).filter(j=>isJob(j)&&j.occCompleted!==true&&j.occCancelled!==true);}
// Reliable completion: a job marked done on its own day or earlier (not a stale future flag).
function isCompleted(j){return !!(j.done&&DATA.today&&j.date<=DATA.today)||j.occCompleted===true;}

/* ============ JOB vs NOTE/REMINDER CLASSIFICATION ============
   Some Zenkit cards are operational notes/reminders ("BLAKE — sort out X next Wed"), not jobs.
   They must NOT count toward job totals, hours, routing, staffing or Find Capacity — but must stay
   visible. We classify from RELIABLE Zenkit-derived signals (recurrence rule, a work-time estimate,
   a recognised service skill, a real street address) — never from the note wording alone — and let
   Blake override any call. Overrides are keyed by recurrence rule so they stick for every future
   occurrence, and are shared (saved to the same store as plans). Nothing is written back to Zenkit. */
let CLASSIFY={}; let CLASSIFY_VER=0; const RECLASS_KEY='0001-01-01'; // reserved shared row holding overrides
const STREETY=/\b(st|street|rd|road|ave|avenue|ln|lane|dr|drive|pl|place|ct|court|cres|crescent|pde|parade|way|cl|close|tce|terrace|bvd|blvd|boulevard|hwy|highway|cct|circuit|gr|grove|esplanade|esp|promenade|wharf|cove|bay|point|pt|heights|hts|rise|glen|walk|row|mews|quay|ave|avenue)\b/i;
function looksLikeAddress(a){a=a||'';return /\d/.test(a)&&(STREETY.test(a)||a.includes(','));}
// 'job' | 'reminder' | 'uncertain'. A job shows at least one hallmark of real work.

/* ============ REQUIRED STAFFING FROM WORKLOAD ============

let REQ_CACHE={};

function buildTrial(d,hNames,mNames){

// choose crew of sizes h (HOPPER) and m (MOE) from the pool, putting specialists on trucks that need one.
function pickCrew(d,h,m){

  const specM=two&&jobs.some(j=>needsSpec(j)&&regionVeh(j.area)==='MOE');

function trialResult(d,hN,mN){

function requiredStaffing(d){

  let out;

  else{
    const seats=SEATS('HOPPER')||3; const pool=staffNames().length;
    let best=null, fallback=null;
    for(let trucks=1;trucks<=2;trucks++){
      for(let h=1;h<=seats;h++){
        const mLo=trucks===2?1:0, mHi=trucks===2?seats:0;
        for(let m=mLo;m<=mHi;m++){

function optimiseOrder(d,v,sc,jobs){

  if(!m||!m.dur||routable.length<2){const order=routable.concat(unroutable);return {order,sim:simulate(d,v,sc,order)};}

function rebalanceSuggestion(d,sc){

    jobs.forEach(j=>{ if(j.geo===false)return;

const HAV=(a,b)=>{const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(b[1]-a[1]),dLng=toR(b[0]-a[0]);const s=Math.sin(dLat/2)**2+Math.cos(toR(a[1]))*Math.cos(toR(b[1]))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));};
function estMatrix(depot,pts){const coords=[depot].concat(pts.map(p=>[p.lng,p.lat]));const dur=coords.map(a=>coords.map(b=>Math.round(HAV(a,b)*1.4/38*3600)));return {ids:pts.map(p=>p.id),dur,estimated:true};}

    roster=MOWING.roster||{}; availability=MOWING.availability||{};

    jobs=list.map(o=>({ id:'R'+o.ruleId, ruleId:o.ruleId, area:o.area, date, address:o.address, service:o.service, est:o.est, skill:o.skill,

  const rh=MOWING.config&&MOWING.config.routingHealth;

  const unverified=jobs.filter(j=>j.geo===null).length;   // API error / couldn't verify
  const notFound=jobs.filter(j=>j.geo===false).length;    // tried, not found
  const mx=MOWING.matrix||{}; const mUnavail=Object.keys(mx).filter(d=>mx[d]&&mx[d].reason==='matrix-unavailable').length;

function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function weekMonday(iso){const t=new Date(iso+'T12:00:00');const dow=t.getDay();return addDays(iso,(dow===0?-6:1-dow));}
function weekDates(mon){return [0,1,2,3,4].map(i=>addDays(mon,i));}
function todayISO(){return (MOWING&&MOWING.today)||new Date().toISOString().slice(0,10);}
function showWeek(){ VIEW='week'; $('dayView').hidden=true; $('findView').hidden=true; $('weekView').hidden=false; if(!weekAnchor)weekAnchor=weekMonday(curDay||todayISO()); renderWeek(); }
function showDay(date){ VIEW='day'; $('weekView').hidden=true; $('findView').hidden=true; $('dayView').hidden=false; setDate(date); }
function weekShift(n){ const t=todayISO(); const minMon=weekMonday(t); const maxMon=addDays(weekMonday(t),84); const cand=addDays(weekAnchor,n*7); if(cand<minMon||cand>maxMon)return; weekAnchor=cand; renderWeek(); }
async function renderWeek(){

  $('weekTitle').textContent='Week of '+t.getDate()+' '+t.toLocaleDateString('en-AU',{month:'short'})+' – '+f.getDate()+' '+f.toLocaleDateString('en-AU',{month:'short'});

  let html='';

  $('weekgrid').innerHTML=html;
  $('weekfoot').innerHTML='Each day shows the staffing it needs from the workload. “Ready” means you’ve assigned enough staff and every job is on a truck. Amber means a day still needs staffing or more people.';

function weekCard(d,rec){
  buildDay(d);
  const hasPlan=!!(rec&&rec.plan);
  const sc=hasPlan?migrate(rec.plan):defaultScenario(d);
  const active=activeJobs(d), jobs=active.length;
  const t=new Date(d+'T12:00:00'); const dname=DOW[t.getDay()].slice(0,3), ddate=t.getDate()+' '+t.toLocaleDateString('en-AU',{month:'short'});
  if(!jobs){ return '<div class="weekcard n"><div class=dcol><div class=dname>'+dname+'</div><div class=ddate>'+ddate+'</div></div><div class=jcol><div class=jnum>0</div><div class=jlbl>jobs</div></div><div class=scol><div class="wready n">No jobs</div></div></div>'; }
  // What the workload needs (before anyone is rostered)
  const req=requiredStaffing(d);
  const assigned=assignedCount(sc);
  const status=rec&&rec.plan&&rec.plan.status==='final'?'final':'draft';
  const reqTxt='needs ~'+req.employees+' staff · '+req.trucks+' truck'+(req.trucks>1?'s':'')+(req.specialists?' · '+req.specialists+' spec':'')+(req.feasible?'':' ⚠ heavy');
  let cls,label;
  if(assigned===0){
    // Nobody rostered yet — show the requirement, never "ready"
    cls='a'; label='Needs staffing (~'+req.employees+')';
  } else {
    const day=assessDay(d,sc); const unalloc=day.unalloc.length;
    if(unalloc>0){cls='o';label=unalloc+' job'+(unalloc>1?'s':'')+' to allocate';}
    else if(assigned<req.employees){cls='a';label='Understaffed ('+assigned+'/'+req.employees+')';}
    else if(day.status==='r'){cls='r';label='Needs attention';}
    else if(day.status==='a'){cls='a';label='Check this day';}
    else {cls='g';label=status==='final'?'Finalised':'Ready';}
  }
  // Never show a day as Ready/green while important travel info is missing (unlocated stops).
  const miss=dayMissingLoc(d);
  if(miss && cls==='g'){ cls='a'; label='Check — '+miss+' stop'+(miss>1?'s':'')+' not located'; }
  let tags='';
  if(status==='final')tags+='<span class="wtag" style="background:#d8efdc;color:#1f6b38">FINAL</span>';
  else if(assigned>0)tags+='<span class="wtag prov">draft</span>';
  if(!req.feasible)tags+='<span class="wtag busy">heavy day</span>';
  if(miss)tags+='<span class="wtag busy">travel incomplete</span>';
  const estH=req.estHours?' · ~'+r1(req.estHours)+'h/truck':'';
  const sub=reqTxt+estH+(assigned?' · '+assigned+' assigned':'');
  return '<div class="weekcard '+cls+'" data-day="'+d+'"><div class=dcol><div class=dname>'+dname+'</div><div class=ddate>'+ddate+'</div></div>'+
    '<div class=jcol><div class=jnum>'+jobs+'</div><div class=jlbl>jobs</div></div>'+
    '<div class=scol><div class="wready '+cls+'">'+label+'</div><div class=wsub>'+sub+'</div>'+(tags?'<div style="margin-top:2px">'+tags+'</div>':'')+'</div>'+
    '<div class=arrow>›</div></div>';
}

function suggestPlan(){
  if(unallocated(curDay,scenario).length){ toast('Allocate the remaining jobs first, then I can tidy the plan.'); return; }
  const before=assessDay(curDay,scenario);
  const sc2=JSON.parse(JSON.stringify(scenario));
  VEH().forEach(v=>{ const o=optimiseOrder(curDay,v,sc2); sc2.order=sc2.order||{}; sc2.order[v]=o.order.map(jobKey); });
  const reb=rebalanceSuggestion(curDay,sc2);
  if(reb){ sc2.alloc[allocKey(reb.job)]=reb.to; VEH().forEach(v=>{ const o=optimiseOrder(curDay,v,sc2); sc2.order[v]=o.order.map(jobKey); }); }
  if(planSig(sc2)===planSig(scenario)){ toast('Your plan is already the best I can find.'); return; }
  const after=assessDay(curDay,sc2);
  const bFin=Math.max.apply(null,before.vehs.filter(a=>a.finishMin!=null).map(a=>a.finishMin).concat([0]));
  const aFin=Math.max.apply(null,after.vehs.filter(a=>a.finishMin!=null).map(a=>a.finishMin).concat([0]));
  let msg='I found a tidier plan:\n\n';
  if(reb)msg+='• Move '+reb.job.address+' from '+reb.from+' to '+reb.to+' (saves ~'+fmtDur(reb.saved)+' overtime)\n';
  msg+='• Re-order stops for less driving\n\nLatest finish: '+(bFin?fmtClock(bFin):'—')+' → '+(aFin?fmtClock(aFin):'—')+'\n\nApply this suggestion?';
  confirmDlg('✨ Suggested plan',msg,'Apply',()=>{scenario=sc2;render();toast('Applied — Save to keep it');},'Keep mine',()=>{});
}

function geocodeText(s){ s=(s||'').toLowerCase().trim(); if(!s)return null; let best=null; for(const k in SUBURBS){ if(s.indexOf(k)>=0&&(!best||k.length>best.k.length))best={k,c:SUBURBS[k]}; } return best?{coords:best.c,sub:best.k}:null; }
function regionForCoord(lng,lat){ if(lng<151.21)return 'North Shore'; if(lat>-33.785)return 'Warringah/Pittwater'; return 'Manly Council'; }
function rebuildMatrix(date){ const depot=(MOWING.config&&MOWING.config.depotCoord)||[151.2735,-33.7942]; const pts=DATA.jobs.filter(j=>j.geo); DATA.matrix[date]=pts.length?estMatrix(depot,pts):{ids:[],dur:null}; }
// When Deputy hasn't rostered a day yet, assume a normal crew so a recurring job isn't wrongly rejected.
function seedProvisionalCrew(sc){ [['HOPPER','Blake'],['HOPPER','Ben'],['MOE','Julen'],['MOE','Ryan']].forEach(a=>{ if(DATA.staff[a[1]]){ sc.helpers[a[0]]=sc.helpers[a[0]]||[]; if(!sc.helpers[a[0]].some(h=>h.emp===a[1]))sc.helpers[a[0]].push({emp:a[1],start:'07:00',end:'15:30',part:false}); } }); }
function stepDate(iso,freq){ if(freq>=28&&freq<=31){const d=new Date(iso+'T12:00:00');const dom=d.getUTCDate();let y=d.getUTCFullYear(),m=d.getUTCMonth()+2;if(m>12){m-=12;y++;}const last=new Date(Date.UTC(y,m,0)).getUTCDate();return new Date(Date.UTC(y,m-1,Math.min(dom,last))).toISOString().slice(0,10);} return addDays(iso,freq); }

function evaluateInsert(date,veh,sc,newJob){
  buildDay(date); newJob.date=date;   // must be dated to count as a job that day
  const crew=crewIntervals(date,veh,sc); if(!crew.length)return {noCrew:true,date,veh};
  const needSpec=newJob.skill==='Specialist'||newJob.skill==='Mixed';
  const haveSpec=crew.some(c=>c.spec);
  const base=assessVeh(date,veh,sc);
  const saved=DATA.jobs; DATA.jobs=DATA.jobs.concat([newJob]); rebuildMatrix(date);
  const sc2=JSON.parse(JSON.stringify(sc)); sc2.alloc=sc2.alloc||{}; sc2.alloc[allocKey(newJob)]=veh; if(sc2.order&&sc2.order[veh])delete sc2.order[veh];
  const after=assessVeh(date,veh,sc2);
  let prox=null; base.order.forEach(j=>{ if(j.lng!=null&&newJob.lng!=null){ const dd=HAV([newJob.lng,newJob.lat],[j.lng,j.lat]); if(prox==null||dd<prox)prox=dd; } });
  DATA.jobs=saved; rebuildMatrix(date);
  const newAppt=after.flags.apptViol.length>base.flags.apptViol.length;
  const newImposs=after.flags.impossible.length>base.flags.impossible.length;
  const specShort=needSpec&&!haveSpec;
  const ot=after.ot||0;
  const fit=!newAppt&&!newImposs&&!specShort&&ot===0;
  return {fit,noCrew:false,date,veh,addedDrive:Math.max(0,Math.round((after.driveMin||0)-(base.driveMin||0))),finish:after.finishMin,remaining:after.buffer,prox,skillOk:!specShort,specShort,newAppt,newOt:ot,driveComplete:after.driveComplete};
}
function findCmp(a,b){ if(a.fit!==b.fit)return a.fit?-1:1; if(a.skillOk!==b.skillOk)return a.skillOk?-1:1; const pa=a.prox==null?1e9:a.prox,pb=b.prox==null?1e9:b.prox; if(pa!==pb)return pa-pb; if(a.addedDrive!==b.addedDrive)return a.addedDrive-b.addedDrive; return (b.remaining||0)-(a.remaining||0); }
let _findJobBase=null;
function mkFindJob(){ return Object.assign({},_findJobBase,{id:'FIND',_status:'proposed'}); }
async function findSpace(){
  const addr=$('fAddr').value.trim(); const g=geocodeText(addr);
  const res=$('findResults');
  if(!addr){res.innerHTML=msgCard('Enter a customer address or suburb.');return;}
  if(!g){res.innerHTML=msgCard('Couldn’t place “'+esc(addr)+'”. Try typing a nearby suburb name (e.g. Dee Why, Mosman, Manly).');return;}
  const est=parseInt($('fEst').value,10); if(!est||est<5){res.innerHTML=msgCard('Enter the estimated job time in minutes.');return;}
  const skill=findInput.skill, freq=findInput.freq, days=findInput.days.slice(), time=findInput.time;
  const coords=g.coords, area=regionForCoord(coords[0],coords[1]);
  const appt= time==='am'?{type:'window',start:7*60,end:12*60} : time==='pm'?{type:'window',start:12*60,end:17*60} : null;
  _findJobBase={area,address:addr||g.sub,service:'(prospective new job)',est,skill,lng:coords[0],lat:coords[1],geo:true,appt,_proposed:true};
  res.innerHTML=msgCard('Checking the next 12 weeks…');
  const today=todayISO(); const allDates=[]; for(let i=1;i<=84;i++){const d=addDays(today,i);const dow=new Date(d+'T12:00:00').getDay();if(dow>=1&&dow<=5)allDates.push(d);}
  const recs=await Promise.all(allDates.map(d=>Store.get(d).catch(()=>({plan:null}))));
  const savedBy={}; allDates.forEach((d,i)=>savedBy[d]=recs[i]);
  // Baseline per day: the SAVED plan if there is one; else existing jobs auto-allocated by region.
  // If Deputy hasn't rostered the day, assume a normal crew (provisional) rather than rejecting it.
  const dayInfo=d=>{ buildDay(d); const r=savedBy[d]; const hasPlan=!!(r&&r.plan); const rostered=rosterOn(d).length>0;
    let sc; if(hasPlan){ sc=migrate(r.plan); } else { sc=defaultScenario(d); if(!rostered)seedProvisionalCrew(sc); const map=regionVehMap(d,sc); activeJobs(d).forEach(j=>{ sc.alloc[allocKey(j)]=map[j.area]||VEH()[0]; }); }
    return {sc,hasPlan,rostered}; };
  const cands=allDates.filter(d=>{const dow=new Date(d+'T12:00:00').getDay(); return !days.length||days.includes(dow);});
  let options=[];
  cands.forEach(d=>{ const info=dayInfo(d); VEH().forEach(v=>{ const r=evaluateInsert(d,v,info.sc,mkFindJob()); if(r&&!r.noCrew){ r.planned=info.hasPlan; r.provRoster=!info.rostered; options.push(r); } }); });
  options.sort(findCmp);
  const seen=new Set(), top=[]; for(const o of options){ if(seen.has(o.date))continue; seen.add(o.date); top.push(o); if(top.length>=6)break; }
  if(freq>0){ top.forEach(o=>{ const fut={total:0,fit:0,fails:[],prov:false}; let cur=o.date; for(let k=0;k<40;k++){ cur=stepDate(cur,freq); if(cur>addDays(today,84))break; const dow=new Date(cur+'T12:00:00').getDay(); if(dow<1||dow>5)continue; const info=dayInfo(cur); if(!info.rostered)fut.prov=true; fut.total++; const r=evaluateInsert(cur,o.veh,info.sc,mkFindJob()); if(r&&!r.noCrew&&r.fit)fut.fit++; else fut.fails.push(cur); } o.future=fut; }); }
  renderFindResults(top,{freq});
}
function msgCard(t){return '<div class=card><div class=small muted>'+t+'</div></div>';}
function renderFindResults(top,info){
  const res=$('findResults');
  if(!top.length){ res.innerHTML=msgCard('No day in the next 12 weeks has crew rostered for this. Try once staff are rostered, or widen the preferred days.'); return; }
  const fitN=top.filter(o=>o.fit).length;
  let h='<div class=small muted style="margin:10px 2px">'+(fitN?fitN+' good option'+(fitN>1?'s':'')+' found':'No clean fit — the closest options are shown with warnings')+'. Driving is estimated.</div>';
  top.forEach((o,i)=>{
    const t=new Date(o.date+'T12:00:00'); const dlabel=DOW[t.getDay()]+' '+t.getDate()+' '+t.toLocaleDateString('en-AU',{month:'short'});
    const cls=o.fit?'':(o.specShort||o.newOt?'bad':'warn');
    let warns='';
    if(o.specShort)warns+='<div>⛔ No specialist on '+o.veh+' that day</div>';
    if(o.newOt)warns+='<div>⛔ Pushes '+o.veh+' '+fmtDur(o.newOt)+' past finish</div>';
    if(o.newAppt)warns+='<div>⛔ Clashes with a timed job</div>';
    let fut='';
    if(info.freq>0&&o.future){ if(o.future.total===0)fut='<div class="fut ok">First visit fits; future dates are beyond the 12-week window.</div>';
      else if(o.future.fit===o.future.total)fut='<div class="fut ok">✅ Keeps fitting on all '+o.future.total+' future visits in the next 12 weeks.</div>';
      else fut='<div class="fut bad">⚠ Fits now, but '+(o.future.total-o.future.fit)+' of '+o.future.total+' future visits look tight — review those weeks.</div>';
      if(o.future.prov)fut+='<div class="small" style="color:#8a6d1a">Future weeks assume a normal crew until you staff them.</div>'; }
    const basis = o.provRoster
      ? '<div class="small" style="color:#8a6d1a;margin-top:3px">⚑ Estimate — this day isn’t staffed yet; assumes a normal crew.</div>'
      : (!o.planned ? '<div class="small muted" style="margin-top:3px">Estimate — this day isn’t planned yet; based on your usual allocation.</div>'
                    : '<div class="small" style="color:#1a7a43;margin-top:3px">✓ Based on the saved plan for this day.</div>');
    const proxTxt=o.prox==null?'first job of the day':(o.prox<1.2?'right by an existing stop ('+r1(o.prox)+' km)':r1(o.prox)+' km from the nearest stop');
    h+='<div class="opt '+cls+'"><div class=oh><div class=od>'+(o.fit?'✅ ':cls==='bad'?'⛔ ':'⚠️ ')+dlabel+'</div><div class="ov '+(o.veh==='MOE'?'M':'')+'">'+o.veh+'</div></div>'+
      '<div class=meta><b>+'+(o.addedDrive||0)+' min</b> driving · finishes <b>'+(o.finish!=null?fmtClock(o.finish):'?')+'</b> · '+(o.remaining>0?fmtDur(o.remaining)+' spare':'no spare')+' · '+proxTxt+'</div>'+basis+
      (warns?'<div class=warns>'+warns+'</div>':'')+fut+
      (o.fit||cls==='warn'?'<button class="btn sm" style="flex:none;padding:9px 14px" data-addopt="'+i+'">Add to '+o.date+' plan</button>':'')+'</div>';
  });
  res.innerHTML=h;
  window.__findTop=top;
}
