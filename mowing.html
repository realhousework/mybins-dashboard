<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>myMowing Operations Planner</title><style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#f4f6f4;color:#17201a;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

.rec{background:#fff8ec;border:1px solid #f0e2c4;border-radius:10px;padding:11px 14px;font-size:13.5px;color:#5a4a22;margin:8px 0}
.rec.ok{background:#e7f4ec;border-color:#cfe9d9;color:#1a5a34}.rec.bad{background:#fde8e4;border-color:#f3c9bf;color:#8a2f1a}
.rec.info{background:#eaf1fb;border-color:#cfe0f3;color:#2a4a7a}

.btn{border:1px solid #2e8b57;background:#2e8b57;color:#fff;font:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:9px 14px;cursor:pointer}

.ava{width:26px;height:26px;border-radius:50%;background:#2e8b57;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}

.gate{max-width:360px;margin:60px auto;text-align:center}
.gate input{width:100%;padding:11px 12px;border:1px solid #cfe0d6;border-radius:8px;font:inherit;font-size:15px;margin:10px 0}
.rotbadge{font-size:11px;font-weight:800;background:#eef3f0;color:#2e8b57;border:1px solid #cfe9d9;border-radius:999px;padding:3px 10px}

label.fl{font-size:11px;color:#5b6b60;text-transform:uppercase;font-weight:700;letter-spacing:.03em;display:block;margin-bottom:3px}
.banner{background:#fff4d6;border:1px solid #f0e2c4;color:#7a5e12;border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}

.vstat b{font-size:14px;font-weight:800}
.barkey{font-size:10.5px;color:#64726a;display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 3px;align-items:center}

.seg-site{background:#2e8b57}.seg-drive{background:#e8912e}.seg-break{background:#c3ccc6}.seg-wait{background:#d9c38a}
.seg-un{background:repeating-linear-gradient(45deg,#d9b38a 0,#d9b38a 6px,#efd8bf 6px,#efd8bf 12px)}
.mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:#17201a;z-index:2}
.marklbl{position:absolute;top:-15px;font-size:9px;font-weight:800;color:#17201a;transform:translateX(-50%);white-space:nowrap}
.legrow{display:flex;gap:8px;font-size:12px;padding:5px 0;border-top:1px dashed #eef2ef}
.legrow:first-child{border-top:0}
.legrow .t{color:#8a7a5a;min-width:70px;font-variant-numeric:tabular-nums;font-weight:700}
.chip{display:inline-block;font-size:11px;font-weight:700;background:#eef3f0;border:1px solid #dce8e1;border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0}
.chip .h{color:#5b6b60;font-weight:600}
.chip.warn{background:#fff4d6;border-color:#f0e2c4;color:#8a6d1a}
.chip.spec{background:#efe3fb;border-color:#e0cff5;color:#6b2fb3}
.helperbox{border:1px dashed #cfe0d6;border-radius:9px;padding:8px 10px;margin:8px 0;background:#fff}

.helperrow select,.helperrow input{padding:6px 8px;border:1px solid #cfe0d6;border-radius:7px;font:inherit;font-size:13px}

.lockbtn.on{background:#17201a;color:#fff;border-color:#17201a}
.ordbtn{border:1px solid #cfe0d6;background:#fff;border-radius:6px;font-size:12px;padding:0 7px;cursor:pointer;line-height:1.5;color:#5b6b60}
.ordbtn:disabled{opacity:.35;cursor:default}
.cmp{font-size:12.5px;color:#1a5a34;background:#e7f4ec;border:1px solid #cfe9d9;border-radius:8px;padding:7px 11px;margin:7px 0}

@media(max-width:720px){.weekstrip{grid-template-columns:1fr 1fr}.vehgrid{grid-template-columns:1fr}.vstat{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class=wrap>
<header><div><div class=logo>my<b>Mowing</b> <span style="font-weight:600;color:#5b6b60;font-size:15px">Operations Planner</span></div></div>
<div class=asof id=asof></div></header>
<div class=sub id=sub></div>
<div id=gate></div>
<div id=app hidden>
<div id=banner></div>
<div class=tabs><button class="tb on" data-p=week>Weekly</button><button class=tb data-p=day>Daily plan</button><button class=tb data-p=find>Find capacity</button></div>
<div id=p-week></div>
<div id=p-day hidden></div>
<div id=p-find hidden></div>
<div class=note style="margin-top:22px" id=footnote></div>
</div>
<div class=toast id=toast></div>
<script>
let DATA=null, curDay=null, scenario=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const r1=x=>Math.round(x*10)/10;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});
const fmtShort=d=>{const dd=new Date(d+'T12:00:00');return DOW[dd.getDay()]+' '+dd.getDate();};
const STLABEL={g:'Green',a:'Amber',r:'Red',n:'No work'};
const REGIONS=['Manly Council','Warringah/Pittwater','North Shore'];
const VEH=()=>(DATA.config&&DATA.config.vehicles)||['HOPPER','MOE'];
const MAXH=()=>(DATA.config&&DATA.config.maxHours)||10;
const BREAKM=()=>((DATA.config&&DATA.config.breakMins)||30);        // minutes
const BREAK=()=>BREAKM()/60;                                        // hours
const ROUTING=()=>!!(DATA.config&&DATA.config.routingAvailable);
const SEATS=v=>{const s=DATA.config&&DATA.config.seats;return (s&&s[v])||(DATA.config&&DATA.config.maxCrew)||3;};   // cab capacity per vehicle
const MTOKEN=()=>(DATA.config&&DATA.config.mapboxToken)||null;   // public pk. token for on-demand geocoding (Find capacity)
const parseHM=s=>{const m=/(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null;};
const CFGSTART=()=>parseHM((DATA.config&&DATA.config.startTime)||'07:00')||420;
function fmtClock(mins){let h=Math.floor(mins/60),m=Math.round(mins%60);if(m===60){h++;m=0;}const ap=(h%24)>=12?'pm':'am';let hh=(h%24)%12;if(hh===0)hh=12;return hh+':'+String(m).padStart(2,'0')+ap;}
function hhmm(mins){return fmtClock(mins);}
function fmtDur(min){min=Math.round(min);if(min<60)return min+' min';const h=Math.floor(min/60),m=min%60;return h+'h'+(m?' '+m+'m':'');}

// ---- data access ----
function jobsOn(d){return DATA.jobs.filter(j=>j.date===d);}
function activeJobs(d){return jobsOn(d).filter(j=>!(j.done&&DATA.today&&j.date>DATA.today));}
function reschedJobs(d){return jobsOn(d).filter(j=>j.done&&DATA.today&&j.date>DATA.today);}
function availOn(d){return (DATA.availability&&DATA.availability[d])||{};}
function rosterOn(d){return (DATA.roster&&DATA.roster[d])||[];}
function isSpec(e){return !!(DATA.staff[e]&&DATA.staff[e].specialist);}
function isDriver(e){const s=DATA.staff[e];return !(s&&s.driver===false);}   // default: everyone can drive
function crewCovers(areas,region){return (areas||[]).some(a=>(a==='Warringah'&&/Warringah/.test(region))||(a==='Manly'&&/Manly/.test(region))||(a==='North Shore'&&/North Shore/.test(region)));}
function isWorking(d,e){const a=availOn(d)[e];return !!(a&&a.working);}
function isCrossOU(d,e){const a=availOn(d)[e];return !!(a&&a.working&&!a.onMowing);}
function jobKey(j){return j.id!=null?('#'+j.id):(j.date+'|'+j.area+'|'+j.address);}
function rosterShift(d,e){const a=availOn(d)[e];return {start:a&&a.start?parseHM(a.start):null,end:a&&a.end?parseHM(a.end):null};}

// ---- appointments (structured {type,start,end}; tolerant of legacy strings) ----
function normAppt(ap){
  if(!ap)return null;
  if(typeof ap==='object'){return (ap.type&&ap.type!=='none')?{type:ap.type,start:ap.start!=null?ap.start:null,end:ap.end!=null?ap.end:(ap.start!=null?ap.start:null)}:null;}
  if(ap==='STRICT')return {type:'hard',start:null,end:null};
  const m=/(\d{1,2})([:.](\d{2}))?\s*(am|pm)?/i.exec(ap);if(!m)return null;
  let h=+m[1],mm=m[3]?+m[3]:0,apm=(m[4]||'').toLowerCase();
  if(apm==='pm'&&h<12)h+=12;else if(apm==='am'&&h===12)h=0;else if(!apm&&h>=1&&h<=6)h+=12;
  const s=h*60+mm;return {type:'hard',start:s,end:s};
}
function apptLabel(ap){if(!ap)return'';if(ap.start==null)return'set time';if(ap.type==='window')return fmtClock(ap.start)+'–'+(ap.end!=null?fmtClock(ap.end):'?');if(ap.type==='preferred')return '~'+fmtClock(ap.start);return fmtClock(ap.start);}
function apptTag(ap){if(!ap)return'';const cls=ap.type==='preferred'?'drv':'appt';const ic=ap.type==='window'?'⏱':ap.type==='preferred'?'~':'⏰';return ' <span class="'+cls+'">'+ic+apptLabel(ap)+'</span>';}

// ---- routing (baked Mapbox matrix; index 0 = depot) ----
function matrixFor(d){return (DATA.matrix&&DATA.matrix[d])||null;}
function jobIdx(d,id){const m=matrixFor(d);if(!m||!m.ids)return -1;const i=m.ids.indexOf(id);return i<0?-1:i+1;}
function legSec(d,a,b){const m=matrixFor(d);if(!m||!m.dur||!m.dur[a])return null;const x=m.dur[a][b];return x==null?null:x;}
function legMin(d,a,b){const s=legSec(d,a,b);return s==null?null:Math.round(s/60);}
function medianLegSec(d){const m=matrixFor(d);if(!m||!m.dur)return null;const xs=[];for(let i=0;i<m.dur.length;i++)for(let j=0;j<m.dur.length;j++)if(i!==j&&m.dur[i][j]!=null)xs.push(m.dur[i][j]);if(!xs.length)return null;xs.sort((a,b)=>a-b);return xs[Math.floor(xs.length/2)];}

// ---- rotation (fixed anchor: week of Mon 10 Nov 2026 = Week 1; stays correct across New Year) ----
const ROT_ANCHOR_MON=new Date('2026-11-09T12:00:00');   // Monday of a Week-1 week (confirmed)
function mondayOf(d){const t=new Date(d+'T12:00:00');const dow=t.getDay();const m=new Date(t);m.setDate(t.getDate()+(dow===0?-6:1-dow));m.setHours(12,0,0,0);return m;}
function rotLabel(d){const w=Math.round((mondayOf(d)-ROT_ANCHOR_MON)/(7*86400000));return (((w%2)+2)%2===0)?'Week 1':'Week 2';}

// ---- scenario (proposed allocation) ----
function defaultScenario(d){
  const sc={emp:{},region:{},job:{},helpers:{},order:{},locks:{}};
  VEH().forEach(v=>{sc.helpers[v]=[];sc.locks[v]={};});
  // Each rostered person starts on their roster truck for their full Deputy shift. Trim the hours in
  // the What-if planner to use someone just for the morning; it's one unified crew list.
  rosterOn(d).forEach(r=>{ const v=VEH().includes(r.vehicle)?r.vehicle:VEH()[0]; sc.helpers[v].push({emp:r.emp,start:r.start||'07:00',end:r.end||'17:00'}); });
  const byVeh=crewByVeh(sc);
  REGIONS.forEach(reg=>{
    let v=VEH().find(veh=>(byVeh[veh]||[]).some(e=>{const r=rosterOn(d).find(x=>x.emp===e);return r&&crewCovers(r.areas,reg);}));
    if(!v) v=VEH().find(veh=>(byVeh[veh]||[]).length)||VEH()[0];
    sc.region[reg]=v;
  });
  return sc;
}
function crewByVeh(sc){const m={};VEH().forEach(v=>m[v]=[]);
  Object.keys(sc.emp||{}).forEach(e=>{const v=sc.emp[e];if(v&&v!=='off'&&m[v]&&m[v].indexOf(e)<0)m[v].push(e);});
  VEH().forEach(v=>{((sc.helpers&&sc.helpers[v])||[]).forEach(h=>{if(h.emp&&m[v].indexOf(h.emp)<0)m[v].push(h.emp);});});
  return m;}
function vehOfJob(sc,j){ return (sc.job&&sc.job[jobKey(j)]) || sc.region[j.area] || VEH()[0]; }
function isDefault(d){const a=defaultScenario(d);return JSON.stringify(a)===JSON.stringify(scenario);}
// one unified crew list — a person is on whichever truck's helper list holds them (else 'off')
function crewVehOf(sc,emp){for(const v of VEH()){if(((sc.helpers&&sc.helpers[v])||[]).some(h=>h.emp===emp))return v;}return 'off';}
function crewEntry(sc,emp){for(const v of VEH()){const e=((sc.helpers&&sc.helpers[v])||[]).find(h=>h.emp===emp);if(e)return e;}return null;}
function pad2(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function setCrewVeh(emp,v){
  const ent=crewEntry(scenario,emp);
  VEH().forEach(x=>{if(scenario.helpers[x])scenario.helpers[x]=scenario.helpers[x].filter(h=>h.emp!==emp);});
  if(v==='off')return;
  let start,end;
  if(ent){start=ent.start;end=ent.end;}
  else{const sh=rosterShift(curDay,emp); if(sh.start!=null&&sh.end!=null){start=pad2(sh.start);end=pad2(sh.end);} else {start='07:00';end='11:00';}}
  scenario.helpers[v]=scenario.helpers[v]||[]; scenario.helpers[v].push({emp,start,end});
}

// ---- time-phased crew: actual per-person intervals (full-day shift OR custom helper hours) ----
function crewIntervals(d,v,sc){
  const cfgS=CFGSTART(),cfgE=cfgS+MAXH()*60,out=[];
  Object.keys(sc.emp||{}).forEach(e=>{ if(sc.emp[e]!==v)return;
    const sh=rosterShift(d,e);
    out.push({emp:e,start:sh.start!=null?sh.start:cfgS,end:sh.end!=null?sh.end:cfgE,spec:isSpec(e),driver:isDriver(e),cross:isCrossOU(d,e),custom:false,outside:!isWorking(d,e)}); });
  ((sc.helpers&&sc.helpers[v])||[]).forEach(h=>{
    if(!h.emp)return; const st=parseHM(h.start),en=parseHM(h.end); if(st==null||en==null||en<=st)return;
    const sh=rosterShift(d,h.emp); let outside=false;
    if(sh.start!=null&&sh.end!=null){ if(st<sh.start-1||en>sh.end+1) outside=true; }
    if(!isWorking(d,h.emp)) outside=true;
    // "custom" = genuinely part-day (shorter than their full roster shift) or not rostered — only these
    // get the part-day duration label and mid-route transport check. A full-shift person is normal crew.
    const fullShift=sh.start!=null&&sh.end!=null&&st<=sh.start+1&&en>=sh.end-1;
    const custom=!fullShift;
    const i=out.findIndex(x=>x.emp===h.emp); if(i>=0) out.splice(i,1);
    out.push({emp:h.emp,start:st,end:en,spec:isSpec(h.emp),driver:isDriver(h.emp),cross:isCrossOU(d,h.emp),custom,outside}); });
  return out.filter(x=>x.start!=null&&x.end!=null&&x.end>x.start).sort((a,b)=>a.start-b.start);
}

// ---- ordered job list for a vehicle (manual order if set, else optimised) ----
function jobsForVeh(d,v,sc){return activeJobs(d).filter(j=>vehOfJob(sc,j)===v);}
function effectiveOrder(d,v,sc){
  const jobs=jobsForVeh(d,v,sc);
  const man=sc.order&&sc.order[v];
  if(man&&man.length){ const byKey={};jobs.forEach(j=>byKey[jobKey(j)]=j);
    const ord=man.map(k=>byKey[k]).filter(Boolean); jobs.forEach(j=>{if(ord.indexOf(j)<0)ord.push(j);}); return ord; }
  return optimiseOrder(d,v,sc,jobs).order;
}

// Progress one job from startClock. Work advances at the rate of whoever is actually present, re-evaluated
// at every crew start/end boundary — so a helper who leaves mid-job stops contributing at that moment.
// 0 crew present → wait for the next crew to arrive; if no crew ever returns, the job is impossible (never
// progresses with nobody there). Specialist + driver coverage are tracked across the whole working time.
function serviceJob(crew,startClock,est){
  const capAt=t=>crew.filter(c=>c.start<=t+1e-6&&t<c.end-1e-6);
  const startPresent=capAt(startClock);
  let remaining=est||0, clock=startClock, waited=0, hadStaff=false, specGap=false, driverGap=false, guard=0;
  while(remaining>1e-6&&guard++<2000){

// ---- THE ENGINE: forward-simulate a vehicle's day with time-phased crew ----
function simulate(d,v,sc,ordered){

  const routable=ordered.filter(j=>jobIdx(d,j.id)>0);

  res.flags.unroutable=unroutable;
  const crewStart=crew.length?Math.min.apply(null,crew.map(c=>c.start)):CFGSTART();

  const bk=BREAKM();
  let clock=crewStart,prev=0,drive=0,onSiteClock=0,onSitePerson=0,breakDone=false;
  const breakTarget=crewStart+(crewEnd-crewStart)/2;
  let legMissing=false;
  routable.forEach((j,i)=>{
    const idx=jobIdx(d,j.id);
    const lm=legMin(d,prev,idx);
    if(lm==null){legMissing=true;} else {clock+=lm;drive+=lm;}
    if(!breakDone&&bk&&clock>=breakTarget){res.breakBefore=i;res.breakAt=clock;clock+=bk;breakDone=true;}
    let arrive=clock;
    const ap=normAppt(j.appt); let waited=0,viol=null;
    if(ap&&ap.start!=null){
      if(ap.type==='hard'){ if(arrive<ap.start){waited=ap.start-arrive;clock=ap.start;} else if(arrive>ap.start+1){viol={job:j,kind:'late',by:arrive-ap.start,appt:ap};} }
      else if(ap.type==='window'){ const we=ap.end!=null?ap.end:ap.start; if(arrive<ap.start){waited=ap.start-arrive;clock=ap.start;} else if(arrive>we+1){viol={job:j,kind:'late',by:arrive-we,appt:ap};} }
      // preferred: soft, no wait/violation
    }
    const serviceStart=clock;
    const needSpec=j.skill==='Specialist'||j.skill==='Mixed';
    const est=j.est!=null?j.est:0;
    const svc=serviceJob(crew,serviceStart,est);     // time-stepped: splits at crew start/end boundaries
    const depart=svc.end;
    const workMin=(depart-serviceStart)-svc.waited;  // actual on-site working minutes (excl. waiting for staff)
    onSiteClock+=Math.max(0,workMin); onSitePerson+=est;
    const cap=svc.capStart, crewHere=svc.crewStart;
    if(needSpec&&!svc.specCovered)res.flags.specShort.push(j);   // a specialist job worked while none present
    if(svc.hadStaff&&!svc.driverCovered)res.flags.driverGap.push(j);
    if(svc.impossible)res.flags.impossible.push(j);
    if(viol)res.flags.apptViol.push(viol);
    res.stops.push({job:j,arrive,serviceStart,depart,onsiteMin:depart-serviceStart,legMin:lm,waited,svcWait:svc.waited,crewHere,cap,specPresent:svc.specCovered,impossible:svc.impossible,appt:ap,viol});

  });

  // unroutable jobs: work exists but can't be scheduled/located
  unroutable.forEach(j=>{res.stops.push({job:j,unroutable:true,onsiteMin:(j.est!=null?j.est:0),cap:1});onSitePerson+=(j.est||0);onSiteClock+=(j.est||0);});

  res.k=crew.length;

    if(c.end<res.finishMin-1&&c.end>crewStart+1){ let where=null; for(const s of res.stops){if(s.serviceStart!=null&&s.serviceStart<=c.end)where=s.job.address;} res.flags.transport.push({emp:c.emp,kind:'leaves',at:c.end,where}); }
    if(c.start>crewStart+1){ res.flags.transport.push({emp:c.emp,kind:'joins',at:c.start}); }

  crew.forEach(c=>{if(c.outside)res.flags.outside.push(c.emp);if(c.cross&&res.flags.outside.indexOf(c.emp)<0)res.flags.outside.push(c.emp);});

  const needSpecDay=routable.concat(unroutable).some(j=>j.skill==='Specialist'||j.skill==='Mixed');
  const haveSpec=crew.some(c=>c.spec);
  res.needSpec=needSpecDay; res.haveSpec=haveSpec;
  res.missingEst=ordered.filter(j=>j.est==null).length;
  res.regions=[...new Set(ordered.map(j=>j.area))];
  // minimum full-day crew to fit on person-minutes, capped at the vehicle's real seating (no imaginary 6-person crews)
  const seats=SEATS(v);
  let minNeed=null; if(res.driveH!=null){for(let kk=1;kk<=seats;kk++){if(res.driveH+res.onSiteH/kk<=res.win.netH){minNeed=kk;break;}}}
  res.minNeed=minNeed; res.seats=seats;
  res.fitsInSeats=minNeed!=null;   // false = even a full cab can't finish inside the shift → must split to the other truck
  let st='g',reasons=[];
  if(!crew.length){st='r';reasons.push('No crew assigned — this truck can’t run its '+r1(res.onSiteH)+'h of on-site work');}
  if(res.flags.impossible.length){st='r';reasons.push(res.flags.impossible.length+' job(s) have no crew present at any point they could run (e.g. everyone has left) — they can’t progress');}
  if(needSpecDay&&!haveSpec){st='r';reasons.push('Garden/hedge work but no specialist (Blake/Julen) on this crew');}
  if(res.flags.specShort.length&&haveSpec){ if(st!=='r')st='r'; reasons.push(res.flags.specShort.length+' specialist job(s) are worked while no specialist is present (e.g. the specialist has left mid-job)'); }
  if(res.flags.apptViol.length){st='r';res.flags.apptViol.forEach(x=>reasons.push('Can’t reach '+esc(x.job.address)+' by its '+(x.appt.type==='window'?'window':'appointment')+' '+apptLabel(x.appt)+' (late ~'+fmtDur(x.by)+' once earlier jobs + travel are counted)'));}
  if(res.flags.unroutable.length){ if(st==='g')st='a'; reasons.push(res.flags.unroutable.length+' job('+'s'.slice(res.flags.unroutable.length===1?1:0)+') couldn’t be located on the map — driving incomplete, so the day can’t be confirmed'); }
  else if(!res.driveComplete){ if(st==='g')st='a'; reasons.push('Driving time unverified — a road leg is missing, so finish is an estimate only'); }
  if(res.ot>0&&st!=='r'){ st='r'; reasons.push(r1(res.onSiteClockH)+'h on-site + '+(res.driveH!=null?r1(res.driveH)+'h':'?')+' driving runs to '+fmtClock(res.finishMin)+', past the crew’s '+fmtClock(crewEnd)+' finish by '+fmtDur(res.ot)+(res.fitsInSeats===false?' — even a full '+seats+'-seat cab can’t finish in the shift; split jobs to the other truck':(minNeed&&res.k&&minNeed>res.k?' — needs '+minNeed+' crew (has '+res.k+', '+seats+' seats)':''))); }
  else if(res.ot>0){ reasons.push('Runs '+fmtDur(res.ot)+' past the crew finish'); }
  else if(res.buffer<30&&res.driveComplete&&st==='g'){ st='a'; reasons.push('Tight — finishes '+fmtClock(res.finishMin)+', only '+fmtDur(res.buffer)+' before the crew’s shift ends'); }
  if(res.missingEst>0&&st!=='r'){ if(st==='g')st='a'; reasons.push(res.missingEst+' job(s) missing an EST (on-site understated)'); }
  if(res.flags.transport.length&&st==='g')st='a';
  if(res.flags.outside.length&&st==='g')st='a';
  if(res.flags.driverGap.length){ if(st!=='r')st='r'; reasons.push('A crew change leaves the truck with no authorised driver — keep a driver on board'); }
  res.status=crew.length||ordered.length?st:'r';
  if(!ordered.length)res.status='n';
  res.reasons=reasons;
  return res;
}

// ---- constraint-aware route optimiser (in-app, on the cached Mapbox matrix) ----
// Feasibility first (never trade a feasible order for a shorter one with staffing conflicts), then the
// shortest working day: impossible > missed appointment/window > specialist-absent > no-driver > earlier finish > less driving.
function scoreOf(r){return r.flags.impossible.length*1e9 + r.flags.apptViol.length*1e7 + r.flags.specShort.length*1e6 + r.flags.driverGap.length*1e5 + (r.finishMin||0)*100 + (r.driveMin||0);}

  const unroutable=jobs.filter(j=>jobIdx(d,j.id)<=0||j.geo===false);
  if(!m||!m.dur||routable.length<2){const order=routable.concat(unroutable);return {order,sim:simulate(d,v,sc,order)};}
  const locks=(sc.locks&&sc.locks[v])||{};
  const lockedKeys=Object.keys(locks).filter(k=>locks[k]);
  // construction: timed jobs (hard+window) in time order, then insert the rest cheapest by travel
  const timed=routable.filter(j=>{const a=normAppt(j.appt);return a&&a.start!=null&&(a.type==='hard'||a.type==='window');}).sort((a,b)=>normAppt(a.appt).start-normAppt(b.appt).start);
  const rest=routable.filter(j=>timed.indexOf(j)<0);

  const idxOf=j=>jobIdx(d,j.id);
  rest.forEach(j=>{const ji=idxOf(j);let bp=order.length,bc=Infinity;
    for(let p=0;p<=order.length;p++){const prev=p===0?0:idxOf(order[p-1]),next=p===order.length?0:idxOf(order[p]);
      const add=(legSec(d,prev,ji)||0)+(legSec(d,ji,next)||0)-(legSec(d,prev,next)||0);if(add<bc){bc=add;bp=p;}}
    order.splice(bp,0,j);});

  const man=sc.order&&sc.order[v];
  if(man&&lockedKeys.length){const byKey={};routable.forEach(j=>byKey[jobKey(j)]=j);
    const desired=man.map(k=>byKey[k]).filter(Boolean);
    lockedKeys.forEach(k=>{const pos=desired.findIndex(j=>jobKey(j)===k);const job=byKey[k];if(job&&pos>=0){const cur=order.indexOf(job);if(cur>=0)order.splice(cur,1);order.splice(Math.min(pos,order.length),0,job);}});}

      let anyLock=false;for(let z=i;z<=j2;z++)if(isLocked(best[z])){anyLock=true;break;}if(anyLock)continue;

// ---- per-vehicle assessment (wraps optimise + simulate; the one engine every view uses) ----
function assessVeh(d,v,sc){
  const ordered=effectiveOrder(d,v,sc);
  const r=simulate(d,v,sc,ordered);
  r.jobs=jobsForVeh(d,v,sc);
  r.xfer=r.flags.outside.slice();

const RANK={r:3,a:2,g:1,n:0};
function assessDay(d,sc){
  sc=sc||defaultScenario(d);
  const ros=rosterOn(d),avail=availOn(d);
  const vehs=VEH().map(v=>assessVeh(d,v,sc));
  const active=activeJobs(d);
  const onSiteH=active.reduce((s,j)=>s+(j.est||0),0)/60;
  const driveVals=vehs.filter(a=>a.order.length).map(a=>a.driveH);
  const driveKnown=driveVals.length&&driveVals.every(x=>x!=null);
  const driveH=driveKnown?driveVals.reduce((s,x)=>s+x,0):null;
  // double-booking: an employee assigned to BOTH vehicles with overlapping hours is impossible → flag Red
  const conflicts=crewConflicts(d,sc);

  vehs.forEach(a=>{if(a.status!=='n'&&RANK[a.status]>RANK[status])status=a.status;});

// employees assigned to more than one vehicle with overlapping time intervals
function crewConflicts(d,sc){
  const byEmp={};

  const out=[];
  Object.keys(byEmp).forEach(e=>{ const iv=byEmp[e]; const vehs=[];
    for(let i=0;i<iv.length;i++)for(let j=i+1;j<iv.length;j++){ if(iv[i].v!==iv[j].v && iv[i].start<iv[j].end && iv[j].start<iv[i].end){ if(vehs.indexOf(iv[i].v)<0)vehs.push(iv[i].v); if(vehs.indexOf(iv[j].v)<0)vehs.push(iv[j].v); } }
    if(vehs.length)out.push({emp:e,vehs}); });
  return out;
}
// cross-vehicle rebalance: would moving one job to the other truck reduce the worse vehicle's overtime?
function rebalanceSuggestion(d,sc){
  if(VEH().length<2)return null;
  const base=VEH().map(v=>assessVeh(d,v,sc));
  const baseOt=Math.max.apply(null,base.map(a=>a.ot||0));
  if(baseOt<=5)return null;                 // nothing meaningfully over the shift
  let best=null;
  VEH().forEach(v=>{ const other=VEH().find(x=>x!==v); const jobs=jobsForVeh(d,v,sc);
    jobs.forEach(j=>{ if(j.geo===false)return;
      const sc2=JSON.parse(JSON.stringify(sc)); sc2.job=sc2.job||{}; sc2.job[jobKey(j)]=other; if(sc2.order){VEH().forEach(x=>delete sc2.order[x]);}
      const r=VEH().map(x=>assessVeh(d,x,sc2));
      if(r.some(a=>a.flags.apptViol.length||a.flags.impossible.length||a.flags.specShort.length))return;   // never create a conflict
      const ot=Math.max.apply(null,r.map(a=>a.ot||0));
      if(ot<baseOt-5&&(!best||ot<best.ot)) best={job:j,from:v,to:other,ot,saved:baseOt-ot};
    });
  });
  return best;

// ---- daily ----
function openDay(d){curDay=d;scenario=defaultScenario(d);document.querySelector('.tb[data-p=day]').click();renderDay();}
function buildItinerary(a){

function dayRecs(day){
  const out=[];
  if(!day.active.length){out.push(['','No jobs scheduled this day.']);return out;}
  const parts=day.vehs.filter(a=>a.order.length).map(a=>{
    if(a.driveH==null) return a.v+' '+r1(a.onSiteH)+'h on-site: driving incomplete — confirm once addresses/routes resolve';
    if(a.flags.apptViol.length) return a.v+': can’t meet '+a.flags.apptViol.length+' fixed appointment(s) — add crew earlier or move a job to the other truck';
    if(a.minNeed==null) return a.v+': driving alone ('+r1(a.driveH)+'h) won’t fit the shift — split jobs to the other truck';
    return a.v+' '+r1(a.onSiteH)+'h on-site + '+r1(a.driveH)+'h drive: '+(a.ot>0?'needs ~'+a.minNeed+' '+(a.minNeed>1?'people':'person')+(a.k?' (has '+a.k+')':''):'fits with '+a.k+' crew, finish '+fmtClock(a.finishMin));
  });
  const anyR=day.vehs.some(a=>a.status==='r'), anyA=day.vehs.some(a=>a.status==='a');
  out.push([anyR?'bad':anyA?'':'ok','\u{1F465} Crew & timing — '+parts.join(' · ')]);
  if(!day.ros.length&&isDefault(day.date)){out.push(['bad','No one is rostered to myMowing in Deputy for this day. Roster crew (and set their vehicle in the shift comment).']);}
  (day.conflicts||[]).forEach(cf=>out.push(['bad','⛔ '+cf.emp+' is double-booked across '+cf.vehs.join(' & ')+' at overlapping times — one person can’t be on two trucks. Fix the allocation below.']));
  const reb=rebalanceSuggestion(day.date,day._sc||scenario);
  if(reb) out.push(['info','↔ Better balance: move '+esc(reb.job.address)+' from '+reb.from+' to '+reb.to+' — saves ~'+fmtDur(reb.saved)+' of overtime. (Same date; it stays on '+fmtShort(day.date)+'.)']);
  day.vehs.forEach(a=>{
    if(a.xfer&&a.xfer.length) out.push(['','⚠ '+a.v+': '+a.xfer.join(', ')+' outside roster/another brand — needs approval + a Deputy roster change.']);
    if(a.flags.transport.length) out.push(['info','\u{1F699} '+a.v+': '+a.flags.transport.map(t=>t.emp+(t.kind==='leaves'?' leaves mid-route '+fmtClock(t.at):' joins '+fmtClock(t.at))).join('; ')+' — plan transport.']);
    if(a.status==='r'){
      if(!a.k) out.push(['bad',a.v+': no crew assigned but '+r1(a.onSiteH)+'h of work. Allocate crew below, or move its jobs to the other truck.']);
      else if(a.needSpec&&!a.haveSpec) out.push(['bad',a.v+': garden/hedge jobs but no specialist. Put Blake or Julen on '+a.v+'.']);
      else if(a.reasons.length) out.push(['bad',a.v+': '+a.reasons[0]+'.']);
    } else if(a.status==='a'&&a.reasons.length){ out.push([a.driveH==null?'info':'',a.v+': '+a.reasons.join('. ')+'.']); }
  });
  if(day.vehs.every(a=>a.status==='g'||a.status==='n')&&!day.vehs.some(a=>(a.xfer&&a.xfer.length)||a.flags.transport.length)) out.push(['ok','Both vehicles can complete their work (on-site + driving) with the rostered crew and meet every fixed appointment. No extra staff or overtime needed.']);
  return out;
}

// ---- Find capacity (fit a NEW urgent job using real insertion travel; never moves scheduled work) ----
// On-demand Mapbox geocode + point-to-route matrix for a NEW address (public token from the feed).
const _geoCache={}, _ptMxCache={};
async function geocodeAddr(addr){ const tok=MTOKEN(); if(!tok||!addr)return null; const k=addr.trim().toLowerCase();
  if(_geoCache[k]!==undefined)return _geoCache[k];
  const q=encodeURIComponent(/nsw|australia/i.test(addr)?addr:addr+', NSW, Australia');
  const url='https://api.mapbox.com/search/geocode/v6/forward?q='+q+'&country=au&limit=1&proximity=151.28,-33.79&access_token='+tok;
  try{const r=await fetch(url);if(!r.ok){_geoCache[k]=null;return null;}const j=await r.json();const c=j.features&&j.features[0]&&j.features[0].geometry&&j.features[0].geometry.coordinates;const v=(c&&c.length===2)?c:null;_geoCache[k]=v;return v;}catch(e){_geoCache[k]=null;return null;}
}
async function ptToCoords(pt,coords){ const tok=MTOKEN(); if(!tok)return null;   // seconds from pt to each coord (sources=0)
  const all=[pt].concat(coords); if(all.length>25)all.length=25;
  const key=all.map(c=>c[0].toFixed(5)+','+c[1].toFixed(5)).join(';'); if(_ptMxCache[key])return _ptMxCache[key];
  const url='https://api.mapbox.com/directions-matrix/v1/mapbox/driving/'+all.map(c=>c[0]+','+c[1]).join(';')+'?sources=0&annotations=duration&access_token='+tok;
  try{const r=await fetch(url);if(!r.ok)return null;const j=await r.json();const row=j&&j.durations&&j.durations[0];if(row)_ptMxCache[key]=row;return row||null;}catch(e){return null;}
}
// real cheapest-insertion of a new point into a vehicle's route (uses the new Mapbox legs + the cached matrix)
async function realInsertion(d,v,sc,pt,mins){
  const a=assessVeh(d,v,sc); if(!a.k||a.driveH==null)return null;
  const depot=DATA.config&&DATA.config.depotCoord; if(!depot)return null;
  const stops=a.stops.filter(s=>!s.unroutable&&s.job.lng!=null); if(!stops.length)return null;
  const coords=[depot].concat(stops.map(s=>[s.job.lng,s.job.lat]));
  const ptTo=await ptToCoords(pt,coords); if(!ptTo)return null;   // ptTo[0]=pt→depot, ptTo[1..]=pt→stop
  const secAt=i=>ptTo[i]; // pt↔node (symmetric approx)
  const idxList=[0].concat(stops.map(s=>jobIdx(d,s.job.id)));   // matrix indices for depot+stops, aligned to coords
  let best=Infinity;
  for(let p=0;p<=stops.length;p++){
    const prevI=idxList[p], nextI=p<stops.length?idxList[p+1]:0;   // insert between stop p-1 and p (depot ends)
    const existing=legSec(d,prevI,nextI); if(existing==null)continue;
    const add=secAt(p)+secAt(p+1<=stops.length?p+1:0)-existing;   // pt uses coords-position p (prev) and p+1 (next)
    if(add<best)best=add;
  }
  if(!isFinite(best))best=Math.min.apply(null,ptTo.slice(1))*2;   // fallback: nearest stop round-trip
  const addDriveMin=Math.max(0,Math.round(best/60));
  const onsitePer=mins/Math.max(1,a.k);
  const newFinish=a.finishMin+addDriveMin+onsitePer;
  return {a,addDriveMin,onsitePer,newFinish,over:Math.max(0,newFinish-a.win.endMin),real:true};
}
// estimate-only insertion (no address / no token): median leg of the day
function estInsertion(d,v,sc,mins,skillReq,area){
  const a=assessVeh(d,v,sc); if(!a.k||a.driveH==null)return null;
  const needSpec=skillReq==='Specialist'||skillReq==='Mixed'; if(needSpec&&!a.haveSpec)return null;
  let extra=medianLegSec(d); if(extra==null)extra=0;
  const sameArea=a.regions.includes(area)||area==='Any';
  const addDriveMin=Math.round((sameArea?extra*0.6:extra)/60), onsitePer=mins/Math.max(1,a.k);
  const newFinish=a.finishMin+addDriveMin+onsitePer;
  return {a,addDriveMin,onsitePer,newFinish,over:Math.max(0,newFinish-a.win.endMin),sameArea,real:false};
}
async function findCapacity(mins,skillReq,area,pt,apptMin){
  const today=DATA.today, out=[]; const needSpec=skillReq==='Specialist'||skillReq==='Mixed';
  for(const d of DATA.dates.filter(d=>d>=today)){ const sc=defaultScenario(d);
    for(const v of VEH()){ const a=assessVeh(d,v,sc); if(!a.k||a.driveH==null)continue; if(needSpec&&!a.haveSpec)continue;
      // appointment: the crew must actually be on this truck at that time
      if(apptMin!=null&&!a.crew.some(c=>c.start<=apptMin&&apptMin<c.end))continue;
      const c=pt?await realInsertion(d,v,sc,pt,mins):estInsertion(d,v,sc,mins,skillReq,area);
      if(!c||c.over>1)continue;
      out.push({d,v,crew:a.crew.map(x=>x.emp),finish:c.newFinish,addDrive:c.addDriveMin,onsitePer:c.onsitePer,real:c.real,sameArea:c.sameArea||false,buffer:a.win.endMin-c.newFinish,win:a.win.netH,k:a.k,onSiteH:a.onSiteClockH,drive:a.driveH});
    }
  }
  out.sort((x,y)=>{ if(!pt&&x.sameArea!==y.sameArea)return x.sameArea?-1:1; if(x.d!==y.d)return x.d<y.d?-1:1; return y.buffer-x.buffer; });
  return out;
}

// ---- load + decrypt ----
async function decryptFeed(meta,pass){
  const raw=Uint8Array.from(atob(meta.data),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), body=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:meta.iter||200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,body);
  return JSON.parse(new TextDecoder().decode(pt));
}

  const go=async()=>{ const p=$('gpass').value; if(!p)return; $('gbtn').textContent='Unlocking…';
    try{ DATA=await decryptFeed(meta,p); sessionStorage.setItem('mowpass',p); start(); }
    catch(e){ $('gerr').textContent='Wrong passphrase — try again.'; $('gbtn').textContent='Unlock'; } };
  $('gbtn').onclick=go; $('gpass').onkeydown=e=>{if(e.key==='Enter')go();};
}

  const unresolved=DATA.jobs.filter(j=>j.geo===false).length;
