<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>myMowing Operations Planner</title><style>

.statusbar{height:5px;border-radius:4px;background:#eef2ef;overflow:hidden;margin-top:9px}.statusbar>span{display:block;height:100%}

.ava{width:26px;height:26px;border-radius:50%;background:#2e8b57;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}

label.fl{font-size:11px;color:#5b6b60;text-transform:uppercase;font-weight:700;letter-spacing:.03em;display:block;margin-bottom:3px}
.banner{background:#fff4d6;border:1px solid #f0e2c4;color:#7a5e12;border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}

.rt li{padding:2px 0}.rt .n{display:inline-block;width:20px;color:#8a988f;font-weight:800}
@media(max-width:720px){.weekstrip{grid-template-columns:1fr 1fr}}
</style></head><body><div class=wrap>
<header><div><div class=logo>my<b>Mowing</b> <span style="font-weight:600;color:#5b6b60;font-size:15px">Operations Planner</span></div></div>
<div class=asof id=asof></div></header>
<div class=sub id=sub></div>
<div id=gate></div>
<div id=app hidden>
<div id=banner></div>
<div class=tabs><button class="tb on" data-p=week>Weekly</button><button class=tb data-p=day>Daily plan</button><button class=tb data-p=find>Find capacity</button></div>
<div id=p-week></div>
<div id=p-day hidden></div>
<div id=p-find hidden></div>
<div class=note style="margin-top:22px" id=footnote></div>
</div>
<div class=toast id=toast></div>
<script>
let DATA=null, curDay=null, scenario=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const r1=x=>Math.round(x*10)/10;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});
const fmtShort=d=>{const dd=new Date(d+'T12:00:00');return DOW[dd.getDay()]+' '+dd.getDate();};
const STLABEL={g:'Green',a:'Amber',r:'Red',n:'No work'};
const REGIONS=['Manly Council','Warringah/Pittwater','North Shore'];
const VEH=()=>(DATA.config&&DATA.config.vehicles)||['HOPPER','MOE'];
const MAXH=()=>(DATA.config&&DATA.config.maxHours)||10;
const BREAK=()=>((DATA.config&&DATA.config.breakMins)||30)/60;   // hours
const ROUTING=()=>!!(DATA.config&&DATA.config.routingAvailable);
const parseHM=s=>{const m=/(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null;};
function fmtClock(mins){let h=Math.floor(mins/60),m=Math.round(mins%60);if(m===60){h++;m=0;}const ap=(h%24)>=12?'pm':'am';let hh=(h%24)%12;if(hh===0)hh=12;return hh+':'+String(m).padStart(2,'0')+ap;}

// ---- data access ----
function jobsOn(d){return DATA.jobs.filter(j=>j.date===d);}
function activeJobs(d){return jobsOn(d).filter(j=>!(j.done&&DATA.today&&j.date>DATA.today));}
function reschedJobs(d){return jobsOn(d).filter(j=>j.done&&DATA.today&&j.date>DATA.today);}
function availOn(d){return (DATA.availability&&DATA.availability[d])||{};}
function rosterOn(d){return (DATA.roster&&DATA.roster[d])||[];}
function isSpec(e){return DATA.staff[e]&&DATA.staff[e].specialist;}
function crewCovers(areas,region){return (areas||[]).some(a=>(a==='Warringah'&&/Warringah/.test(region))||(a==='Manly'&&/Manly/.test(region))||(a==='North Shore'&&/North Shore/.test(region)));}
function isWorking(d,e){const a=availOn(d)[e];return !!(a&&a.working);}
function isCrossOU(d,e){const a=availOn(d)[e];return !!(a&&a.working&&!a.onMowing);}
function jobKey(j){return j.id!=null?('#'+j.id):(j.date+'|'+j.area+'|'+j.address);}

// ---- routing (driving times from the baked Mapbox matrix; index 0 = depot) ----
function matrixFor(d){return (DATA.matrix&&DATA.matrix[d])||null;}
function jobIdx(d,id){const m=matrixFor(d);if(!m||!m.ids)return -1;const i=m.ids.indexOf(id);return i<0?-1:i+1;}
function legSec(d,a,b){const m=matrixFor(d);if(!m||!m.dur||!m.dur[a])return null;const x=m.dur[a][b];return x==null?null:x;}
function routeSeconds(d,order){const m=matrixFor(d);if(!m||!m.dur||!order.length)return null;let t=0,prev=0;for(const idx of order){const l=legSec(d,prev,idx);if(l==null)return null;t+=l;prev=idx;}const back=legSec(d,prev,0);if(back==null)return null;return t+((DATA.config&&DATA.config.returnToDepot===false)?0:back);}
function apptMins(appt){if(!appt||appt==='STRICT')return null;const m=/(\d{1,2})([:.](\d{2}))?\s*(am|pm)?/i.exec(appt);if(!m)return null;let h=+m[1],mm=m[3]?+m[3]:0;const ap=(m[4]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return h*60+mm;}
function twoOpt(d,route){if(route.length<3)return route;let best=route.slice(),bestS=routeSeconds(d,best),guard=0,improved=true;while(improved&&guard++<40){improved=false;for(let i=0;i<best.length-1;i++)for(let j=i+1;j<best.length;j++){const cand=best.slice(0,i).concat(best.slice(i,j+1).reverse(),best.slice(j+1));const s=routeSeconds(d,cand);if(s!=null&&bestS!=null&&s<bestS-1){best=cand;bestS=s;improved=true;}}}return best;}
// Optimise visit order: fixed-time jobs are anchored in time order; the rest are inserted cheapest-first.
function planRoute(d,jobs){
  const m=matrixFor(d);
  const idxOf=j=>jobIdx(d,j.id);
  const routable=jobs.filter(j=>idxOf(j)>0);
  const unroutable=jobs.filter(j=>idxOf(j)<=0);
  if(!m||!m.dur||!routable.length) return {order:jobs.slice(),driveSec:null,unroutable,hasAppt:false};
  const timed=routable.filter(j=>apptMins(j.appt)!=null).sort((a,b)=>apptMins(a.appt)-apptMins(b.appt));
  const free=routable.filter(j=>apptMins(j.appt)==null);
  let route=timed.map(idxOf);
  for(const j of free){const ji=idxOf(j);let bp=route.length,bc=Infinity;for(let p=0;p<=route.length;p++){const prev=p===0?0:route[p-1],next=p===route.length?0:route[p];const add=(legSec(d,prev,ji)||0)+(legSec(d,ji,next)||0)-(legSec(d,prev,next)||0);if(add<bc){bc=add;bp=p;}}route.splice(bp,0,ji);}
  if(!timed.length)route=twoOpt(d,route);
  const byIdx={};routable.forEach(j=>byIdx[idxOf(j)]=j);
  const order=route.map(i=>byIdx[i]).concat(unroutable);
  return {order,driveSec:routeSeconds(d,route),unroutable,hasAppt:timed.length>0};
}
function medianLegSec(d){const m=matrixFor(d);if(!m||!m.dur)return null;const xs=[];for(let i=0;i<m.dur.length;i++)for(let j=0;j<m.dur.length;j++)if(i!==j&&m.dur[i][j]!=null)xs.push(m.dur[i][j]);if(!xs.length)return null;xs.sort((a,b)=>a-b);return xs[Math.floor(xs.length/2)];}

// ---- crew working window (actual Deputy shifts, minus a break) ----
function vehWindow(d,crew){
  let starts=[],ends=[];
  crew.forEach(e=>{const a=availOn(d)[e];const s=a&&a.start?parseHM(a.start):null,en=a&&a.end?parseHM(a.end):null;if(s!=null)starts.push(s);if(en!=null)ends.push(en);});
  const cfgS=parseHM((DATA.config&&DATA.config.startTime)||'07:00')||420;
  const cfgE=cfgS+MAXH()*60;
  const startMin=starts.length?Math.min.apply(null,starts):cfgS;
  const endMin=ends.length?Math.max.apply(null,ends):cfgE;
  const grossH=(endMin-startMin)/60;
  const netH=Math.max(1,grossH-BREAK());
  const uneven=ends.length>1&&(Math.max.apply(null,ends)-Math.min.apply(null,ends))>60;
  return {startMin,endMin,grossH,netH,uneven};
}

// ---- scenario (proposed allocation) ----
function defaultScenario(d){
  const sc={emp:{},region:{},job:{}};
  rosterOn(d).forEach(r=>{ sc.emp[r.emp]=VEH().includes(r.vehicle)?r.vehicle:VEH()[0]; });
  const byVeh=crewByVeh(sc);
  REGIONS.forEach(reg=>{
    let v=VEH().find(veh=>(byVeh[veh]||[]).some(e=>{const r=rosterOn(d).find(x=>x.emp===e);return r&&crewCovers(r.areas,reg);}));
    if(!v) v=VEH().find(veh=>(byVeh[veh]||[]).length)||VEH()[0];
    sc.region[reg]=v;
  });
  return sc;
}
function crewByVeh(sc){const m={};VEH().forEach(v=>m[v]=[]);Object.keys(sc.emp).forEach(e=>{const v=sc.emp[e];if(v&&v!=='off'&&m[v])m[v].push(e);});return m;}
function vehOfJob(sc,j){ return (sc.job&&sc.job[jobKey(j)]) || sc.region[j.area] || VEH()[0]; }
function isDefault(d){return JSON.stringify(defaultScenario(d))===JSON.stringify(scenario);}

// ---- rotation ----
function isoWeek(d){const dt=new Date(d+'T12:00:00');const day=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-day+3);const first=new Date(dt.getFullYear(),0,4);return 1+Math.round(((dt-first)/86400000-3+((first.getDay()+6)%7))/7);}
function rotLabel(d){return (isoWeek(d)%2===0)?'Week 1':'Week 2';}

// ---- per-vehicle assessment (on-site work shared by crew + route driving added once) ----
function assessVeh(d,v,sc){
  const crew=crewByVeh(sc)[v]||[];
  const jobs=activeJobs(d).filter(j=>vehOfJob(sc,j)===v);
  const onSiteH=jobs.reduce((s,j)=>s+(j.est||0),0)/60;
  const k=crew.length;
  const win=vehWindow(d,crew);
  const rp=planRoute(d,jobs);
  const driveH=rp.driveSec!=null?rp.driveSec/3600:null;
  const onSitePer=k?onSiteH/k:onSiteH;
  const elapsed=(driveH!=null)?driveH+onSitePer:null;              // working content, excl. break
  const finishMin=(elapsed!=null)?win.startMin+(elapsed+BREAK())*60:null;
  const util=(elapsed!=null&&win.netH>0)?Math.round(elapsed/win.netH*100):null;
  const needSpec=jobs.some(j=>j.skill==='Specialist'||j.skill==='Mixed');
  const haveSpec=crew.some(isSpec);
  const missingEst=jobs.filter(j=>j.est==null).length;
  const regions=[...new Set(jobs.map(j=>j.area))];
  const xfer=crew.filter(e=>isCrossOU(d,e));
  let minNeed=null; if(driveH!=null&&k){for(let kk=1;kk<=6;kk++){if(driveH+onSiteH/kk<=win.netH){minNeed=kk;break;}}}
  const drivingFloorBlocks=(driveH!=null&&driveH>win.netH);
  let status='g',reasons=[],ot=0;
  if(!jobs.length){status='n';}
  else if(!k){status='r';reasons.push('No crew assigned — this truck can’t run its '+r1(onSiteH)+'h of on-site work');}
  else if(needSpec&&!haveSpec){status='r';reasons.push('Garden/hedge work but no specialist (Blake/Julen) on this crew');}
  else if(driveH==null){status='a';reasons.push('⚠ Driving time unverified'+(rp.unroutable.length?' — '+rp.unroutable.length+' address(es) couldn’t be located':(ROUTING()?' — routing data not ready for this day':' — routing not configured'))+'. On-site work alone is '+r1(onSitePer)+'h across '+k+' crew; real finish will be later once driving is added.');}
  else if(elapsed>win.netH){status='r';ot=r1(elapsed-win.netH);reasons.push(r1(onSiteH)+'h on-site ÷ '+k+' + '+r1(driveH)+'h driving = '+r1(elapsed)+'h, over the '+r1(win.netH)+'h window by ~'+ot+'h'+(drivingFloorBlocks?' — driving alone ('+r1(driveH)+'h) exceeds the window, so more crew won’t fix it; split jobs to the other truck':(minNeed&&minNeed>k?'; needs '+minNeed+' crew on this truck':'')));}
  else if(util!=null&&util>90){status='a';reasons.push('Tight — '+r1(elapsed)+'h of the '+r1(win.netH)+'h window ('+util+'%)');}
  if(missingEst>0&&status!=='r'){if(status==='g')status='a';reasons.push(missingEst+' job(s) missing an EST (on-site understated)');}
  if(win.uneven&&status!=='r'){if(status==='g')status='a';reasons.push('Crew shifts end at different times — capacity drops later in the day');}
  if(xfer.length&&status==='g')status='a';
  return {v,crew,jobs,onSiteH,driveH,elapsed,finishMin,util,k,win,needSpec,haveSpec,missingEst,regions,status,reasons,ot,xfer,minNeed,route:rp};
}
const RANK={r:3,a:2,g:1,n:0};
function assessDay(d,sc){
  sc=sc||defaultScenario(d);
  const ros=rosterOn(d), avail=availOn(d);
  const vehs=VEH().map(v=>assessVeh(d,v,sc));
  const active=activeJobs(d);
  const onSiteH=active.reduce((s,j)=>s+(j.est||0),0)/60;
  const driveVals=vehs.filter(a=>a.jobs.length).map(a=>a.driveH);
  const driveKnown=driveVals.length&&driveVals.every(x=>x!=null);
  const driveH=driveKnown?driveVals.reduce((s,x)=>s+x,0):null;
  let status=active.length?'g':'n';
  vehs.forEach(a=>{ if(a.status!=='n'&&RANK[a.status]>RANK[status]) status=a.status; });
  if(active.length&&!ros.length&&isDefault(d)) status='r';
  const workingCount=Object.values(avail).filter(a=>a.working).length;
  return {date:d, vehs, active, resched:reschedJobs(d), onSiteH, driveH, ros, avail, workingCount, status};
}

// ---- weekly ----
let weekAnchor=null;
function setWeekFrom(iso){ weekAnchor=iso; DATA.week=weekOf(iso);
  if(!DATA.week.includes(curDay)){ curDay=DATA.week.find(d=>activeJobs(d).length)||DATA.week[0]; scenario=defaultScenario(curDay); }
  renderWeek(); }
function shiftWeek(delta){ const nd=new Date(weekAnchor+'T12:00:00'); nd.setDate(nd.getDate()+delta*7); setWeekFrom(nd.toISOString().slice(0,10)); }
function renderWeek(){
  const first=DATA.dates[0], last=DATA.dates[DATA.dates.length-1];
  const canPrev=DATA.week[0]>first, canNext=DATA.week[4]<last;
  const nav='<div style="display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap"><button class="btn ghost sm" id=wprev '+(canPrev?'':'disabled')+'>◀ Prev</button><b>Week of '+fmtDate(DATA.week[0])+'</b><span class=rotbadge title="Fortnightly rotation">↻ Rotation '+rotLabel(DATA.week[0])+'</span><button class="btn ghost sm" id=wnext '+(canNext?'':'disabled')+'>Next ▶</button></div>';
  $('p-week').innerHTML=nav+'<div class=weekstrip>'+DATA.week.map(date=>{
    const a=assessDay(date,defaultScenario(date)); const dd=new Date(date+'T12:00:00');
    const col=a.status==='g'?'#2e8b57':a.status==='a'?'#d9a520':a.status==='r'?'#c4452b':'#cfd8d2';
    const done=a.active.filter(j=>j.done).length;
    const maxUtil=a.vehs.reduce((m,x)=>Math.max(m,x.util||0),0);
    return '<div class=daycard data-d="'+date+'">'+
      '<div class=dn>'+DOW[dd.getDay()]+'</div><div class=dd>'+dd.getDate()+' '+dd.toLocaleDateString('en-AU',{month:'short'})+'</div>'+
      (a.active.length?('<div class=big>'+r1(a.onSiteH)+'<span style="font-size:12px;color:#8a988f"> h site</span></div>'+
      '<div class=u>'+(a.driveH!=null?'+ '+r1(a.driveH)+'h drive':'<span style="color:#b07d2a">drive n/a</span>')+' · '+a.active.length+' jobs · '+a.ros.length+' crew'+(done===a.active.length&&a.active.length?' · ✓ done':done?' · ✓'+done+'/'+a.active.length:'')+(a.resched.length?' · ↩ '+a.resched.length:'')+'</div>'+
      '<div class=u style="color:#8a988f">'+a.vehs.filter(x=>x.status!=='n').map(x=>x.v+' '+STLABEL[x.status][0]).join(' · ')+'</div>'+

function dayRecs(day){
  const out=[];
  if(!day.active.length){out.push(['','No jobs scheduled this day.']);return out;}

    if(a.driveH==null) return a.v+' '+r1(a.onSiteH)+'h on-site: driving unverified — staffing can’t be confirmed until routes are available';

  out.push([anyR?'bad':anyA?'':'ok','👥 Crew to finish within the shift — '+parts.join(' · ')]);
  if(!day.ros.length&&isDefault(day.date)){out.push(['bad','No one is rostered to myMowing in Deputy for this day. Roster crew (and set their vehicle in the shift comment).']);}
  day.vehs.forEach(a=>{

// ---- Find capacity (fit a NEW urgent job; never moves scheduled work) ----
function findCapacity(mins,skillReq,area){
  const e=mins/60, today=DATA.today;
  const needSpec=skillReq==='Specialist'||skillReq==='Mixed';
  const out=[];
  DATA.dates.filter(d=>d>=today).forEach(d=>{
    const sc=defaultScenario(d);
    VEH().forEach(v=>{
      const a=assessVeh(d,v,sc);
      if(!a.k) return;
      if(needSpec&&!a.haveSpec) return;
      if(a.driveH==null) return;                       // can't judge fit without driving
      const extraDrive=(medianLegSec(d)||0)/3600;      // est. travel to slot in one more stop
      const spareOnSite=a.k*(a.win.netH-a.driveH-extraDrive)-a.onSiteH;   // one-person hours free
      if(spareOnSite < e-0.01) return;
      const geo=area==='Any'||a.regions.includes(area)||a.crew.some(emp=>{const r=rosterOn(d).find(x=>x.emp===emp);return r&&crewCovers(r.areas,area);});
      const newElapsed=a.driveH+extraDrive+(a.onSiteH+e)/a.k;
      out.push({d,v,crew:a.crew.slice(),spare:spareOnSite,geo,drive:a.driveH,extraDrive,onSiteH:a.onSiteH,win:a.win.netH,newElapsed,k:a.k,finish:a.win.startMin+(newElapsed+BREAK())*60});
    });
  });
  out.sort((x,y)=>{ if(x.geo!==y.geo)return x.geo?-1:1; if(x.d!==y.d)return x.d<y.d?-1:1; return y.spare-x.spare; });
  return out;
}

    h+=res.slice(0,6).map((o,i)=>'<div class="rec '+(i===0?'ok':'')+'" style="margin-top:8px"><b>'+fmtDate(o.d)+' · '+rotLabel(o.d)+'</b> — 🚚 '+o.v+' ('+esc(o.crew.join(' + '))+')'+

    h+='<div class=note style="margin-top:8px">Extra travel is estimated from that day’s typical leg; confirm the exact detour once the stop is added. Ranked by same-area, then soonest, then most room.</div>';

function copyWA(date,detailed){

  let m='📅 *MYMOWING — '+fmtDate(date).toUpperCase()+'*'+(detailed?' (RUN SHEET)':'')+'\n'+(proposed?'⚠️ *PROPOSED PLAN — not yet in Deputy*\n':'(as rostered in Deputy)\n')+'↻ Rotation '+rotLabel(date)+'\n\n'+emo+' *STATUS: '+STLABEL[day.status].toUpperCase()+'*\n\n';
  const crewList=[...new Set([].concat.apply([],day.vehs.map(a=>a.crew)))];
  m+='*Overview*\n• Jobs: '+day.active.length+'\n• On-site work: ~'+r1(day.onSiteH)+'h · Driving: '+(day.driveH!=null?'~'+r1(day.driveH)+'h':'n/a')+'\n• Crew on the plan: '+(crewList.join(', ')||'none')+'\n• Available in Deputy: '+day.workingCount+'\n\n';
  day.vehs.forEach(a=>{ if(a.status==='n'&&!a.crew.length)return;
    m+='🚚 *'+a.v+'* — '+(a.crew.join(' + ')||'NO CREW')+'\n'+(a.regions.join(', ')||'—')+' · '+a.jobs.length+' jobs\n'+
       '~'+r1(a.onSiteH)+'h on-site'+(a.k?' ÷ '+a.k:'')+(a.driveH!=null?' + '+r1(a.driveH)+'h drive = '+r1(a.elapsed)+'h':' + drive n/a')+(a.finishMin!=null?' · finish ~'+fmtClock(a.finishMin):'')+' · '+STLABEL[a.status]+'\n';
    if(a.xfer&&a.xfer.length) m+='   ⚠ '+a.xfer.join(', ')+' — needs approval + Deputy roster change\n';
    if(detailed){ a.route.order.forEach((j,i)=>{ m+=(i+1)+'. '+(j.est!=null?j.est+'m':'—')+'  '+j.address+(j.skill&&j.skill!=='Basic'&&j.skill!=='Unknown'?' ['+j.skill+']':'')+(j.appt?(j.appt==='STRICT'?' ⏰STRICT':' ⏰'+j.appt):'')+'\n'; }); }
    m+='\n';
  });
  if(detailed&&day.resched.length){ m+='↩ *Rescheduled/cancelled* ('+day.resched.length+')\n'+day.resched.map(j=>'• '+j.address).join('\n')+'\n\n'; }
  const rr=dayRecs(day); m+='💡 *Recommendation*\n'+rr.map(r=>'• '+r[1]).join('\n')+'\n\n✅ Review and 👍 if this works'+(proposed?' — then roster it in Deputy.':'.');
  navigator.clipboard.writeText(m).then(()=>{const t=$('toast');t.textContent='Copied — paste into WhatsApp';t.className='toast show';setTimeout(()=>t.className='toast',1800);});
}
// ---- tabs ----
function wireTabs(){[...document.querySelectorAll('.tb')].forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x===b));
  $('p-week').hidden=b.dataset.p!=='week'; $('p-day').hidden=b.dataset.p!=='day'; $('p-find').hidden=b.dataset.p!=='find';
  if(b.dataset.p==='day')renderDay();
  if(b.dataset.p==='find')renderFind();
});}
function weekOf(today){var t=new Date(today+'T12:00:00');var dow=t.getDay();var mon=new Date(t);mon.setDate(t.getDate()+(dow===0?-6:1-dow));var wk=[];for(var i=0;i<5;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);wk.push(d.toISOString().slice(0,10));}return wk;}
// ---- load + decrypt ----
async function decryptFeed(meta,pass){
  const raw=Uint8Array.from(atob(meta.data),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), body=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:meta.iter||200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,body);
  return JSON.parse(new TextDecoder().decode(pt));
}
function showGate(meta){
  $('gate').innerHTML='<div class=gate><div style="font-size:15px;font-weight:700;margin-bottom:4px">🔒 myMowing planner</div><div class=note>Enter the team passphrase to unlock the schedule.</div><input id=gpass type=password placeholder=Passphrase autofocus><button class=btn id=gbtn style="width:100%">Unlock</button><div class=note id=gerr style="color:#b4452b;margin-top:8px"></div></div>';
  const go=async()=>{ const p=$('gpass').value; if(!p)return; $('gbtn').textContent='Unlocking…';
    try{ DATA=await decryptFeed(meta,p); sessionStorage.setItem('mowpass',p); start(); }
    catch(e){ $('gerr').textContent='Wrong passphrase — try again.'; $('gbtn').textContent='Unlock'; } };
  $('gbtn').onclick=go; $('gpass').onkeydown=e=>{if(e.key==='Enter')go();};
}
async function load(){
  let meta=null;
  try{const r=await fetch('mowing.enc?cb='+Date.now());if(r.ok)meta=await r.json();}catch(e){}
  if(meta){
    const cached=sessionStorage.getItem('mowpass');
    if(cached){ try{ DATA=await decryptFeed(meta,cached); start(); return; }catch(e){ sessionStorage.removeItem('mowpass'); } }
    showGate(meta); return;
  }
  try{const r=await fetch('mowing.json?cb='+Date.now());if(!r.ok)throw 0;DATA=await r.json();}
  catch(e){ $('gate').innerHTML='<div class=card>Live feed not published yet — it appears after the next scheduled run.</div>'; $('asof').textContent='no data'; return; }
  start();
}
function start(){
  $('gate').innerHTML=''; $('app').hidden=false;
  weekAnchor=DATA.today; DATA.week=weekOf(DATA.today);
  $('asof').textContent='Updated '+DATA.generatedAt;
  $('sub').innerHTML='Zenkit jobs + Deputy availability + '+(ROUTING()?'Mapbox driving times':'driving times (pending)')+' · <b>read-only</b> · feed covers '+fmtDate(DATA.dates[0])+' → '+fmtDate(DATA.dates[DATA.dates.length-1]);
  $('footnote').innerHTML='Zenkit <b>EST minutes are on-site work only</b>. Each vehicle’s day = on-site work ÷ crew (shared) <b>plus the real road driving time</b> for its route (depot → stops → depot), added once and not divided by crew — so adding people shrinks on-site time but never the driving. Driving comes from '+(ROUTING()?'the Mapbox road network':'Mapbox once the token is set')+', cached and refreshed monthly. Working window = each person’s actual Deputy shift minus a '+Math.round(BREAK()*60)+'-min break. Status is Red if a vehicle can’t finish on-site + driving inside its window, Amber if tight or unverified. The What-if planner re-routes both trucks when you move a job, never changes a job’s date, and only allocates people genuinely rostered in Deputy.';
  // unresolved / routing banner
  const unresolved=DATA.jobs.filter(j=>j.geo===false).length;
  let bn='';
  if(!ROUTING()) bn='<div class=banner>⚠ Driving times are not yet available (Mapbox token not set). Hours shown are on-site work only — add the <code>MAPBOX_TOKEN</code> secret and real driving fills in on the next run.</div>';
  else if(unresolved) bn='<div class=banner>⚠ '+unresolved+' job address(es) couldn’t be located on the map, so their driving time is excluded. They’re tagged “no location” — fix the address in Zenkit to include them.</div>';
  $('banner').innerHTML=bn;
  curDay=DATA.week[0]; scenario=defaultScenario(curDay);
  wireTabs(); renderWeek();
  setTimeout(function(){try{location.replace(location.pathname+'?t='+Date.now());}catch(e){location.reload();}},300000);
}
load();
</script></body></html>
