<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>myBins — Weekly Roster Planner</title>
<style>
  :root{--bg:#0f1420;--panel:#172033;--panel2:#1d2840;--ink:#e8eef9;--mut:#93a1bd;--line:#2a3550;
    --out:#3b82f6;--in:#8b5cf6;--clean:#14b8a6;--veg:#84cc16;--pressure:#f97316;
    --normal:#22c55e;--heavy:#ef4444;--light:#64748b;--warn:#f59e0b;--accent:#38bdf8;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:var(--mut);font-size:12.5px}
  .estnote{background:#2a2410;border:1px solid #5c4d12;color:#f1d98a;border-radius:8px;padding:7px 11px;font-size:12px;margin:10px 0}
  .days{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
  .day{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600}
  .day small{display:block;color:var(--mut);font-weight:400;font-size:11px}
  .day.on{background:var(--accent);color:#06203a;border-color:var(--accent)}
  .day.on small{color:#0a2b47}
  .staffbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .staffbar h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .emps{display:flex;gap:7px;flex-wrap:wrap}
  .emp{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:12.5px}
  .emp .pw{width:34px;background:#0e1626;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:2px 4px;font-size:11px;text-align:center}
  .emp .load{color:var(--mut);font-size:11px}
  .emp.over{border-color:var(--heavy)}
  .daysum{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--mut)}
  .daysum b{color:var(--ink)}
  .warn{color:var(--warn)}
  .area{margin:16px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card .top{padding:12px 13px;cursor:pointer}
  .crow{display:flex;align-items:center;gap:8px}
  .cname{font-weight:700;font-size:14.5px;flex:1}
  .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.03em}
  .b-OUT{background:var(--out)}.b-IN{background:var(--in)}.b-CLEAN{background:var(--clean)}.b-VEG{background:var(--veg);color:#1a2e05}.b-PRESSURE{background:var(--pressure)}.b-MOVE{background:var(--out)}
  .load-Normal{background:var(--normal);color:#05230f}.load-Heavy{background:var(--heavy)}.load-Light{background:var(--light)}.load-baseline-building{background:#334155;color:var(--mut)}
  .meta{color:var(--mut);font-size:12px;margin-top:3px}
  .figs{display:flex;gap:14px;margin-top:10px;align-items:flex-end}
  .fig .n{font-size:21px;font-weight:800;line-height:1}
  .fig .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
  .fig.sm .n{font-size:15px;font-weight:700;color:var(--mut)}
  .alloc{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{font-size:12px;padding:4px 9px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);cursor:pointer}
  .chip.on{background:var(--accent);color:#06203a;border-color:var(--accent);font-weight:600}
  .need{font-size:11.5px;color:var(--warn);margin-top:7px}
  .det{border-top:1px solid var(--line);padding:12px 13px;background:var(--panel2);display:none;font-size:12.5px}
  .card.open .det{display:block}
  .bars{margin:6px 0 10px}
  .bar{height:10px;border-radius:5px;display:flex;overflow:hidden;background:#0e1626}
  .bar i{display:block;height:100%}
  .leg{display:flex;gap:12px;margin-top:5px;font-size:11px;color:var(--mut);flex-wrap:wrap}
  .leg span b{color:var(--ink)}
  .flags{margin:8px 0 0;padding:0;list-style:none}
  .flags li{padding:4px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .flags li:last-child{border:0}
  .ftag{font-size:10px;padding:1px 5px;border-radius:4px;background:#3a2a0e;color:#f1c475}
  .adj{margin-top:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .adj input[type=number]{width:60px;background:#0e1626;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 6px}
  .adj input[type=text]{flex:1;min-width:120px;background:#0e1626;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 6px}
  .btn{background:var(--accent);color:#06203a;border:0;border-radius:7px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:12.5px}
  .btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
  .extras{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:12.5px;color:var(--mut)}
  .extras b{color:var(--ink)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0a2b47;border:1px solid var(--accent);color:var(--ink);padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 40%);padding:12px 0 4px;display:flex;gap:10px;align-items:center;margin-top:10px}
  .muted{color:var(--mut)}
</style></head>
<body><div class="wrap">

    <span class="sub" id="sub"></span>

  <div class="estnote" id="estnote"></div>

    <div class="emps" id="emps"></div>
    <div class="daysum" id="daysum"></div>
  </div>
  <div id="board"></div>
  <div class="savebar">
    <button class="btn" id="save">Save roster</button>
    <span class="muted" id="savemsg"></span>
  </div>
</div>

  for(const a in areas){ const rs=runs.filter(r=>r.area===a); const ex=extras.filter(r=>r.area===a); if(!rs.length&&!ex.length) continue;
    html+='<div class="area">'+areas[a]+'</div><div class="cards">'+rs.map(card).join('')+'</div>';
    if(ex.length){ html+=ex.map(r=>'<div class="extras">Extras · <b>'+r.name+'</b> — '+r.jobs+' job'+(r.jobs!==1?'s':'')+' ('+r.bins+' bins), ~'+hrs(r.est.personHours)+'. <span class="muted">Fold into a nearby run; not a standalone roster.</span></div>').join(''); }
  }
  $('#board').innerHTML = html || '<p class="muted">No runs scheduled this day.</p>';
  wire();
}
function card(r){
  const k=r.shortId+'|'+r.date; const ph=runHours(r); const load=r.load&&r.load.band||'baseline-building';
  const alloc=allocFor(r); const need=Math.max(0,r.staffMin-alloc.length);
  const e=r.est;
  return '<div class="card" data-k="'+k+'"><div class="top">'+
    '<div class="crow"><span class="cname">'+r.name+'</span>'+
      '<span class="badge b-'+r.type+'">'+r.type+'</span>'+
      '<span class="badge load-'+load+'">'+(load==='baseline-building'?'BASELINE':load.toUpperCase())+'</span></div>'+
    '<div class="meta">'+r.jobs+' jobs · '+r.bins+' bins · '+e.density+(e.ungeocoded?' · <span class="warn">'+e.ungeocoded+' unmapped</span>':'')+'</div>'+
    '<div class="figs">'+
      '<div class="fig"><div class="n">'+hrs(ph)+'</div><div class="l">Total person-hrs</div></div>'+
      '<div class="fig sm"><div class="n">'+hrs(e.elapsedHours)+'</div><div class="l">Elapsed (2 crew)</div></div>'+
      '<div class="fig sm"><div class="n">'+e.perJobMin+'m</div><div class="l">Per job</div></div>'+
      '<div class="fig sm"><div class="n">'+r.staffMin+'</div><div class="l">Staff min</div></div></div>'+
    '<div class="alloc">'+staffList().map(n=>'<span class="chip '+(alloc.includes(n)?'on':'')+'" data-k="'+k+'" data-n="'+n+'">'+n+'</span>').join('')+'</div>'+
    (need?'<div class="need">Needs '+need+' more</div>':'')+
    '</div>'+ detail(r,k) +'</div>';
}
function detail(r,k){ const e=r.est; const tot=e.svcMin+e.walkMin+e.driveMin||1;
  const seg=(v,c)=>'<i style="width:'+(v/tot*100)+'%;background:'+c+'"></i>';
  const flags = (e.flagged||[]);
  return '<div class="det">'+
    '<div class="muted">Why this workload</div>'+
    '<div class="bars"><div class="bar">'+seg(e.svcMin,'#14b8a6')+seg(e.walkMin,'#84cc16')+seg(e.driveMin,'#3b82f6')+'</div>'+
      '<div class="leg"><span><b>'+e.svcMin+'m</b> servicing</span><span><b>'+e.walkMin+'m</b> walking</span><span><b>'+e.driveMin+'m</b> driving ('+e.driveSrc.replace('-',' ')+')</span><span><b>'+e.parkPoints+'</b> park-points</span></div></div>'+
    (flags.length?'<div class="muted">Heavier jobs in this run</div><ul class="flags">'+flags.slice(0,8).map(f=>'<li><span>'+(f.addr||'—')+'</span><span class="ftag">'+(f.cleanFreq||f.type)+(f.bins?' · '+f.bins+' bins':'')+'</span></li>').join('')+'</ul>':'<div class="muted">No unusual jobs — steady recurring work.</div>')+
    '<div class="adj">Adjust est: <input type="number" step="0.25" value="'+runHours(r)+'" data-k="'+k+'" class="adjh"> h '+
      '<input type="text" placeholder="reason (optional)" class="adjr" data-k="'+k+'" value="'+((ADJ[k+'|why'])||'')+'">'+
      '<button class="btn ghost adjsave" data-k="'+k+'">Apply</button>'+
      (ADJ[k]!=null?'<span class="muted">· overridden from '+hrs(r.est.personHours)+'</span>':'')+'</div>'+
    '</div>';
}
function wire(){
  document.querySelectorAll('.card .top').forEach(t=>t.onclick=e=>{ if(e.target.closest('.chip'))return; t.parentElement.classList.toggle('open'); });
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ const k=c.dataset.k,n=c.dataset.n; ALLOC[k]=ALLOC[k]||[]; const i=ALLOC[k].indexOf(n); if(i<0)ALLOC[k].push(n);else ALLOC[k].splice(i,1); renderAll(); });
  document.querySelectorAll('.adjsave').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; const h=document.querySelector('.adjh[data-k="'+CSS.escape(k)+'"]'); const why=document.querySelector('.adjr[data-k="'+CSS.escape(k)+'"]'); const v=parseFloat(h.value); if(!isNaN(v)){ADJ[k]=v; ADJ[k+'|why']=why.value;} renderAll(); toast('Estimate adjusted'); });
}
$('#save').onclick = async ()=>{
  const roster={alloc:ALLOC,adj:ADJ,pw:PWH};
  if(FEED.sample){ toast('Saved (sample — not persisted)'); return; }
  try{ const r=await fetch('/api/roster/'+FEED.weekStart,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({roster,baseVersion})});
    const j=await r.json(); if(j.ok){ baseVersion=j.version; $('#savemsg').textContent='Saved '+new Date().toLocaleTimeString(); toast('Roster saved'); }
    else if(j.error==='conflict'){ toast('Someone else saved — reload'); } else toast('Save failed'); }catch(e){ toast('Save failed'); }
};
boot();
</script>
</body></html>
