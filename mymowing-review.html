<script>
/* ============================================================================
   myMowing Daily Planner — reuses the existing scheduling engine.
   Jobs are NEVER silently allocated: every job starts Unallocated and Blake
   assigns it (or taps a suggestion). Reads mowing.json + projection.json only;
   never writes to Zenkit/Deputy. Keeps the existing working planner untouched.
============================================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ini=n=>String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const r1=x=>Math.round(x*10)/10;
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtLong=d=>{const t=new Date(d+'T12:00:00');return DOW[t.getDay()]+' '+t.getDate()+' '+t.toLocaleDateString('en-AU',{month:'short'});};

let DATA=null, curDay=null, scenario=null;
let MOWING=null, PROJ=null, DEMO=false, LOADERR=false, LOADERR_MSG='';
let dayMeta={}, planVersion=0, planSavedSig=null, planManifest=null, hoursOpen={};
let VIEW='week', weekAnchor=null;
let BASELINE_PLAN=null; // the plan as last loaded/saved for the open day — diffed against on save for the Activity Log
let PROPOSED={}, pendingAlloc=null, findInput={skill:'Basic',freq:0,days:[],time:'any'};

/* =================== PORTED ENGINE =================== */
const VEH=()=>(DATA.config&&DATA.config.vehicles)||['HOPPER','MOE'];
const MAXH=()=>(DATA.config&&DATA.config.maxHours)||10;
const BREAKM=()=>((DATA.config&&DATA.config.breakMins)||30);
const BREAK=()=>BREAKM()/60;
// Strict rule: a maximum of TWO people per vehicle at once, for every vehicle (HOPPER, MOE, ALPHA,
// DELTA, Big Bertha). Two sharing a vehicle are one crew; a third is never allowed.
const MAX_PER_VEH=2;
const SEATS=v=>MAX_PER_VEH;
const parseHM=s=>{const m=/(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null;};
const CFGSTART=()=>parseHM((DATA.config&&DATA.config.startTime)||'07:00')||420;
function fmtClock(mins){let h=Math.floor(mins/60),m=Math.round(mins%60);if(m===60){h++;m=0;}const ap=(h%24)>=12?'pm':'am';let hh=(h%24)%12;if(hh===0)hh=12;return hh+':'+String(m).padStart(2,'0')+ap;}
function fmtDur(min){min=Math.round(min);if(min<60)return min+' min';const h=Math.floor(min/60),m=min%60;return h+'h'+(m?' '+m+'m':'');}

/* ============ OCCURRENCE WORK-STATUS (accurate reschedule / done / skip handling) ============
   Zenkit stores each recurring visit as its OWN dated occurrence with its own state. A visit marked
   Done (Stage=Done / occState 'taskDone') is that specific occurrence being cleared — it is genuinely
   NOT due that day, and this is reliable per-occurrence (not a stale carry-over flag). So done
   occurrences are excluded from the day's workload, but kept visible: where the work actually went
   (serviced early / moved to another day — matched by property) and when it's next due. Blake can
   override a single occurrence (still-due, or done) — saved against THAT occurrence, never against the
   recurring customer, so the regular job keeps appearing on future dates. */
let OCCRES={}; let OCCRES_VER=0; const OCCRES_KEY='0001-01-03';   // per-occurrence resolutions (shared, like classifications)
function occKey(j){ return j.id!=null?('O'+j.id):('O'+j.date+'|'+(j.ruleId!=null?j.ruleId:j.address)); }
function workStatus(j){
  const ov=OCCRES[occKey(j)];
  if(ov==='due')return 'due';
  if(ov==='done')return 'done';
  return j.done ? 'done' : 'due';                 // trust Zenkit's per-occurrence Done state
}
function activeJobs(d){ return jobsOn(d).filter(j=>isJob(j)&&workStatus(j)==='due'); }   // genuine workload (counts, routing, staffing, Find all use this)
function clearedOn(d){ return jobsOn(d).filter(j=>isJob(j)&&workStatus(j)==='done'); }    // done / not due this day
function isCompleted(j){ return workStatus(j)==='done'; }
const _ak=a=>(a||'').toLowerCase().replace(/\s+/g,' ').trim();
// For a done occurrence: where the work actually went (same property serviced nearby) + next due date.
function doneInfo(j){
  const ak=_ak(j.address); let serviced=null;
  (MOWING.jobs||[]).forEach(o=>{ if(o!==j && o.done && o.date!==j.date && _ak(o.address)===ak){ const near=Math.abs((new Date(o.date)-new Date(j.date))/86400000)<=10; if(near&&(!serviced||o.date<serviced))serviced=o.date; } });
  let nextDue=null; const R=j.ruleId!=null?String(j.ruleId):null;
  if(R&&MOWING.ruleOcc&&MOWING.ruleOcc[R]){ const fl=MOWING.ruleOcc[R].filter(o=>!o.done&&o.date>MOWING.today).map(o=>o.date).sort(); if(fl.length)nextDue=fl[0]; }
  if(!nextDue&&R&&PROJ&&PROJ.byDate){ const ds=Object.keys(PROJ.byDate).filter(dt=>dt>MOWING.today&&(PROJ.byDate[dt]||[]).some(o=>String(o.ruleId)===R)).sort(); if(ds.length)nextDue=ds[0]; }
  return {serviced, nextDue, uncertain:(!!R && !serviced && !nextDue), oneOff:!R};
}
function uncertainOn(d){ return clearedOn(d).filter(j=>doneInfo(j).uncertain); }
async function loadOcc(){ if(DEMO)return; try{ const r=await Store.get(OCCRES_KEY); if(r&&r.plan&&r.plan._occres)OCCRES=r.plan._occres; OCCRES_VER=(r&&r.version)||0; }catch(e){} }
async function saveOcc(){ try{ let r=await Store.put(OCCRES_KEY,{_occres:OCCRES},OCCRES_VER); if(r&&r.ok===false&&r.error==='conflict'){await loadOcc();r=await Store.put(OCCRES_KEY,{_occres:OCCRES},OCCRES_VER);} if(r&&r.version)OCCRES_VER=r.version; }catch(e){} }
function resolveOcc(key,status){ if(status)OCCRES[key]=status; else delete OCCRES[key]; REQ_CACHE={}; buildDay(curDay); render(); saveOcc(); }

/* ============ BIG BERTHA (tip truck) ============
   Big Bertha is an extra vehicle for large green-waste clean-ups (collect + tip run). It is an OPTIONAL
   option — never auto-rostered as a third mowing crew. A job can be flagged "tip truck required"; such a
   job must sit on Big Bertha, otherwise the day flags an issue. Flags are shared and keyed by recurrence
   identity so they stick for a recurring customer. No Fleetsu integration. */
const BB='Big Bertha';
let TIPREQ={}; let TIPREQ_VER=0; const TIPREQ_KEY='0001-01-04';
function tipKey(j){ return j.ruleId!=null?('T R'+j.ruleId):('T '+(j.id!=null?('#'+j.id):j.address)); }
function needsBigBertha(j){ return !!TIPREQ[tipKey(j)]; }
function tipReqJobs(d){ return activeJobs(d).filter(needsBigBertha); }
function vehCrew(v){ return ((scenario&&scenario.helpers&&scenario.helpers[v])||[]).length; }
function vehJobs(d,v){ return activeJobs(d).filter(j=>vehOfJob(scenario,j)===v).length; }
// Big Bertha only appears when it's relevant: a tip-required job exists, or it already has crew/jobs.
function bbRelevant(d){ return tipReqJobs(d).length>0 || vehCrew(BB)>0 || vehJobs(d,BB)>0; }
let EXTRAVEH={}; // curDay -> [optional vehicles Blake manually added this session]
const EMPTY_TRAY=['ALPHA','DELTA']; // empty-tray utes, shared across myMowing/myBins
function isOptVeh(v){ return v===BB || EMPTY_TRAY.indexOf(v)>=0; }
// The FULL vehicle universe for the UI: the base mowing trucks (HOPPER/MOE from config) PLUS the
// optional vehicles — Big Bertha (tip truck) and the ALPHA/DELTA empty-tray utes (shared with myBins).
// Auto-rostering / rebalancing / Find still use VEH() (base trucks only) so an empty-tray ute or the
// tip truck is never auto-rostered as a mowing crew; the UI (crew, cards, Add Vehicle) uses ALLVEH().
const OPT_VEH=[BB].concat(EMPTY_TRAY);
function ALLVEH(){ const out=VEH().slice(); OPT_VEH.forEach(v=>{ if(out.indexOf(v)<0)out.push(v); }); return out; }
// --- Big Bertha driver eligibility ---------------------------------------------------------------
// Only authorised drivers may DRIVE the tip truck. Others can be on the Bertha crew as helpers, but a
// non-authorised person can never be selected as the driver. Eligibility is configurable per person
// (staff record .bbDriver); until set, the default authorised drivers are Blake and Wes.
const DEFAULT_BB_DRIVERS=['Blake','Wes'];
function canDriveBB(emp){ const s=staffRec(emp); if(s&&typeof s.bbDriver==='boolean') return s.bbDriver; return DEFAULT_BB_DRIVERS.indexOf(emp)>=0; }
// Crew currently on Big Bertha in a scenario, and which of them are authorised to drive it.
function bbCrew(sc){ return ((sc&&sc.helpers&&sc.helpers[BB])||[]).map(h=>h.emp); }
function bbAuthCrew(sc){ return bbCrew(sc).filter(canDriveBB); }
// The selected driver, only valid if still on the crew AND authorised; else none.
function bbDriverOf(sc){ const d=sc&&sc.bbDriver; return (d && bbAuthCrew(sc).indexOf(d)>=0)?d:null; }
function vehInUse(d,v){ return vehCrew(v)>0 || vehJobs(d,v)>0 || (v===BB && tipReqJobs(d).length>0); }
// crew/assign controls: base trucks always, plus optional vehicles in use or manually added.
function activeVEH(d){ const added=EXTRAVEH[d]||[]; return ALLVEH().filter(v=> !isOptVeh(v) || vehInUse(d,v) || added.indexOf(v)>=0 ); }
// vehicle CARDS: only vehicles with crew or jobs (empty cards hidden) — applies to every vehicle.
function cardVEH(d){ return ALLVEH().filter(v=> vehInUse(d,v) ); }
// Vehicles ACTIVE in a GIVEN scenario: the base trucks always, plus any optional vehicle (ALPHA/DELTA/
// Big Bertha) that Blake has actually put crew or jobs on in THIS plan. Never pulls in an unused vehicle.
// Used by Suggest-a-better-plan so it optimises around exactly the vehicles in play, no more, no fewer.
function activeVEHsc(d,sc){ return ALLVEH().filter(v=> !isOptVeh(v) || ((sc&&sc.helpers&&sc.helpers[v])||[]).length>0 || jobsForVeh(d,v,sc).length>0 ); }
// Add Vehicle offers any available vehicle not already active (i.e. the optional utes/tip truck not yet in use).
function addVehList(d){ return ALLVEH().filter(v=> activeVEH(d).indexOf(v)<0 ); }
function addVehicle(v){ EXTRAVEH[curDay]=EXTRAVEH[curDay]||[]; if(EXTRAVEH[curDay].indexOf(v)<0)EXTRAVEH[curDay].push(v); render(); }
function vehClass(v){ return v==='HOPPER'?'H':v==='MOE'?'M':'B'; }
async function loadTip(){ if(DEMO)return; try{ const r=await Store.get(TIPREQ_KEY); if(r&&r.plan&&r.plan._tipreq)TIPREQ=r.plan._tipreq; TIPREQ_VER=(r&&r.version)||0; }catch(e){} }
async function saveTip(){ try{ let r=await Store.put(TIPREQ_KEY,{_tipreq:TIPREQ},TIPREQ_VER); if(r&&r.ok===false&&r.error==='conflict'){await loadTip();r=await Store.put(TIPREQ_KEY,{_tipreq:TIPREQ},TIPREQ_VER);} if(r&&r.version)TIPREQ_VER=r.version; }catch(e){} }

/* ============ JOB vs NOTE/REMINDER CLASSIFICATION ============
   Some Zenkit cards are operational notes/reminders ("BLAKE — sort out X next Wed"), not jobs.
   They must NOT count toward job totals, hours, routing, staffing or Find Capacity — but must stay
   visible. We classify from RELIABLE Zenkit-derived signals (recurrence rule, a work-time estimate,
   a recognised service skill, a real street address) — never from the note wording alone — and let
   Blake override any call. Overrides are keyed by recurrence rule so they stick for every future
   occurrence, and are shared (saved to the same store as plans). Nothing is written back to Zenkit. */
let CLASSIFY={}; let CLASSIFY_VER=0; const RECLASS_KEY='0001-01-01'; // reserved shared row holding overrides
const STREETY=/\b(st|street|rd|road|ave|avenue|ln|lane|dr|drive|pl|place|ct|court|cres|crescent|pde|parade|way|cl|close|tce|terrace|bvd|blvd|boulevard|hwy|highway|cct|circuit|gr|grove|esplanade|esp|promenade|wharf|cove|bay|point|pt|heights|hts|rise|glen|walk|row|mews|quay|ave|avenue)\b/i;
function looksLikeAddress(a){a=a||'';return /\d/.test(a)&&(STREETY.test(a)||a.includes(','));}
// 'job' | 'reminder' | 'uncertain'. A job shows at least one hallmark of real work.
function autoKind(j){
  if(j._proposed)return 'job';                                  // Find-Capacity proposals are always jobs
  const hasRule=j.ruleId!=null, hasEst=j.est!=null, knownSkill=!!(j.skill&&j.skill!=='Unknown');
  if(hasRule||hasEst||knownSkill)return 'job';
  if(!looksLikeAddress(j.address))return 'reminder';            // e.g. "BLAKE" — no address, no work signals
  return 'uncertain';                                           // has an address but no work signals → ask Blake
}
function classKey(j){ if(j.ruleId!=null)return 'R'+j.ruleId; if(j.id!=null)return '#'+j.id; return 'A|'+(j.address||''); }
function kindOf(j){ const o=CLASSIFY[classKey(j)]; if(o==='job'||o==='reminder')return o; return autoKind(j); }
function isJob(j){ return kindOf(j)==='job'; }
function remindersOn(d){ return jobsOn(d).filter(j=>!isJob(j)); } // reminders + uncertain (both excluded from job math)
function reclassify(key,kind){ if(kind)CLASSIFY[key]=kind; else delete CLASSIFY[key]; REQ_CACHE={}; buildDay(curDay); render(); saveClass(); }
async function loadClass(){ if(DEMO)return; try{ const r=await Store.get(RECLASS_KEY); if(r&&r.plan&&r.plan._classifications)CLASSIFY=r.plan._classifications; CLASSIFY_VER=(r&&r.version)||0; }catch(e){} }
async function saveClass(){ try{ let r=await Store.put(RECLASS_KEY,{_classifications:CLASSIFY},CLASSIFY_VER); if(r&&r.ok===false&&r.error==='conflict'){ await loadClass(); r=await Store.put(RECLASS_KEY,{_classifications:CLASSIFY},CLASSIFY_VER); } if(r&&r.version)CLASSIFY_VER=r.version; }catch(e){} }

/* ============ IN-APP STAFF (Deputy-free workforce model) ============
   The planner owns the workforce. We keep our own staff list — skills, driving ability and normal
   hours — in the shared database, editable in the app. NOTHING is fetched from Deputy, and no Deputy
   data is required for any staffing calculation. Blake builds each day's roster from this list. */
let STAFF=[]; let STAFF_VER=0; const STAFF_KEY='0001-01-02';
const DEFAULT_STAFF=[
  {name:'Blake',specialist:true,driver:true,active:true,start:'07:00',end:'15:30'},
  {name:'Julen',specialist:true,driver:true,active:true,start:'07:00',end:'15:30'},

  {name:'Hugh',specialist:false,driver:true,active:true,start:'07:00',end:'15:30'}
];
function seedStaff(){
  const out=DEFAULT_STAFF.map(s=>Object.assign({},s));
  // fold in any extra names the feed happens to know about (attributes only — never a Deputy roster)
  const known=(MOWING&&MOWING.staff)||{};
  Object.keys(known).forEach(n=>{ if(!out.some(s=>s.name===n)) out.push({name:n,specialist:!!known[n].specialist,driver:known[n].driver!==false,active:true,start:'07:00',end:'15:30'}); });
  return out;
}

   Everyone added to myMowing must come from our real Deputy directory, by unique Deputy ID. This

let DEPUTY_SRC='snapshot'; // 'live' once the auto-refreshed Deputy directory loads; else this built-in list
// The PUBLISHED app shell is public, so it embeds only the core myMowing team (first names already in the
// live planner). The COMPLETE directory — including shared myBins staff by full name — loads only through
// the authenticated /api/employees endpoint, so no extra personnel are exposed on the public page.

  {id:504,name:'Julen',aliases:[],active:true},
  {id:443,name:'Wes',aliases:['Wesley Mullette','Wesley'],active:true},
  {id:498,name:'Ben',aliases:['Ben Copley'],active:true},
  {id:466,name:'Ryan',aliases:['Ryan Hobbs'],active:true},

// Pull the auto-refreshed Deputy directory (published read-only by the directory job). On success we

let DEPUTY_UPDATED=null;         // ISO time the loaded directory was generated (shown in Manage staff)
const DEPUTY_CACHE_KEY='deputyDir2';
function _applyDeputy(list){ DEPUTY_STAFF=list.filter(e=>e&&e.id!=null&&e.name).map(e=>({id:e.id,name:e.name,aliases:e.aliases||[],active:e.active!==false})); }

function deputyById(id){ return DEPUTY_STAFF.find(e=>e.id===id)||null; }
function deputyFind(nm){ nm=(nm||'').toLowerCase().trim(); return DEPUTY_STAFF.find(e=> e.name.toLowerCase()===nm || (e.aliases||[]).some(a=>a.toLowerCase()===nm) )||null; }
// Attach Deputy IDs to any saved staff that don't have one yet — reconcile, never delete.
function reconcileStaffIds(){ (STAFF||[]).forEach(s=>{ if(s.id==null){ const d=deputyFind(s.name); if(d){ s.id=d.id; } } }); }
function staffRec(name){ return STAFF.find(s=>s.name===name)||null; }
function staffNames(){ return STAFF.filter(s=>s.active!==false).map(s=>s.name); }
function isSpec(e){ const s=staffRec(e); return s?!!s.specialist:!!(MOWING.staff&&MOWING.staff[e]&&MOWING.staff[e].specialist); }
function isDriver(e){ const s=staffRec(e); return s?s.driver!==false:!(MOWING.staff&&MOWING.staff[e]&&MOWING.staff[e].driver===false); }

/* ============ REQUIRED STAFFING FROM WORKLOAD ============
   Before anyone is rostered, recommend how many employees, how many trucks and how many specialists
   a day needs, and roughly how long it should take — using the SAME engine (real routing, durations,
   appointments, skills), not hours ÷ staff-hours. We try increasing crew sizes and pick the smallest
   that finishes the day within the standard window with every appointment met and specialists covered. */
let REQ_CACHE={};
function regionVeh(area){ return /warringah|pittwater/i.test(area||'')?'MOE':'HOPPER'; } // static 2-truck split (no Deputy areas)
function needsSpec(j){ return /Specialist|Mixed/.test(j.skill||''); }
function mowJobs(d){ return activeJobs(d).filter(j=>!needsBigBertha(j)); }   // tip-truck jobs are planned on Big Bertha, not the mowing crew
function buildTrial(d,hNames,mNames){
  const sc={alloc:{},helpers:{HOPPER:[],MOE:[]},order:{}};
  const two=mNames.length>0;
  mowJobs(d).forEach(j=>{ sc.alloc[allocKey(j)]= two?regionVeh(j.area):'HOPPER'; });
  const put=(v,names)=>names.forEach(n=>{ const s=staffRec(n); sc.helpers[v].push({emp:n,start:(s&&s.start)||'07:00',end:(s&&s.end)||'15:30',part:false}); });
  put('HOPPER',hNames); put('MOE',mNames);
  return sc;
}
// choose crew of sizes h (HOPPER) and m (MOE) from the pool, putting specialists on trucks that need one.
function pickCrew(d,h,m){
  const two=m>0;
  const jobs=mowJobs(d);
  const specH=jobs.some(j=>needsSpec(j)&&(!two||regionVeh(j.area)==='HOPPER'));
  const specM=two&&jobs.some(j=>needsSpec(j)&&regionVeh(j.area)==='MOE');
  const specs=staffNames().filter(isSpec), gens=staffNames().filter(n=>!isSpec(n));
  const used=new Set(); const take=(arr)=>{ for(const n of arr){ if(!used.has(n)){used.add(n);return n;} } return null; };
  const hN=[],mN=[];
  if(specH){ const s=take(specs); if(!s)return null; hN.push(s); }
  if(specM){ const s=take(specs); if(!s)return null; mN.push(s); }
  const rest=staffNames().filter(n=>!used.has(n)); let ri=0;
  while(hN.length<h){ if(ri>=rest.length)return null; hN.push(rest[ri++]); }
  while(mN.length<m){ if(ri>=rest.length)return null; mN.push(rest[ri++]); }
  return {hN,mN,specCount:(specH?1:0)+(specM?1:0)};
}
function trialResult(d,hN,mN){
  const sc=buildTrial(d,hN,mN);
  const day=assessDay(d,sc);
  if(day.unalloc.filter(j=>!needsBigBertha(j)).length) return {ok:false};   // tip jobs are Big Bertha's, not mowing's
  let ok=true,maxFin=0;
  day.vehs.forEach(a=>{ if(a.v===BB)return; if(!a.order.length)return; if(a.status==='r')ok=false; if(a.finishMin!=null&&a.finishMin>maxFin)maxFin=a.finishMin; });
  return {ok,maxFin};
}
// Minimum Big Bertha crew to clear the day's tip-truck jobs within the working window.
function bbRequirement(d){
  const tips=tipReqJobs(d); if(!tips.length)return null;
  const seats=SEATS(BB)||3, pool=staffNames();
  let last=null;
  for(let k=1;k<=Math.min(seats,pool.length||1);k++){
    const sc={alloc:{},helpers:{}}; ALLVEH().forEach(v=>sc.helpers[v]=[]);
    tips.forEach(j=>{ sc.alloc[allocKey(j)]=BB; });
    pool.slice(0,k).forEach(n=>{ const s=staffRec(n); sc.helpers[BB].push({emp:n,start:(s&&s.start)||'07:00',end:(s&&s.end)||'15:30',part:false}); });
    const r=assessVeh(d,BB,sc);
    last={staff:k,estHours:Math.max(0,((r.finishMin||CFGSTART())-CFGSTART())/60),feasible:r.status!=='r'};
    if(r.status!=='r')return last;
  }
  return last||{staff:1,estHours:0,feasible:false};
}
function requiredStaffing(d){
  if(REQ_CACHE[d])return REQ_CACHE[d];
  buildDay(d);
  const jobs=mowJobs(d), n=jobs.length;   // mowing workload (excludes tip-truck jobs)
  let out;
  if(!n){ out={jobs:0,employees:0,trucks:0,specialists:0,estHours:0,feasible:true}; }
  else{
    const seats=SEATS('HOPPER')||3; const pool=staffNames().length;
    let best=null, fallback=null;
    for(let trucks=1;trucks<=2;trucks++){
      for(let h=1;h<=seats;h++){
        const mLo=trucks===2?1:0, mHi=trucks===2?seats:0;
        for(let m=mLo;m<=mHi;m++){
          const total=h+m; if(total>pool)continue;
          const crew=pickCrew(d,h,m); if(!crew)continue;
          const r=trialResult(d,crew.hN,crew.mN);
          const cand={employees:total,trucks,specialists:crew.specCount,estHours:(r.maxFin-CFGSTART())/60,maxFin:r.maxFin};
          if(r.ok){ if(!best||cand.employees<best.employees||(cand.employees===best.employees&&cand.trucks<best.trucks)) best=cand; }
          else if(r.maxFin){ if(!fallback||cand.employees>fallback.employees) fallback=cand; } // biggest crew we tried
        }
      }
    }
    if(best){ out={jobs:n,employees:best.employees,trucks:best.trucks,specialists:best.specialists,estHours:Math.max(0,best.estHours),feasible:true}; }
    else { const f=fallback||{employees:pool,trucks:2,specialists:1,estHours:0}; out={jobs:n,employees:f.employees,trucks:f.trucks,specialists:f.specialists,estHours:Math.max(0,f.estHours||0),feasible:false}; }

// Weekly Overview hours: from a SAVED scenario, the hours each employee and each vehicle is needed.
// Employee hours = the UNION of their intervals across vehicles (never double-counted); vehicle hours
// = the span its crew is on it. If only a duration is known with no confirmed window, show "Times TBC".
function _merge(iv){ iv=iv.slice().sort((a,b)=>a.s-b.s); const out=[]; iv.forEach(x=>{ const l=out[out.length-1]; if(l&&x.s<=l.e)l.e=Math.max(l.e,x.e); else out.push({s:x.s,e:x.e}); }); return out; }
function _hrs(mins){ return Math.round(mins/6)/10; }
function weekHoursHTML(d,sc){
  const byEmp={}, byVeh={};
  ALLVEH().forEach(v=>{ ((sc.helpers&&sc.helpers[v])||[]).forEach(h=>{ if(!h.emp)return; const s=parseHM(h.start), e=parseHM(h.end);
    (byEmp[h.emp]=byEmp[h.emp]||[]).push({s,e}); (byVeh[v]=byVeh[v]||[]).push({s,e}); }); });
  const emps=Object.keys(byEmp); if(!emps.length) return '';
  const empTxt=emps.map(n=>{ const iv=byEmp[n], okT=iv.every(x=>x.s!=null&&x.e!=null&&x.e>x.s);
    if(!okT) return '<b>'+esc(n)+'</b> <span class=muted>Times&nbsp;TBC</span>';
    const m=_merge(iv), mins=m.reduce((a,x)=>a+(x.e-x.s),0), s=m[0].s, e=m[m.length-1].e;
    return '<b>'+esc(n)+'</b> '+_hrs(mins)+'h <span class=muted>('+fmtClock(s)+'–'+fmtClock(e)+')</span>'; }).join(', ');
  const vehTxt=Object.keys(byVeh).map(v=>{ const iv=byVeh[v], okT=iv.every(x=>x.s!=null&&x.e!=null&&x.e>x.s), nm=(v===BB?'Big Bertha':v);
    if(!okT) return '<b>'+esc(nm)+'</b> <span class=muted>Times&nbsp;TBC</span>';
    const s=Math.min.apply(null,iv.map(x=>x.s)), e=Math.max.apply(null,iv.map(x=>x.e));
    return '<b>'+esc(nm)+'</b> '+_hrs(e-s)+'h <span class=muted>('+fmtClock(s)+'–'+fmtClock(e)+')</span>'; }).join(', ');
  return '<div style="font-size:12px;color:#3a4a40;margin-top:5px;line-height:1.55;border-top:1px dashed #e3eae5;padding-top:5px">'+
    '<div>👷 '+empTxt+'</div>'+(vehTxt?'<div>🚚 '+vehTxt+'</div>':'')+'</div>';
}
function weekCard(d,rec){
  buildDay(d);
  const hasPlan=!!(rec&&rec.plan);
  const sc=hasPlan?migrate(rec.plan):defaultScenario(d);
  const active=activeJobs(d), jobs=active.length;
  const t=new Date(d+'T12:00:00'); const dname=DOW[t.getDay()].slice(0,3), ddate=t.getDate()+' '+t.toLocaleDateString('en-AU',{month:'short'});
  if(!jobs){ return '<div class="weekcard n"><div class=dcol><div class=dname>'+dname+'</div><div class=ddate>'+ddate+'</div></div><div class=jcol><div class=jnum>0</div><div class=jlbl>jobs</div></div><div class=scol><div class="wready n">No jobs</div></div></div>'; }
  // What the workload needs (before anyone is rostered)
  const req=requiredStaffing(d);
  const assigned=assignedCount(sc);
  const saved=!!(rec&&rec.plan);
  // Over the 10h/person allowance — from the saved plan if there is one, else the workload estimate.
  const overAllow = (assigned>0) ? assessDay(d,sc).overAllowance : !!req.overAllowance;
  const reqTxt='needs ~'+req.employees+' staff · '+req.trucks+' truck'+(req.trucks>1?'s':'')+(req.specialists?' · '+req.specialists+' spec':'')+(overAllow?' · review workload':'');
  let cls,label;
  if(assigned===0){
    // Nobody rostered yet — show the requirement, never "ready"
    cls='a'; label='Needs staffing (~'+req.employees+')';
  } else {
    const day=assessDay(d,sc); const unalloc=day.unalloc.length;
    if(unalloc>0){cls='o';label=unalloc+' job'+(unalloc>1?'s':'')+' to allocate';}
    else if(assigned<req.employees){cls='a';label='Understaffed ('+assigned+'/'+req.employees+')';}
    else if(day.status==='r'){cls='r';label='Needs attention';}
    else if(day.status==='a'){cls='a';label='Check this day';}
    else {cls='g';label='Ready';}
  }
  // Never show a day as Ready/green while important travel info is missing (unlocated stops).
  const miss=dayMissingLoc(d);
  if(miss && cls==='g'){ cls='a'; label='Check — '+miss+' stop'+(miss>1?'s':'')+' not located'; }

  let tags='';
  if(saved&&assigned>0)tags+='<span class="wtag prov">saved</span>';
  if(overAllow)tags+='<span class="wtag busy">review workload</span>';
  if(miss)tags+='<span class="wtag busy">travel incomplete</span>';
  if(unc)tags+='<span class="wtag busy">provisional</span>';
  const estH=req.estHours?' · ~'+r1(req.estHours)+'h/truck':'';
  const sub=reqTxt+estH+(assigned?' · '+assigned+' assigned':'')+(cleared?' · '+cleared+' done':'');
  return '<div class="weekcard '+cls+'" data-day="'+d+'"><div class=dcol><div class=dname>'+dname+'</div><div class=ddate>'+ddate+'</div></div>'+
    '<div class=jcol><div class=jnum>'+jobs+'</div><div class=jlbl>jobs</div></div>'+
    '<div class=scol><div class="wready '+cls+'">'+label+'</div><div class=wsub>'+sub+'</div>'+(tags?'<div style="margin-top:2px">'+tags+'</div>':'')+((saved&&assigned>0)?weekHoursHTML(d,sc):'')+'</div>'+
    '<div class=arrow>›</div></div>';
}

function suggestPlan(){
  if(unallocated(curDay,scenario).length){ toast('Allocate the remaining jobs first, then I can tidy the plan.'); return; }
  const before=assessDay(curDay,scenario);
  const sc2=JSON.parse(JSON.stringify(scenario));
  // Optimise the stop order of EVERY vehicle active in this plan (HOPPER/MOE and any ALPHA/DELTA/Big
  // Bertha Blake has allocated), not just the base trucks.
  activeVEHsc(curDay,sc2).forEach(v=>{ const o=optimiseOrder(curDay,v,sc2); sc2.order=sc2.order||{}; sc2.order[v]=o.order.map(jobKey); });
  const reb=rebalanceSuggestion(curDay,sc2);
  if(reb){ sc2.alloc[allocKey(reb.job)]=reb.to; activeVEHsc(curDay,sc2).forEach(v=>{ const o=optimiseOrder(curDay,v,sc2); sc2.order[v]=o.order.map(jobKey); }); }
  if(planSig(sc2)===planSig(scenario)){ toast('Your plan is already the best I can find.'); return; }
  const after=assessDay(curDay,sc2);
  const bFin=Math.max.apply(null,before.vehs.filter(a=>a.finishMin!=null).map(a=>a.finishMin).concat([0]));
  const aFin=Math.max.apply(null,after.vehs.filter(a=>a.finishMin!=null).map(a=>a.finishMin).concat([0]));
  let msg='I found a tidier plan:\n\n';
  if(reb){ const why = reb.easedOver ? 'keeps everyone within the 10h allowance' : reb.savedDrive>0 ? 'saves ~'+fmtDur(reb.savedDrive)+' driving' : 'better balances the two trucks'; msg+='• Move '+reb.job.address+' from '+reb.from+' to '+reb.to+' ('+why+')\n'; }
  msg+='• Re-order stops for less driving\n\nLatest finish: '+(bFin?fmtClock(bFin):'—')+' → '+(aFin?fmtClock(aFin):'—')+'\n\nApply this suggestion?';
  confirmDlg('✨ Suggested plan',msg,'Apply',()=>{scenario=sc2;render();toast('Applied — Save to keep it');},'Keep mine',()=>{});
}
function copyWA(){

function evaluateInsert(date,veh,sc,newJob){

  const crew=crewIntervals(date,veh,sc); if(!crew.length)return {noCrew:true,date,veh};
  const needSpec=newJob.skill==='Specialist'||newJob.skill==='Mixed';

  const saved=DATA.jobs; DATA.jobs=DATA.jobs.concat([newJob]); rebuildMatrix(date);
  const sc2=JSON.parse(JSON.stringify(sc)); sc2.alloc=sc2.alloc||{}; sc2.alloc[allocKey(newJob)]=veh; if(sc2.order&&sc2.order[veh])delete sc2.order[veh];
  const after=assessVeh(date,veh,sc2);

  const newImposs=after.flags.impossible.length>base.flags.impossible.length;

  const over=!!after.overAllow;   // would adding the job push someone over the 10h/person allowance?
  const fit=!newAppt&&!newImposs&&!specShort&&!over;

function findCmp(a,b){ if(a.fit!==b.fit)return a.fit?-1:1; if(a.skillOk!==b.skillOk)return a.skillOk?-1:1; const pa=a.prox==null?1e9:a.prox,pb=b.prox==null?1e9:b.prox; if(pa!==pb)return pa-pb; if(a.addedDrive!==b.addedDrive)return a.addedDrive-b.addedDrive; return (b.remaining||0)-(a.remaining||0); }

  res.innerHTML=msgCard('Checking the next 12 weeks…');
  const today=todayISO(); const allDates=[]; for(let i=1;i<=84;i++){const d=addDays(today,i);const dow=new Date(d+'T12:00:00').getDay();if(dow>=1&&dow<=5)allDates.push(d);}
  const recs=await Promise.all(allDates.map(d=>Store.get(d).catch(()=>({plan:null}))));

  const dayInfo=d=>{ buildDay(d); const r=savedBy[d]; const hasPlan=!!(r&&r.plan); const rostered=rosterOn(d).length>0;

function renderFindResults(top,info){
  const res=$('findResults');
  if(!top.length){ res.innerHTML=msgCard('No day in the next 12 weeks has crew rostered for this. Try once staff are rostered, or widen the preferred days.'); return; }
  const fitN=top.filter(o=>o.fit).length;
  let h='<div class=small muted style="margin:10px 2px">'+(fitN?fitN+' good option'+(fitN>1?'s':'')+' found':'No clean fit — the closest options are shown with warnings')+'. Driving is estimated.</div>';
  top.forEach((o,i)=>{
    const t=new Date(o.date+'T12:00:00'); const dlabel=DOW[t.getDay()]+' '+t.getDate()+' '+t.toLocaleDateString('en-AU',{month:'short'});
    const cls=o.fit?'':(o.specShort?'bad':'warn');
    let warns='';
    if(o.specShort)warns+='<div>⛔ No specialist on '+o.veh+' that day</div>';
    if(o.newOver)warns+='<div>⏱ Takes '+o.veh+' over the '+MAXH()+'h allowance (~'+r1(o.afterHours)+'h) — review</div>';
    if(o.newAppt)warns+='<div>⛔ Clashes with a timed job</div>';
    let fut='';
    if(info.freq>0&&o.future){ if(o.future.total===0)fut='<div class="fut ok">First visit fits; future dates are beyond the 12-week window.</div>';
      else if(o.future.fit===o.future.total)fut='<div class="fut ok">✅ Keeps fitting on all '+o.future.total+' future visits in the next 12 weeks.</div>';
      else fut='<div class="fut bad">⚠ Fits now, but '+(o.future.total-o.future.fit)+' of '+o.future.total+' future visits look tight — review those weeks.</div>';
      if(o.future.prov)fut+='<div class="small" style="color:#8a6d1a">Future weeks assume a normal crew until you staff them.</div>'; }
    const basis = o.provRoster
      ? '<div class="small" style="color:#8a6d1a;margin-top:3px">⚑ Estimate — this day isn’t staffed yet; assumes a normal crew.</div>'
      : (!o.planned ? '<div class="small muted" style="margin-top:3px">Estimate — this day isn’t planned yet; based on your usual allocation.</div>'
                    : '<div class="small" style="color:#1a7a43;margin-top:3px">✓ Based on the saved plan for this day.</div>');
    const proxTxt=o.prox==null?'first job of the day':(o.prox<1.2?'right by an existing stop ('+r1(o.prox)+' km)':r1(o.prox)+' km from the nearest stop');
    h+='<div class="opt '+cls+'"><div class=oh><div class=od>'+(o.fit?'✅ ':cls==='bad'?'⛔ ':'⚠️ ')+dlabel+'</div><div class="ov '+(o.veh==='MOE'?'M':'')+'">'+o.veh+'</div></div>'+
      '<div class=meta><b>+'+(o.addedDrive||0)+' min</b> driving · finishes <b>'+(o.finish!=null?fmtClock(o.finish):'?')+'</b> · '+(o.remaining>0?fmtDur(o.remaining)+' spare':'no spare')+' · '+proxTxt+'</div>'+basis+
      (warns?'<div class=warns>'+warns+'</div>':'')+fut+
      (o.fit||cls==='warn'?'<button class="btn sm" style="flex:none;padding:9px 14px" data-addopt="'+i+'">Add to '+o.date+' plan</button>':'')+'</div>';
  });
  res.innerHTML=h;
  window.__findTop=top;
}
function addProposedFromFind(i){
  const o=window.__findTop[i]; if(!o)return;
  const job=Object.assign({},mkFindJob(),{id:'NEW'+Date.now(),date:o.date});
  PROPOSED[o.date]=(PROPOSED[o.date]||[]).concat([job]);
  pendingAlloc={date:o.date,key:allocKey(job),veh:o.veh};
  toast('Added as a proposed job — review and Save'); showDay(o.date);
}
function showFind(){ VIEW='find'; $('weekView').hidden=true; $('dayView').hidden=true; $('findView').hidden=false; $('findResults').innerHTML=''; }

/* =================== boot =================== */
function showGate(){ $('demobar').innerHTML=''; $('main').innerHTML='<div class=errbox style="background:#eef3f8;border-color:#cfe0f3;color:#2a4a7a"><h2>🔒 Sign in required</h2><p>Open the planner through your secure myMowing link and sign in with your email code. Nothing loads on this page until you’re signed in.</p></div>'; }
async function boot(){
  const params=new URLSearchParams(location.search);
  if(params.has('demo')){ DEMO=true; PLANS_API=null; loadDemo(); }
  else { PLANS_API=''; }   // live: same-origin API, served behind Cloudflare Access
  // Require sign-in for the live app — no job data is fetched until authenticated.
  const me=await Store.me();
  if(!me||!me.ok){ showGate(); return; }
  $('who').textContent=me.email||'signed in';
  if(!DEMO){
    try{
      const [mj,pj]=await Promise.all([
        fetch('mowing.json?cb='+Date.now()).then(r=>r.ok?r.json():Promise.reject()).catch(()=>null),
        fetch('projection.json?cb='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
      ]);
      if(mj&&mj.jobs){ MOWING=mj; PROJ=pj||{byDate:{},jobs:[]}; } else { LOADERR=true; LOADERR_MSG=(mj&&mj.error)?(mj.error+(mj.detail?' — '+mj.detail:'')):'the schedule feed returned no jobs'; }
    }catch(e){ LOADERR=true; LOADERR_MSG=String(e&&e.message||e); }
  }
  if(LOADERR){ renderError(); return; }
  await loadClass();   // Blake's saved job/reminder overrides (shared), applied before any count
  await loadDeputy();  // auto-refreshed Deputy directory (read-only); snapshot fallback if unpublished
  await loadStaff();   // our staff list, reconciled to Deputy IDs
  await loadOcc();     // per-occurrence still-due / done resolutions (shared)
  await loadTip();     // which jobs need the tip truck (Big Bertha), shared
  const today=MOWING.today||new Date().toISOString().slice(0,10);
  curDay=today; weekAnchor=weekMonday(today);
  showWeek();   // land on the Weekly Overview
}
