name: One-shot history cleanup (PII removal)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-filter-repo
        run: pip install git-filter-repo
      - name: Remove sensitive files from ALL history
        run: |
          git filter-repo --force --invert-paths \
            --path index.html \
            --path history.json \
            --path vehicles.json \
            --path mowing.json \
            --path projection.json
      - name: Show result
        run: |
          echo "commits after rewrite: $(git rev-list --count HEAD)"
          for f in index.html history.json vehicles.json mowing.json projection.json; do
            echo "$f references remaining: $(git log --all --oneline -- "$f" | wc -l)"
          done
      - name: Force-push rewritten main
        run: |
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
