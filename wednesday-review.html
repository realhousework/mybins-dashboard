<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>myBins — Roster Planner</title><style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#f4f6f4;color:#17201a;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:12px 14px 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:3px solid #2e8b57;padding-bottom:10px}
h1{font-size:20px;margin:0}.logo b{color:#2e8b57}
.who-pill{font-size:12.5px;background:#e7f4ec;color:#0f7a43;border:1px solid #cfe9d9;border-radius:999px;padding:4px 12px;font-weight:700}
.muted{color:#5b6b60}.small{font-size:13px}
.lead{color:#5b6b60;font-size:13.5px;margin:10px 0 2px}
.demobar{background:#8a3ffb;color:#fff;font-weight:800;text-align:center;padding:7px;border-radius:10px;margin:10px 0;font-size:13px;letter-spacing:.01em}
/* date bar */
.datebar{display:flex;align-items:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.datebar .nav{border:1px solid #cfe0d6;background:#fff;border-radius:10px;font-size:20px;font-weight:800;width:46px;height:46px;cursor:pointer;color:#2e8b57}
.datebar .nav:disabled{opacity:.35;cursor:default}
.datebar input[type=date]{border:1px solid #cfe0d6;border-radius:10px;padding:10px;font:inherit}
.datebar .today{font-size:18px;font-weight:800;min-width:150px}
.rotbadge{font-size:11px;font-weight:800;background:#eef3f0;color:#2e8b57;border:1px solid #cfe9d9;border-radius:999px;padding:4px 11px}
.summary{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 2px;font-size:13px;color:#5b6b60}
.summary b{color:#17201a}
/* banners */
.rec{border-radius:12px;padding:11px 14px;font-size:13.5px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.rec .ic{font-size:17px;line-height:1.2}
.rec.ok{background:#e7f4ec;border:1px solid #cfe9d9;color:#1a5a34}
.rec.warn{background:#fff4d6;border:1px solid #f0e2c4;color:#7a5e12}
.rec.bad{background:#fde8e4;border:1px solid #f3c9bf;color:#8a2f1a}
.rec.info{background:#eaf1fb;border:1px solid #cfe0f3;color:#2a4a7a}
.rec b{font-weight:800}
.rec .mini{border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:800;font-size:12.5px;border-radius:8px;padding:6px 11px;cursor:pointer;opacity:.9}
/* cards */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px;margin-top:8px}
.card{background:#fff;border:1px solid #e3eae5;border-radius:14px;padding:13px 15px}
.card.flagged{border:2px solid #e8912e;background:#fffaf2}
.card.conflict{border:2px solid #e0a9a0;background:#fff7f5}
.chead{display:flex;align-items:center;gap:9px}
.ava{width:34px;height:34px;border-radius:50%;background:#2e8b57;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.who{font-weight:800;font-size:15px;border:1px solid transparent;background:transparent;color:#17201a;cursor:pointer;flex:1;min-width:70px;padding:5px 6px;border-radius:9px;appearance:none;-webkit-appearance:none}
.who:hover{background:#f1f5f2;border-color:#e3eae5}
.vehsel{font-size:11.5px;font-weight:800;color:#2e8b57;background:#eef3f0;border:1px solid #cfe9d9;border-radius:999px;padding:6px 11px;cursor:pointer;appearance:none;-webkit-appearance:none}
.rx{border:0;background:transparent;color:#b4452b;cursor:pointer;font-size:14px;font-weight:700;padding:3px 6px;border-radius:7px;flex:none}
.rx:hover{background:#fde8e4}
.assist{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:7px 0 2px;padding-left:44px}
.assist .lbl{font-size:11px;font-weight:800;color:#8a988f;text-transform:uppercase;letter-spacing:.03em}
.achip{font-size:12px;font-weight:700;background:#f1f5f2;border:1px solid #e3eae5;border-radius:999px;padding:3px 5px 3px 10px;display:inline-flex;gap:5px;align-items:center}
.achip button{border:0;background:transparent;color:#8a988f;cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.achip button:hover{color:#b4452b}
.addassist{border:1px dashed #cfe0d6;background:#fff;color:#2e8b57;border-radius:999px;font:inherit;font-size:12px;font-weight:800;padding:4px 11px;cursor:pointer}
.runs{margin-top:8px}
.job{border-top:1px solid #eef2ef;padding:9px 0;display:flex;gap:9px;align-items:center}
.job:first-of-type{border-top:0}
.rt{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;flex:none}
.rt-IN{background:#e3eefb;color:#2f5fb3}.rt-OUT{background:#e7f4ec;color:#1a7a43}.rt-CLEAN{background:#efe3fb;color:#6b2fb3}.rt-VEG{background:#eef7dd;color:#5a7a1a}
.rn{flex:1;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shr{font-size:10px;font-weight:800;background:#fde8e4;color:#b4452b;border-radius:999px;padding:1px 6px;margin-left:4px}
.rb{font-size:11.5px;color:#8a988f;font-variant-numeric:tabular-nums;font-weight:700}
.rmv{border:1px solid #e3eae5;background:#fff;color:#5b6b60;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;padding:5px 9px;line-height:1.2;white-space:nowrap}
.rmv:hover{border-color:#2e8b57;color:#2e8b57}
.flagline{font-size:12.5px;color:#8a6d1a;background:#fff4d6;border:1px solid #f0e2c4;border-radius:9px;padding:7px 10px;margin-top:9px}
.cfline{font-size:12.5px;color:#8a2f1a;background:#fde8e4;border:1px solid #f3c9bf;border-radius:9px;padding:7px 10px;margin-top:9px}
.noteline{font-size:12px;color:#5b6b60;background:#f1f5f2;border:1px solid #e3eae5;border-radius:9px;padding:6px 10px;margin-top:8px}
.cfoot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cfoot .n{font-size:12px;color:#8a988f;margin-right:auto;font-weight:700}
.btn{border:1px solid #2e8b57;background:#2e8b57;color:#fff;font:inherit;font-weight:800;font-size:15px;border-radius:12px;padding:12px 18px;cursor:pointer}
.btn.ghost{background:#fff;color:#2e8b57}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.addcard{display:flex;align-items:center;justify-content:center;border:2px dashed #cfe0d6;background:#fff;border-radius:14px;min-height:92px}
/* unassigned */
.unassigned{background:#fffaf2;border:1px solid #f0e2c4;border-radius:14px;padding:13px 15px;margin-top:16px}
.unassigned h3{margin:0 0 6px;font-size:14px;color:#7a5e12;display:flex;align-items:center;gap:8px}
.unassigned h3 .tag{font-weight:700;color:#8a7a4a;font-size:12px}
.unassigned .job{border-top-color:#f0e2c4}
.unassigned .ok{color:#1a7a43;font-size:13px}
/* menu + toast + sticky actions (myMowing) */
.menu{position:fixed;z-index:60;background:#fff;border:1px solid #e3eae5;border-radius:12px;padding:5px;box-shadow:0 14px 38px rgba(0,0,0,.16);min-width:190px;max-height:340px;overflow:auto}
.menu div{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.menu div:hover{background:#e7f4ec;color:#1a5a34}
.menu .hd{color:#8a988f;font-size:11px;cursor:default;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.menu .hd:hover{background:transparent;color:#8a988f}
.actions{position:sticky;bottom:0;background:#f4f6f4ee;backdrop-filter:blur(6px);padding:12px 0 6px;margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid #e3eae5}
.actions .btn{flex:1;min-width:150px}
.saved{align-self:center;font-size:13px;color:#1a7a43;font-weight:800}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#17201a;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;max-width:90%}
.toast.show{opacity:1}
.loading{color:#8a988f;padding:48px 0;text-align:center}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
  <div class="topbar">
    <h1 class="logo">my<b>Bins</b> Roster Planner</h1>
    <div class="who-pill" id="asof">loading…</div>
  </div>
  <div class="lead">Open a day — the roster you'd normally build is already suggested from history. Adjust anything unusual, then save.</div>
  <div id="demobar"></div>

  <div class="datebar">
    <button class="nav" id="prev" title="previous day">‹</button>
    <input type="date" id="date">
    <button class="nav" id="next" title="next day">›</button>
    <span class="today" id="dow"></span>
    <span class="rotbadge" id="rot"></span>
  </div>
  <div class="summary" id="summary"></div>

  <div id="exc"></div>
  <div id="mowing"></div>
  <div id="main"><div class="loading">Loading roster…</div></div>

  <div class="actions">
    <button class="btn ghost" id="reset">Reset to suggested</button>
    <button class="btn" id="save">Save plan</button>
    <span class="saved" id="saved"></span>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
var FEED=null, DATE=null, DOW=null, ROT=null, STATE=null, VERSION=0, SAVING=false, DIRTY=false, CONFLICT=null;
var DEMO=/[?&]demo\b/.test(location.search||'');
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function initials(n){return (n||'?').split(/\s+/).map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();}
function first(n){return (n||'').split(/\s+/)[0];}
/* ---- stable identity matching (point 2) ----
   People are matched by Deputy employee ID (via staffMeta aliases), never by first name, so
   Donald/Jacob and other nickname differences resolve to the same person. Vehicles are matched by
   canonical identity, so "ALPHA (empty)" and "ALPHA" are the same truck. Both fall back gracefully
   if the feed hasn't published the identity layer yet. */
var _idByAlias=null;
function empId(name){
  if(!name) return '';
  if(FEED&&FEED.staffMeta){ if(!_idByAlias){_idByAlias={};FEED.staffMeta.forEach(function(m){_idByAlias[m.name.toLowerCase()]='#'+m.id;(m.aliases||[]).forEach(function(a){_idByAlias[a.toLowerCase()]='#'+m.id;});});}
    var k=String(name).toLowerCase(); if(_idByAlias[k]) return _idByAlias[k]; var f=first(name).toLowerCase(); if(_idByAlias[f]) return _idByAlias[f]; }
  return first(name).toLowerCase(); // fallback
}
function canonVeh(v){ if(!v) return ''; var V=String(v).toUpperCase().trim();
  var map=(FEED&&FEED.vehCanon)||{}; if(map[V]) return map[V];
  return V.replace(/\s*\(.*\)\s*$/,'').trim(); }
function dowName(iso){return new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',timeZone:'UTC'});}
function mondayOf(iso){var d=new Date(iso+'T12:00:00Z');var dow=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-dow);return d.toISOString().slice(0,10);}
function shortDay(iso){return new Date(iso+'T12:00:00Z').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}
function addDays(iso,n){var d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function rotationOf(iso){ // Monday of anchor week = W1, fortnightly
  var anchor=(FEED&&FEED.rotationAnchorMon)||'2026-11-09';
  var mon=mondayOf(iso);
  var weeks=Math.round((new Date(mon+'T12:00:00Z')-new Date(anchor+'T12:00:00Z'))/(7*864e5));
  return (((weeks%2)+2)%2===0)?'W1':'W2';
}

/* ===================== DEMO feed (layout review only) =====================
   The published app shell carries NO real personnel or roster patterns.
   These placeholder names/vehicles exist only so the layout can be reviewed
   offline (?demo). Live, all of this loads from the authenticated feed. */
function demoFeed(){
  var today='2026-11-18';
  function clean(o,off,cat){return {onceoff:off||0,catchup:cat||0,routine:(o||0)};}
  var runs=[
    {id:'r-manly-in-b3',type:'IN',short:'Manly In B3',bins:497},
    {id:'r-manly-in-b4',type:'IN',short:'Manly In B4',bins:501},
    {id:'r-manly-in-b5',type:'IN',short:'Manly In B5',bins:523},
    {id:'r-manly-in-b6',type:'IN',short:'Manly In B6',bins:406},
    {id:'r-manly-in-b7',type:'IN',short:'Manly In B7',bins:416},
    {id:'r-war-in-b1',type:'IN',short:'Warringah In B1',bins:269},
    {id:'r-war-in-b2',type:'IN',short:'Warringah In B2',bins:301},
    {id:'r-war-cl-b1',type:'CLEAN',short:'Warringah Clean B1',bins:198,clean:clean(113,85,0)},
    {id:'r-war-cl-b2',type:'CLEAN',short:'Warringah Clean B2',bins:79,clean:clean(79,0,0)},
    {id:'r-ns-out-z2',type:'OUT',short:'NS Wed Out Zone 2',bins:256},
    {id:'r-ns-in-z2',type:'IN',short:'NS Wed In Zone 2',bins:126},
    {id:'r-ns-cl-z2',type:'CLEAN',short:'NS Wed Clean Zone 2',bins:116,clean:clean(64,52,0)},
    {id:'r-lane-in',type:'IN',short:'Lane Cove In',bins:83},
    {id:'r-lane-out',type:'OUT',short:'Lane Cove Out',bins:43},
    {id:'r-lane-cl',type:'CLEAN',short:'Lane Cove Clean',bins:58,clean:clean(58,0,0)},
    {id:'r-wil-out',type:'OUT',short:'Willoughby Out',bins:140},
    {id:'r-wil-in',type:'IN',short:'Willoughby In',bins:101},
    {id:'r-mos-out',type:'OUT',short:'Mosman Out',bins:92},
    {id:'r-mos-in',type:'IN',short:'Mosman In',bins:62},
    {id:'r-wav-in',type:'IN',short:'Waverley In',bins:55},
    {id:'r-wav-cl',type:'CLEAN',short:'Waverley Clean',bins:16,clean:clean(0,16,0)},
    {id:'r-city-out',type:'OUT',short:'City of Sydney Out',bins:106}
  ];
  // Suggested Wednesday|W2 template — placeholder crew (NOT the real team)
  var tmpl={'Wednesday|W2':{nSamples:14,shifts:[
    {who:'Alex T',veh:'Truck 1',runIds:['r-manly-in-b3','r-manly-in-b4']},
    {who:'Sam R',veh:'Truck 2',runIds:['r-manly-in-b5','r-manly-in-b6']},
    {who:'Jordan K',veh:'Truck 3',runIds:['r-manly-in-b7','r-war-in-b2']},
    {who:'Casey M',veh:'Truck 4',runIds:['r-war-in-b1','r-war-cl-b1']},
    {who:'Riley P',veh:'Truck 5',runIds:['r-ns-out-z2','r-ns-in-z2','r-ns-cl-z2']},
    {who:'Jamie L',veh:'Truck 6',runIds:['r-lane-in','r-lane-out','r-lane-cl']},
    {who:'Morgan S',veh:'Truck 7',runIds:['r-wil-out','r-wil-in']},
    {who:'Taylor B',veh:'Truck 8',runIds:['r-mos-out','r-mos-in']},
    {who:'Quinn D',veh:'Truck 9',runIds:['r-wav-in','r-wav-cl','r-city-out']}
  ],helpers:[]}};
  runs.forEach(function(r){r.runKey=r.id;}); // demo: runKey == id so experience lookups line up
  var byDate={}; byDate[today]=runs;
  // next-week copy so date navigation + next-week planning can be exercised in demo (point 6)
  var nextWed=addDays(today,7); byDate[nextWed]=runs.map(function(r){return Object.assign({},r);});
  var staffNames=['Alex T','Sam R','Jordan K','Casey M','Riley P','Jamie L','Morgan S','Taylor B','Quinn D','Drew H','Lee N','Pat W'];
  var staffMeta=staffNames.map(function(n,i){return {id:900+i,name:n,aliases:[first(n)],active:true};});
  // experience derived from the demo template (who owns each run) — mirrors the real feed shape
  var expByKey={},expByWho={};
  (tmpl['Wednesday|W2'].shifts).forEach(function(s){ (s.runIds||[]).forEach(function(id){
    (expByKey[id]=expByKey[id]||{regulars:[],vehicles:[]}); expByKey[id].regulars.push(s.who); if(s.veh)expByKey[id].vehicles.push(s.veh);
    (expByWho[s.who]=expByWho[s.who]||{keys:[],usualVehicle:s.veh}).keys.push(id); }); });
  var capByDate={}; capByDate[today]={modelledPH:263.6,calibratedPH:133.7,reqStaff:16,normPH:106.2,normCrew:12};
  capByDate[nextWed]=capByDate[today];
  return {generatedAt:'demo layout — placeholder names',today:today,reviewBuild:true,horizonDays:10,
    weekDates:[addDays(today,-2),addDays(today,-1),today,addDays(today,1),addDays(today,2),addDays(today,7),addDays(today,8),addDays(today,9),addDays(today,10),addDays(today,11)],
    rotationAnchorMon:'2026-11-09',
    staff:staffNames, staffMeta:staffMeta,
    vehicles:['Truck 1','Truck 2','Truck 3','Truck 4','Truck 5','Truck 6','Truck 7','Truck 8','Truck 9','Truck 10','ALPHA','DELTA'],
    vehCanon:{'ALPHA':'ALPHA','ALPHA (EMPTY)':'ALPHA','DELTA':'DELTA','DELTA (EMPTY)':'DELTA'},
    experience:{byKey:expByKey,byWho:expByWho},
    capacity:{calFactor:0.507,typShiftH:8.5,byDate:capByDate},
    byDate:byDate, template:tmpl,
    pw:[{date:today,addr:null,who:null,veh:null,staffingConfirmed:false,estRecorded:'3h',allDay:false}]};
}

/* ===================== MOWING commitments (read-only from Blake) ===================== */
var MOWING=null, MOWING_WEEK=null;
function mowDemoSample(mon){
  function d(n){return addDays(mon,n);}
  var days={};
  days[d(2)]={employees:[{name:'Jamie L',start:'7:00am',end:'11:00am',hours:4,part:true,vehicle:'HOPPER',timingConfirmed:true}],
              vehicles:[{name:'HOPPER',start:'7:00am',end:'11:00am',hours:4,part:true,timingConfirmed:true}],unfilled:0,issues:[]};
  return {ok:true,week:mon,found:true,ready:true,readyAt:new Date().toISOString(),days:days,staleDays:[]};
}
async function loadMowing(){
  var mon=mondayOf(DATE);MOWING_WEEK=mon;
  if(DEMO){MOWING=mowDemoSample(mon);return;}
  try{var r=await fetch('/api/mowing-handover?week='+mon,{cache:'no-store'});MOWING=await r.json();}
  catch(e){MOWING={ok:false,error:'unreachable'};}
}
function mowCommitForDate(){if(!MOWING||!MOWING.ok||!MOWING.found||!MOWING.days)return null;return MOWING.days[DATE]||null;}
function mowAvail(x,isVeh){
  if(x.timingConfirmed===false)return{cls:'warn',txt:'reserved — times unconfirmed'};
  if(x.part)return{cls:'warn',txt:'part-day — on mowing '+x.start+'–'+x.end+' (may be free outside these hours'+(isVeh?', allow travel':'')+')'};
  return{cls:'bad',txt:'unavailable (full day)'};
}
function renderMowing(){
  var box=$('#mowing');if(!box)return;
  if(!MOWING||!MOWING.ok){
    var why=(MOWING&&MOWING.error==='mowing-not-bound')?'the mowing planner isn’t connected yet':'the mowing commitments couldn’t be loaded';
    box.innerHTML='<div class="rec info"><span class="ic">🚜</span><div><b>Mowing commitments unavailable</b> — '+why+'. Treat mowing staff and vehicles as <b>not confirmed</b> free.</div></div>';return;
  }
  if(!MOWING.found||!MOWING.ready){
    box.innerHTML='<div class="rec bad"><span class="ic">⚠</span><div><b>Mowing not confirmed this week.</b> The week of '+esc(shortDay(MOWING_WEEK))+' hasn’t been marked “Ready”. Don’t assume staff or vehicles are free for bins.</div></div>';return;
  }
  var stale=(MOWING.staleDays||[]).indexOf(DATE)>=0;
  var html='<div class="rec ok"><span class="ic">🚜</span><div><b>Mowing commitments received</b> · week of '+esc(shortDay(MOWING_WEEK))+'</div></div>';
  if(stale)html+='<div class="rec bad"><span class="ic">⚠</span><div><b>Changed after it was sent.</b> The commitments below are the last confirmed ones and <b>need reviewing</b>.</div></div>';
  var c=mowCommitForDate();
  if(!c||((!c.employees||!c.employees.length)&&(!c.vehicles||!c.vehicles.length))){
    box.innerHTML=html;return; // nothing on mowing today — stay quiet, all free for bins
  }
  function row(x,isVeh){var a=mowAvail(x,isVeh);
    return '<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid #eef2ef;align-items:center">'+
      '<div><b>'+esc(x.name)+'</b> <span class="muted small">'+(x.start?esc(x.start)+'–'+esc(x.end):'in use')+'</span></div>'+
      '<span class="rec '+a.cls+'" style="margin:0;padding:2px 9px;font-size:12px">'+esc(a.txt)+'</span></div>';}
  html+='<div class="card" style="margin:8px 0"><div style="font-weight:800;margin-bottom:2px">On mowing '+esc(dowName(DATE))+' — not free for bins</div>'+
    (c.employees||[]).map(function(e){return row(e,false);}).join('')+
    (c.vehicles||[]).map(function(v){return row(v,true);}).join('')+'</div>';
  box.innerHTML=html;
}
function mowConflicts(){
  var c=mowCommitForDate();if(!c)return[];
  var out=[],byId={},byVeh={};
  (c.employees||[]).forEach(function(e){byId[empId(e.name)]=e;});          // match by stable ID

  (STATE.shifts||[]).forEach(function(s){

      else out.push({cls:'bad',txt:esc(first(p))+' is on mowing all day but you’ve put them on bins — arrange cover or remove them.'});}});
    var vk=canonVeh(s.veh);

// Point 4: pressure-washing people/vehicles committed today become availability constraints for bins.
// Zenkit carries the booking but not a confirmed crew, so assignments are flagged UNCONFIRMED.
function pwConflicts(){

  jobs.forEach(function(j){ if(j.who){pwPeople[empId(j.who)]={name:j.who,conf:j.staffingConfirmed!==false};}
    if(j.veh){pwVeh[canonVeh(j.veh)]={name:j.veh,conf:j.staffingConfirmed!==false};} });
  var seenW={},seenV={};
  (STATE.shifts||[]).forEach(function(s){
    [s.who].concat(s.helpers||[]).forEach(function(p){var k=empId(p);if(k&&pwPeople[k]&&!seenW[k]){seenW[k]=1;var e=pwPeople[k];
      out.push({cls:e.conf?'bad':'warn',txt:esc(first(p))+' is '+(e.conf?'':'(unconfirmed) ')+'on pressure-washing today and also on bins — '+(e.conf?'they can’t do both.':'confirm which before relying on them.')});}});

/* ===================== boot / load ===================== */
async function boot(){
  if(DEMO){FEED=demoFeed();$('#demobar').innerHTML='<div class="demobar">DEMO LAYOUT — names &amp; vehicles are placeholders. Live loads the real roster from the secure feed.</div>';}
  else{try{var r=await fetch('/binsplan-review.json',{cache:'no-store'});if(!r.ok)throw 0;FEED=await r.json();}
    catch(e){$('#main').innerHTML='<div class="loading">Could not load the roster feed. Open through the planner login.</div>';return;}}
  $('#asof').textContent=FEED.generatedAt||'';
  var dp=$('#date');var dates=(FEED.weekDates||[]);
  DATE=(dates.indexOf(FEED.today)>=0)?FEED.today:(dates[0]||FEED.today);
  dp.value=DATE;dp.min=dates[0]||'';dp.max=dates[dates.length-1]||'';
  dp.onchange=function(){ if(!guardUnsaved()){dp.value=DATE;return;} DATE=dp.value;loadDay(); };
  $('#prev').onclick=function(){step(-1);};$('#next').onclick=function(){step(1);};
  $('#save').onclick=function(){doSave();};
  $('#reset').onclick=function(){if(DIRTY&&!confirm('Clear your changes and reset to the suggested roster?'))return;STATE=suggested();DIRTY=false;CONFLICT=null;render();toast('Reset to the suggested roster');};
  window.addEventListener('beforeunload',function(e){ if(DIRTY){e.preventDefault();e.returnValue='';} });
  loadDay();
}
// Point 3: never silently discard Wes's unsaved allocations when he moves to another date.
function guardUnsaved(){ return !DIRTY || confirm('You have unsaved changes to '+shortDay(DATE)+'.\n\nLeave this day without saving? Your changes will be lost.'); }
function step(n){var dp=$('#date');var nd=addDays(DATE,n);if(dp.min&&nd<dp.min)return;if(dp.max&&nd>dp.max)return;if(!guardUnsaved())return;DATE=nd;dp.value=nd;loadDay();}
function tmplKey(){return DOW+'|'+ROT;}
function rotLabel(){return ROT==='W1'?'Week 1':'Week 2';}
function dueRuns(){return (FEED.byDate&&FEED.byDate[DATE])||[];}
function runById(id){return dueRuns().find(function(r){return r.id===id;});}
function nSamples(){var t=FEED.template&&FEED.template[tmplKey()];return t?(t.nSamples||0):0;}

// Experience helpers (point 5) — who historically knows a run, keyed by stable runKey.
function expForRun(r){ var e=FEED.experience&&FEED.experience.byKey; if(!e||!r)return null; return e[r.runKey]||e[r.id]||null; }
function expRegulars(r){ var x=expForRun(r); return (x&&x.regulars)||[]; }
// Suggested roster = the learned history template, reconciled to today's ACTUAL Zenkit runs, THEN
// any run Zenkit shows but the template doesn't cover is offered to whoever on shift knows it best
// (experience) rather than silently dropped. This is a starting point driven by experience + the
// actual due work, not a fixed reproduction of the template.
function suggested(){
  var t=(FEED.template&&FEED.template[tmplKey()])||{shifts:[]};
  var due=dueRuns(),used={};
  var shifts=t.shifts.map(function(s){
    var rs=[];(s.runIds||[]).forEach(function(id){if(runById(id)){rs.push(id);used[id]=1;}});
    return {veh:s.veh,who:s.who,helpers:(s.helpers||[]).slice(),runs:rs};
  });
  // experience-based placement of uncovered runs: assign only when exactly one person ON SHIFT is a
  // known regular for it (unambiguous); otherwise leave it in Unassigned for Wes to decide.
  var tray=[];
  due.filter(function(r){return !used[r.id];}).forEach(function(r){
    var regs=expRegulars(r); var onShift=shifts.filter(function(s){return regs.indexOf(s.who)>=0;});
    if(onShift.length===1){ onShift[0].runs.push(r.id); used[r.id]=1; }
    else tray.push(r.id);
  });
  return {shifts:shifts,tray:tray};
}
async function loadDay(){
  DOW=dowName(DATE);ROT=rotationOf(DATE);
  $('#dow').textContent=shortDay(DATE);$('#rot').textContent=rotLabel()+' rotation';
  STATE=null;VERSION=0;var fromSaved=false,loadErr=null;
  if(!DEMO){
    try{
      var r=await fetch('/api/roster-review/'+DATE,{cache:'no-store'});   // SEPARATE review namespace
      if(r.ok){ var j=await r.json(); if(j.ok===false){loadErr=j.error||'load-failed';} else if(j.roster){STATE=j.roster;VERSION=j.version||0;fromSaved=true;} }
      else { loadErr='http-'+r.status; }   // a real failure — do NOT pretend it loaded
    }catch(e){ loadErr='unreachable'; }
  }
  // Point 3: if loading a SAVED roster failed, don't silently present a suggested roster as if all is well.
  if(loadErr){ STATE=suggested(); STATE._loadErr=loadErr; STATE._fromSaved=false; DIRTY=false; CONFLICT=null; await loadMowing(); render(); return; }
  if(!STATE){STATE=suggested();}else{reconcile();}
  STATE._fromSaved=fromSaved;DIRTY=false;CONFLICT=null;
  await loadMowing();
  render();
}
function reconcile(){
  STATE.shifts=STATE.shifts||[];STATE.tray=STATE.tray||[];
  STATE.shifts.forEach(function(s){s.helpers=s.helpers||[];});
  var due=dueRuns(),dueIds={};due.forEach(function(r){dueIds[r.id]=1;});
  var inPlan={};STATE.shifts.forEach(function(s){(s.runs||[]).forEach(function(id){inPlan[id]=1;});});STATE.tray.forEach(function(id){inPlan[id]=1;});
  var removed=0;
  STATE.shifts.forEach(function(s){s.runs=(s.runs||[]).filter(function(id){if(dueIds[id])return true;removed++;return false;});});
  STATE.tray=STATE.tray.filter(function(id){if(dueIds[id])return true;removed++;return false;});
  var added=[];due.forEach(function(r){if(!inPlan[r.id]){STATE.tray.push(r.id);added.push(r.id);}});
  STATE._added=added;STATE._removed=removed;
}

/* simple warnings — real workload only, NO maths shown */
function exceptions(){
  var out=[],due=dueRuns();
  due.forEach(function(r){
    if(r.type!=='CLEAN'||!r.clean)return;var c=r.clean;
    var unusual=(c.onceoff||0)+(c.catchup||0);
    if(unusual>=15){out.push({runId:r.id,text:'Extra '+unusual+' once-off / catch-up cleaning bins this week — may need assistance.'});return;}
    if(r.baseline!=null){var extra=(r.bins||0)-r.baseline;if(extra>=40)out.push({runId:r.id,text:'Extra '+extra+' cleaning bins vs a normal '+rotLabel()+' '+DOW+' — may need assistance.'});}
  });
  return out;
}

    openMenu(e.clientX,e.clientY,items);};});
  document.querySelectorAll('[data-mv]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var pr=b.dataset.mv.split('|'),si=+pr[0],id=pr[1];var regs=expRegulars(runById(id));
    var items=[{hd:'Move run to…'}];STATE.shifts.forEach(function(s,i){if(i!==si)items.push({act:'mvShift:'+si+':'+id+':'+i,label:first(s.who)+(s.veh?' ('+s.veh+')':'')+(regs.indexOf(s.who)>=0?'  ★ knows it':'')});});
    items.push({hd:'Share (keep on both)'});STATE.shifts.forEach(function(s,i){if(i!==si)items.push({act:'shareShift:'+si+':'+id+':'+i,label:'＋ '+first(s.who)});});
    items.push({act:'mvTray:'+si+':'+id,label:'↓ Unassigned'});
    openMenu(e.clientX,e.clientY,items);};});
  document.querySelectorAll('[data-asg]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var id=b.dataset.asg;var regs=expRegulars(runById(id));
    var items=[{hd:'Assign to…'}];
    // experienced people first (point 5)
    STATE.shifts.map(function(s,i){return {s:s,i:i,k:regs.indexOf(s.who)>=0?0:1};}).sort(function(a,b){return a.k-b.k;}).forEach(function(o){
      items.push({act:'asg:'+id+':'+o.i,label:first(o.s.who)+(o.s.veh?' ('+o.s.veh+')':'')+(o.k===0?'  ★ knows it':'')});});
    openMenu(e.clientX,e.clientY,items);};});
  document.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var si=+b.dataset.add;
    if(!STATE.tray.length){openMenu(e.clientX,e.clientY,[{hd:'No unassigned runs'}]);return;}
    var items=[{hd:'Add run'}];STATE.tray.forEach(function(id){var r=runById(id);items.push({act:'addrun:'+si+':'+id,label:r.short});});openMenu(e.clientX,e.clientY,items);};});
  var ae=$('#addemp');if(ae)ae.onclick=function(){STATE.shifts.push({veh:'',who:(FEED.staff||[''])[0],helpers:[],runs:[]});DIRTY=true;render();};
}

async function doSave(forceBase){
  if(DEMO){VERSION=(VERSION||0)+1;DIRTY=false;$('#saved').textContent='✓ Saved v'+VERSION+' (demo)';setTimeout(function(){$('#saved').textContent='';},2500);toast('Demo — nothing written. Live saves to the shared D1 store.');render();return;}
  if(SAVING)return;SAVING=true;$('#save').disabled=true;
  try{
    var base=(forceBase!=null)?forceBase:VERSION;
    var r=await fetch('/api/roster-review/'+DATE,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({roster:STATE,baseVersion:base})});
    var j=await r.json();
    if(j.ok){VERSION=j.version;DIRTY=false;CONFLICT=null;$('#saved').textContent='✓ Saved v'+VERSION;setTimeout(function(){$('#saved').textContent='';},2500);toast('Saved '+DATE);render();}
    else if(j.error==='conflict'){CONFLICT=j.currentVersion;render();toast('A newer version exists — your changes are kept; choose below.');}
    else toast('Save failed: '+(j.error||'error'));
  }catch(e){toast('Save failed — check your connection');}
  SAVING=false;$('#save').disabled=false;
}
boot();
</script>
</body></html>
